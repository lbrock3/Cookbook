/* writing quantities the way a cook would */
const GL_F = [[0.125, "1/8"], [0.25, "1/4"], [1 / 3, "1/3"], [0.375, "3/8"], [0.5, "1/2"], [0.625, "5/8"], [2 / 3, "2/3"], [0.75, "3/4"], [0.875, "7/8"]];
function glFmt(x) {
  let w = Math.floor(x + 1e-6), f = x - w;
  if (f > 0.98) { w += 1; f = 0; }
  if (f < 0.02) return String(w);
  const m = GL_F.find(a => Math.abs(a[0] - f) < 0.02);
  return m ? (w ? w + " " : "") + m[1] : String(Math.round(x * 100) / 100);
}
function glFmtIf(x, set) {
  let w = Math.floor(x + 1e-6), f = x - w;
  if (f > 0.98) { w += 1; f = 0; }
  if (f < 0.02) return w > 0 ? String(w) : null;
  const m = GL_F.find(a => Math.abs(a[0] - f) < 0.02 && set.indexOf(a[1]) >= 0);
  return m ? (w ? w + " " : "") + m[1] : null;
}
function glSmallVol(T) {
  if (T < 0.05) return "";
  const tb = Math.floor(T / 3 + 1e-6), ts = T - tb * 3;
  if (tb === 0) return glFmt(T) + " tsp";
  if (ts < 0.05) return tb + " tbsp";
  if (Math.abs(ts - 1.5) < 0.02) return glFmt(tb + 0.5) + " tbsp";
  return tb + " tbsp " + glFmt(ts) + " tsp";
}
function glVol(T) {
  const cups = T / 48, nice = T >= 12 - 1e-6 ? glFmtIf(cups, ["1/4", "1/3", "1/2", "2/3", "3/4"]) : null;
  if (nice) return nice + (cups > 1.0001 ? " cups" : " cup");
  if (T >= 48) {
    const c = Math.floor(cups + 1e-6), rest = T - c * 48;
    return c + (c > 1 ? " cups" : " cup") + (rest < 0.05 ? "" : " " + glSmallVol(rest));
  }
  return glSmallVol(T);
}
function glWt(oz) {
  if (oz >= 16 - 1e-6) {
    const lb = oz / 16, nice = glFmtIf(lb, ["1/4", "1/3", "1/2", "2/3", "3/4"]);
    if (nice) return nice + " lb";
    const w = Math.floor(lb + 1e-6);
    return w + " lb " + glFmt(oz - w * 16) + " oz";
  }
  return glFmt(oz) + " oz";
}
const glDec = x => String(Math.round(x * 10) / 10);
function glName(it) {
  const pl = n => /s$/i.test(n) && !/ss$/i.test(n);
  if (!it.u && it.has && it.cls === "ea") { const many = it.tot > 1.0001, m = it.names.filter(n => pl(n) === many); if (m.length) return m[0]; }
  return it.names[0];
}
function glText(it) {
  let q = "";
  if (it.has) {
    if (it.cls === "vol") q = glVol(it.tot);
    else if (it.cls === "wt") q = glWt(it.tot);
    else if (it.cls === "g") q = it.tot >= 1000 ? glDec(it.tot / 1000) + " kg" : glDec(it.tot) + " g";
    else if (it.cls === "ml") q = it.tot >= 1000 ? glDec(it.tot / 1000) + " L" : glDec(it.tot) + " ml";
    else {
      q = glFmt(it.tot);
      if (it.u) q += " " + (it.tot > 1.0001 ? (GL_PL[it.u] || it.u + "s") : it.u);
      if (it.size) q += " (" + it.size + ")";
    }
  }
  return (q ? q + " " : "") + glName(it);
}

/* adding up every recipe on the list */
function glBuild() {
  const map = new Map();
  GL.r.forEach(e => {
    const r = recBy[e.id]; if (!r || !r.ing) return;
    groupIng(r.ing).forEach(g => g.items.forEach(line => {
      const p = glParse(line);
      if (!p.name || /^((ice|hot|cold|warm|boiling|lukewarm|tap) )?water$/i.test(p.name)) return;
      const base = p.q != null ? GL_BASE[p.u] : null, cls = p.q == null ? "none" : base ? base[0] : (p.u ? "u" : "ea");
      const key = glKey(p.name) + "|" + cls + (cls === "u" ? p.u : "") + (p.size ? "|" + p.size.toLowerCase().replace(/\s+/g, "") : "");
      let it = map.get(key);
      if (!it) { it = { key, cls, u: base ? "" : p.u, size: p.size, tot: 0, names: [], src: [], has: p.q != null, aisle: glAisle(p.name, p.u) }; map.set(key, it); }
      if (p.q != null) it.tot += p.q * e.x * (base ? base[1] : 1);
      if (it.names.indexOf(p.name) < 0) it.names.push(p.name);
      if (it.src.indexOf(r.title) < 0) it.src.push(r.title);
    }));
  });
  const aisles = GL_AISLES.map(n => ({ name: n, items: [] }));
  Array.from(map.values()).sort((a, b) => glName(a).toLowerCase().localeCompare(glName(b).toLowerCase())).forEach(it => {
    const a = aisles.find(x => x.name === it.aisle) || aisles[aisles.length - 1];
    a.items.push({ key: it.key, text: glText(it), src: it.src.length > 3 ? it.src.slice(0, 3).join(", ") + " + " + (it.src.length - 3) + " more" : it.src.join(", "), done: !!GL.c[it.key] });
  });
  if (GL.m.length) aisles.push({ name: "Added by you", items: GL.m.map(m => ({ key: "m:" + m.id, id: m.id, text: m.t, src: "", manual: true, done: !!GL.c["m:" + m.id] })) });
  const shown = aisles.filter(a => a.items.length);
  let n = 0, d = 0; shown.forEach(a => a.items.forEach(i => { n++; if (i.done) d++; }));
  return { aisles: shown, n, d };
}

function glToggle(id, x) {
  if (!recBy[id]) return;

}

function glCountText(b, nr) { return nr + (nr === 1 ? " recipe" : " recipes") + " · " + b.n + (b.n === 1 ? " item" : " items") + (b.d ? " · " + b.d + " checked off" : ""); }
function glPlain() {

}
async function glCopy(text) {

}

/* ---------- scaling a recipe ---------- */
let SCALE = 1;
const SC_STEPS = [[0.5, "½×"], [1, "1×"], [2, "2×"], [3, "3×"], [4, "4×"]];

const SC_MEASURE = { tsp: 1, tbsp: 3, cup: 48 };

  return '<p class="crumbs"><a href="#">Contents</a><span aria-hidden="true">/</span><a href="#grocery">Grocery List</a></p><div class="chap"><h2 id="h">A Grocery List Was Sent to You</h2></div><div id="shared" data-code="' + esc(code) + '"><p class="empty">Loading…</p></div>';
}
async function loadShared() {
  const el = $("#shared"); if (!el) return;
  const code = el.dataset.code;
  if (!PHP) { el.innerHTML = '<p class="empty">Shared lists work on the main cookbook website.</p>'; return; }
  try {
    if (!SH[code]) { const r = await fetch("api.php?action=share&code=" + encodeURIComponent(code), { cache: "no-store" }); if (!r.ok) throw new Error("x"); SH[code] = (await r.json()).list; }
  } catch (e) { el.innerHTML = '<p class="empty">That list link has expired or isn’t right. Ask for a new one.</p>'; return; }
  const l = SH[code], items = (l.r || []).map(x => ({ r: lookup(x[0]), x: x[1] })).filter(x => x.r);
  const mine = GL.r.length || GL.m.length;
  el.innerHTML = '<p class="count">' + items.length + (items.length === 1 ? " recipe" : " recipes") + (l.m && l.m.length ? " and " + l.m.length + (l.m.length === 1 ? " extra item" : " extra items") : "") + '.</p>' +
    (items.length ? '<ul class="gl-recipes" style="max-width:34rem">' + items.map(x => "<li><span>" + esc(x.r.title) + "</span><small>" + esc(GL_X[x.x] || "") + "</small></li>").join("") + "</ul>" : "") +
    '<div class="rtools" style="margin-top:1rem"><button class="btn" type="button" data-glact="useshared" data-code="' + esc(code) + '">' + (mine ? "Use this list (replaces mine)" : "Use this list") + "</button>" + (mine ? '<button class="btn ghost" type="button" data-glact="mergeshared" data-code="' + esc(code) + '">Add to my list</button>' : "") + "</div>";
}
function glImport(code, merge) {
  const l = SH[code]; if (!l) return;
  const base = merge ? GL : { r: [], c: {}, m: [] };
  (l.r || []).forEach(x => { const id = canonId(x[0]); if (recBy[id] && !base.r.some(e => e.id === id)) base.r.push({ id, x: GL_X[x[1]] ? x[1] : 1 }); });
  (l.m || []).forEach(m => { if (!base.m.some(e => e.t === m.t)) base.m.push({ id: m.id || Date.now().toString(36), t: m.t }); });
  (l.c || []).forEach(k => { base.c[k] = 1; });
  GL = base; glSave(); go("grocery");
}

/* ---------- router ---------- */
function resolve(h) {
  h = decodeURIComponent(h || "");
  if (!h) return { v: home(), nav: "home", title: "" };
  if (h === "search") return { v: search(), nav: "search", title: "Search" };
  if (h === "grocery") return { v: groceryPage(), nav: "grocery", title: "Grocery List" };
  if (h.startsWith("list~")) return { v: sharedPage(h.slice(5)), nav: "grocery", title: "Shared Grocery List" };
  if (h === "favorites") return { v: favoritesPage(), nav: "favorites", title: "My Favorites" };
  if (h === "menus") return { v: menusIndex(), nav: "menus", title: "Favorite Menus" };
  if (!STANDALONE && h === "discuss") return { v: discussIndex(), nav: "discuss", title: "Discussion" };
  if (!STANDALONE && h.startsWith("discuss~")) return { v: threadPage(h.slice(8)), nav: "discuss", title: "Discussion" };
  if (h === "keeper") return { v: keeperPage(), nav: "keeper", title: "Edit Recipes" };
  if (h === "new" || h.startsWith("new~")) return { v: editorPage("new", h.slice(4)), nav: "keeper", title: "Add a Recipe" };
  if (h.startsWith("review~")) return { v: editorPage("review", h.slice(7)), nav: "keeper", title: "Review Submission" };
  if (h.startsWith("edit~")) { const p = h.slice(5).split("~"); return { v: editorPage("edit", p[0], p[1]), nav: "keeper", title: "Edit Recipe" }; }
  if (h === "submit") return { v: submit(), nav: "submit", title: "Share a Recipe" };
  if (h === "surprise") return { v: surprisePage(), nav: "surprise", title: "Surprise Me" };
  if (h.startsWith("menu~") && menuBy[h.slice(5)]) { const m = menuBy[h.slice(5)]; return { v: menuPage(m), nav: "menus", title: m.title }; }
  if (catBy[h]) return { v: category(catBy[h]), nav: "", title: catBy[h].name };
  if (recBy[h]) return { v: recipe(recBy[h]), nav: "", title: recBy[h].title, canon: h };
  const mv = canonId(h);
  if (mv !== h && recBy[mv]) return { v: recipe(recBy[mv]), nav: "", title: recBy[mv].title, canon: mv };
  return { v: home(), nav: "home", title: "" };
}
function route(h, quiet) {
  const res = resolve(h);
  if ((res.canon || h) !== curRoute) SCALE = 1;
  if (!res.canon && h !== "surprise") state.sPick = false;
  curRoute = res.canon || h;
  $("#view").innerHTML = res.v;
  paintDyn();
  glPaint();
  paintScale();
  paintMade();
  if ($("#shared")) loadShared();
  document.querySelectorAll("[data-nav]").forEach(a => a.getAttribute("data-nav") === res.nav ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
  document.title = res.title ? res.title + " · Family Cookbook" : "Family Cookbook";
  if (res.canon && location.hash.slice(1) !== res.canon) { try { location.hash = res.canon; } catch (e) {} }
  if (!quiet && h !== "search") { window.scrollTo(0, 0); const hd = $("#h"); if (hd) { hd.setAttribute("tabindex", "-1"); hd.focus({ preventScroll: true }); } }
}
function go(h) {
  try { if (location.hash.slice(1) !== h) location.hash = h; } catch (e) {}
  route(h);
}
document.addEventListener("click", e => {
  const a = e.target.closest && e.target.closest('a[href^="#"]');
  if (!a || e.defaultPrevented || e.metaKey || e.ctrlKey) return;
  e.preventDefault();
  if (a.hasAttribute("data-skip")) { $("#main").focus(); return; }
  go(a.getAttribute("href").slice(1));
});
window.addEventListener("hashchange", () => { const h = decodeURIComponent(location.hash.slice(1)); if (h !== curRoute) route(h); });
$("#sform").addEventListener("submit", e => { e.preventDefault(); });
$("#q").addEventListener("input", e => {
  state.q = e.target.value;
  if (curRoute !== "search") go("search"); else route("search", true);
  if (curRoute === "search") { /* keep typing focus */ }
});
document.addEventListener("keydown", e => {
  if (e.key === "/" && !/^(INPUT|TEXTAREA)$/.test((document.activeElement || {}).tagName)) { e.preventDefault(); $("#q").focus(); }
});
route(decodeURIComponent(location.hash.slice(1)), true);
initDb();
</script>
