e all ingredients in an ungreased baking dish","Bake uncovered for 30 minutes"],"by":"Marlene","attr":"Marlene","desc":"A simple vegetable casserole combining asparagus, peas, and mushroom soup with cheddar cheese and almonds.","prep":"5 minutes","cook":"35 minutes","serves":"4-6","diff":1,"cat":"casseroles"},{"slug":"BrocRice","title":"Broccoli and Rice Casserole","ing":["1 package frozen, chopped broccoli","1 medium onion, finely chopped","1/2 stick butter","1 cup Minute rice","1 can cream of mushroom or chicken soup","1/4 cup water","1/3 cup milk","1/2 cup Cheez-Whiz"],"dir":["Preheat the oven to 350°F","Cook the broccoli according to package directions & drain well","Sauté onion in butter. Place the broccoli, onion, butter and all other ingredients into a casserole dish.","Bake covered for 40 minutes."],"by":"Marcia","attr":"Marcia","desc":"Can be prepared ahead and frozen. Cook as below when thawed.","prep":"45 minutes","cook":"85 minutes","total":"130 minutes","serves":"4-6","diff":2,"cat":"casseroles"},{"slug":"CastIron","title":"Cast Iron Shepherd's Pie","ing":["2 pounds Russet potatoes, peeled and cut into 1\" pieces","1/2 cup milk","1 large egg","2 3/4 teaspoons salt","4 Tablespoons unsalted butter, melted plus 2 Tablespoons unsalted butter, not melted","1/2 teaspoon pepper","2 carrots, peeled and chopped","1 onion, chopped finely","1.5 pounds 93% lean ground beef","2 Tablespoons tomato paste","2 garlic cloves, minced","2 teaspoons minced fresh thyme or 1/2 teaspoon dried","2 Tablespoons all purpose flour","1.5 cups chicken broth","2 teaspoons Worcestershire sauce","1 cup frozen peas"],"dir":["Simmer potatoes with water and salt until tender, about 8-10 minutes. Drain and mash with milk, egg, melted butter, salt and pepper.","Heat cast iron skillet and melt remaining butter; sauté carrots and onions until softened, approximately 5 minutes.","Brown ground beef, breaking it apart as it cooks, about 8-10 minutes.","Add tomato paste, garlic, and thyme; cook until aromatic, roughly 1 minute.","Incorporate flour and cook for another minute.","Gradually add broth and Worcestershire sauce, scraping up browned bits; simmer until thickened, about 10 minutes.","Remove from heat and stir in peas; adjust seasoning.","Position oven rack 5\" from broiler and set to low.","Transfer potato mixture to zip-lock bag with corner snipped; pipe evenly over meat filling. Smooth and mark surface with fork tines.","Broil on rimmed baking sheet until golden and crusty, approximately 5-10 minutes.","Rest for 10 minutes before serving."],"by":"Marcia","attr":"America's Test Kitchen","desc":"Variation on popular pub grub & worth the effort","prep":"15 minutes","cook":"60 minutes","total":"75 minutes","serves":"4-6","diff":3,"tools":"10\" cast iron skillet, potato masher, 1 gallon zip-lock bag","cat":"casseroles"},{"slug":"ChickCass","title":"Chicken Casserole","ing":["2 pounds boneless, skinless chicken breasts","1 can cream of chicken soup","1 cup sour cream","1 stick butter","4 tablespoons poppy seeds","1.5 cups Ritz cracker crumbs"],"dir":["Boil chicken breasts in water for 10 minutes, reserving the broth for rice preparation","Trim and cut cooked chicken into bite-sized pieces","Heat oven to 350°F","Mix soup, sour cream, half the butter, and half the poppy seeds","Layer chicken and mixture in a casserole dish; top with crumbs, remaining poppy seeds, and butter dots","Bake 45 minutes","Prepare rice using reserved broth while casserole cooks","Serve casserole over rice bed"],"by":"Marcia","attr":"North American Expat Ladies","desc":"A creamy chicken dish combining poultry with sour cream and soup","prep":"15 minutes","cook":"60 minutes","serves":"4","diff":2,"cat":"casseroles"},{"slug":"Cordon","title":"Cordon Bleu Casserole","ing":["1 package frozen, cut broccoli (10 ounces, thawed)","4 slices rye or whole wheat bread, crusts trimmed","2.5 ounce package smoked chicken, thinly sliced","6 ounce package ham, thinly sliced","1/4 teaspoon onion powder","10 3/4 ounce can chunky creamy mushroom soup","3 ounces Swiss cheese, shredded"],"dir":["Rinse and pat dry broccoli","Line baking dish with bread","Layer chicken, ham, and broccoli on top","Mix onion powder and soup; pour over layers","Top with shredded cheese","Cover and refrigerate overnight (optional)","Microwave at 50% power for 13–15 minutes (unchilled) or 18–20 minutes (chilled)"],"by":"Rosemary","attr":"Rosemary","desc":"Fast, easy micro-meal","prep":"10 minutes","cook":"30 minutes","total":"40 minutes","serves":"4","diff":2,"tools":"8\"×8\"×2\" microwave baking dish","cat":"casseroles"},{"slug":"CornDress","title":"Cornbread Dressing","ing":["2 cups self-rising cornmeal","5-6 biscuits (canned, frozen, or homemade)","1 medium onion","1 can cream of chicken soup","4-5 cups turkey or chicken broth"],"dir":["Preparation (2-3 days ahead): Prepare cornmeal according to package directions","Prepare biscuits per package instructions","Crumble cornbread and biscuits together","Assembly day: Puree the onion","Warm cream of chicken soup until warm to touch","Combine bread, onion, soup, and broth until reaching desired consistency","Bake in greased 9x13 pan for 30-40 minutes until thickened"],"by":"Susan Hodge","attr":"Susan Hodge","desc":"Southern Cornbread Dressing makes a comforting, classic dish for the holidays! This recipe offers a moist, easy preparation that works well as a holiday side dish.","prep":"15 minutes","cook":"30-40 minutes","total":"1 hour","serves":"8","diff":2,"cat":"casseroles"},{"slug":"Cb-ADwR","title":"Cornbread-Apricot Dressing with Rosemary","ing":["4+ Tablespoons unsalted butter (divided)","1 cup diced dried apricots","1 cup water","1 yellow onion, chopped","1 Tablespoon fresh rosemary, minced","2 Teaspoons fresh sage, minced","8 cups crumbled, dried cornbread","1/4 cup chopped fresh flat-leaf parsley","Salt and pepper to taste","2 cups turkey or chicken stock, warmed"],"dir":["Preheat oven to 325°F; butter baking dish.","Boil apricots in water, then let stand 10 minutes until softened.","Melt butter in large sauté pan over medium heat; add onion and cook until tender (about 5 minutes).","Stir in rosemary and sage for 1-2 minutes until fragrant; add apricots and liquid, simmer until liquid nearly evaporates (4-5 minutes).","Combine cornbread, onion mixture, parsley, salt, and pepper in large bowl; add warmed stock and blend; adjust seasoning.","Transfer to baking dish and bake at 325°F for approximately 75 minutes until top is browned and crispy."],"by":"Hannah","attr":"Cathy","desc":"This is a Thanksgiving staple! I purchase cornbread from Publix, crumble and let it dry out for a couple of days prior to putting it together.","prep":"30 minutes","cook":"75 minutes","total":"2 hours","serves":"12","diff":2,"tools":"Large shallow baking dish","cat":"casseroles"},{"slug":"CrockPier","title":"Crockpot Pierogi Casserole","ing":["3 (16oz) boxes Mrs. T's frozen Cheddar Pierogies","4 cups chicken broth","1 (8oz) block cream cheese","1 cup shredded cheddar cheese","1 lb kielbasa, sliced","Salt and pepper to taste"],"dir":["Place all ingredients into slow cooker","Cook on high for 2-3 hours or low for 4-6 hours","Alternative: Bake at 350°F for 30-45 minutes","Reduced recipe option: Use 2 boxes pierogis, 2-3 cups broth, ½ cup cheese, and 4 oz cream cheese"],"by":"Susan","attr":"Susan","desc":"This is a good comfort dish on a cold night (or any night for that matter)","prep":"15 minutes","cook":"8 hours","serves":"6-8","diff":2,"cat":"casseroles"},{"slug":"Escort","title":"Escort Chicken Casserole","ing":["6 boneless, skinless chicken breasts","1 box Escort crackers, crushed","1 can sliced water chestnuts","1 can cream of mushroom soup","1 can cream of chicken soup","8 oz sour cream","1 stick butter, sliced"],"dir":["Preheat oven to 350°F","Boil chicken breasts until tender; cut into bite-sized pieces","Layer half the crushed crackers in a baking dish","Mix chicken, chestnuts, soups, and sour cream together","Pour mixture over crackers","Top with remaining crackers and dot with butter slices","Bake 25-30 minutes"],"by":"Marilyn","attr":"Marilyn","desc":"A classic chicken casserole featuring crushed Escort crackers as both a base and topping layer. The recipe notes that modern boxes contain two cellophane packages; only one is needed.","prep":"30 minutes","cook":"60 minutes","serves":"6","diff":2,"cat":"casseroles"},{"slug":"Goulash2","title":"Goulash","ing":["4-5 medium potatoes","1 pound hamburger","1 medium onion","2 small cans tomato sauce","8 ounces grated cheese"],"dir":["Peel potatoes and cut into thin, small pieces resembling fried potatoes","Brown the hamburger and onion together in a dutch oven","Add potatoes and tomato sauce, plus a little water from rinsing the cans","Simmer over medium heat approximately 20 minutes until potatoes become tender","Transfer from heat, top with grated cheese, and allow it to melt before serving"],"by":"Marcia","attr":"Mary/Gram/Mom","desc":"Great cold weather comfort food","prep":"15 minutes","cook":"35 minutes","total":"50 minutes","serves":"8","diff":1,"tools":"Dutch oven","cat":"casseroles"},{"slug":"Lasagna","title":"Lasagna","ing":["2-3 pounds ground chuck","1 medium onion, chopped","Salt & pepper to taste","1 Tablespoon garlic powder","1 Tablespoon basil","1 Tablespoon oregano","1 Tablespoon parsley","1 small can tomato paste","1 small can tomato sauce","1 large can tomato sauce","8 lasagna noodles","1 egg","1/2 pound cottage cheese","3 ounces cream cheese","1/2 cup parmesan cheese","1 package sliced mozzarella cheese"],"dir":["Preheat oven to 350°F.","Brown ground meat in skillet; drain fat. Mix in onion, seasonings, tomato paste and sauce; simmer 30 minutes.","Cook 8 lasagna noodles per package directions.","Combine cottage cheese, cream cheese, parmesan, parsley, and egg.","Layer in buttered pan: 1/3 meat sauce, 1/2 noodles, cheese mixture, 1/3 sauce, 1/2 noodles, remaining 1/3 sauce. Top with mozzarella slices.","Bake at 350°F for 30 minutes."],"by":"Marilyn","attr":"Marilyn","desc":"Classic Lasagne","prep":"30 minutes","cook":"90 minutes","total":"120 minutes","serves":"6-8","diff":2,"tools":"Lasagne pan","cat":"casseroles"},{"slug":"MacnCheese","title":"Macaroni & Cheese","ing":["1 1/2 cups raw macaroni, cooked","8 ounces cheddar cheese, cubed","Milk, enough to cover the pan 1/2 - 3/4 way up","1/4 stick butter"],"dir":["Preheat oven to 400°F","Combine cooked macaroni and cubed cheese in a shallow baking dish","Pour milk to fill dish halfway to three-quarters full","Distribute thin butter slices across the top","Bake uncovered 20-30 minutes until cheese melts and most milk evaporates. Optional: broil briefly at end for a crispier top"],"by":"Marcia","attr":"Mary/Gram/Mom","desc":"Gram's Mac & Cheese. 'Nuff said.","prep":"20 minutes","cook":"40 minutes","total":"60 minutes","serves":"6","diff":2,"tools":"Shallow baking dish","cat":"casseroles"},{"slug":"Quiche","title":"Quiche Lorraine","ing":["9 inch pie pan with pastry","4 strips bacon","1 onion, chopped","1 cup Swiss cheese, cubed","1/4 cup parmesan cheese","4 eggs, slightly beaten","1 pint Half & Half (2 cups)","1/4 teaspoon nutmeg","1/2 teaspoon salt","1/4 teaspoon white pepper"],"dir":["Heat oven to 450 degrees","Pre-bake pastry shell for 5 minutes","Fry bacon, reserve 1 tablespoon fat; sauté onion until translucent, drain","Combine crumbled bacon, onion, and both cheeses in crust","Whisk eggs with Half & Half, nutmeg, salt, and pepper; pour over filling","Bake 15 minutes at 450°F, then reduce to 350°F for approximately 10 minutes until a knife inserted near the edge emerges clean"],"by":"Marcia","attr":"Marcia","desc":"Classic quiche from scratch","prep":"30 minutes","cook":"60 minutes","total":"90 minutes","serves":"6-8","diff":2,"cat":"casseroles"},{"slug":"Sheph","title":"Shepherd's Pie","ing":["4 medium potatoes","Milk (splash)","Butter (dab)","1 pound hamburger meat","Worcestershire sauce (5 squirts)","Salt and pepper to taste","1 can tomato soup","1 can green beans","½ to 1 cup shredded cheddar cheese"],"dir":["Heat oven to 350 degrees.","Boil peeled potatoes until soft (about 10 minutes), then mash with milk and butter.","Brown ground beef in skillet with worcestershire, salt, and pepper; drain and transfer to casserole dish.","Stir in tomato soup, layer green beans, then add mashed potatoes on top; sprinkle cheese over all.","Bake uncovered for approximately 20 minutes until cheese melts."],"by":"Leon and Mary Brock","attr":"Lydia Barineau","desc":"Good pub grub","prep":"15 minutes","cook":"35 minutes","total":"50 minutes","serves":"6 to 8","diff":1,"cat":"casseroles"},{"slug":"SweetPotat","title":"Sweet Potato Casserole","ing":["Potatoes: 1/2 stick butter, melted","Potatoes: 3 cups mashed sweet potatoes","Potatoes: 1/2 cup milk","Potatoes: 1 cup sugar","Potatoes: 1 teaspoon pure vanilla extract","Potatoes: 2 eggs, well beaten","Potatoes: 1 teaspoon cinnamon","Topping: 1/2 cup all-purpose flour","Topping: 1 cup brown sugar","Topping: 1 stick unsalted butter, melted","Topping: 1 cup chopped pecans"],"dir":["Heat oven to 350°F","Combine butter, sweet potatoes, milk, sugar, vanilla, eggs, and cinnamon","Prepare topping by mixing flour, brown sugar, melted butter, and pecans","Transfer potato mixture to baking dish and distribute topping evenly","Bake 25 minutes at 350°F"],"by":"Susan Hodge","attr":"Susan Hodge","desc":"A holiday casserole featuring mashed sweet potatoes with a nutty pecan crumb topping instead of traditional marshmallows, creating textural contrast.","prep":"15 minutes","cook":"40 minutes","serves":"6-8","diff":2,"cat":"casseroles"},{"slug":"Souffle","title":"Sweet Potato Souffle","ing":["Souffle: 1/2 cup butter (1 stick), room temperature, plus more for greasing","Souffle: 5 medium sweet potatoes","Souffle: 2 large eggs","Souffle: 1 cup granulated sugar","Souffle: 1 1/2 teaspoons vanilla extract","Souffle: 1/2 cup milk","Souffle: Pinch of salt","Topping: 1 cup finely chopped pecans","Topping: 1 cup packed brown sugar","Topping: 1/2 cup all-purpose flour","Topping: 1/4 cup butter (1/2 stick), softened"],"dir":["For the souffle: Preheat oven to 350°F. Butter a 2 1/2-quart baking dish. Bake fork-pierced sweet potatoes on foil-lined sheet until tender (about 1 hour). Cool, peel, and mash the flesh. Combine with eggs, sugar, butter, vanilla, milk, and salt using an electric mixer. Transfer to prepared dish.","For the topping: Mix pecans, brown sugar, flour, and butter until combined. Spread evenly over potato mixture. Bake until lightly browned (about 40 minutes). Rest 5 minutes before serving."],"by":"Hannah","attr":"Hannah","desc":"A classic casserole combining creamy sweet potato base with a pecan-brown sugar topping","prep":"30 minutes","cook":"2.5 hours","serves":"8","diff":3,"cat":"casseroles"},{"slug":"TeaCup","title":"Tea Cup's Chicken Casserole","ing":["Doritos or tortilla chips, crushed (enough for 9x13 dish base)","2 cups cooked chicken, cubed","1 can cream of mushroom soup","1 can cream of chicken soup","1 cup milk","1 can Rotel tomatoes with green chilies, diced","1 teaspoon chili powder","1/2 cup chopped onion","8 ounces grated cheddar cheese"],"dir":["Heat oven to 350°F","Line a 9x13 inch casserole with crushed Doritos. Arrange the chicken over the Doritos. Combine remaining ingredients except cheese; pour over chicken. Top with cheese. Bake 30-45 minutes."],"by":"Marcia","attr":"North American Expat Ladies","desc":"A simple casserole combining tortilla chips, cooked chicken, and creamy soups with a Southwestern twist.","prep":"15 minutes","cook":"45-60 minutes","serves":"6-8","diff":1,"tools":"9\" x 13\" casserole dish","cat":"casseroles"},{"slug":"TunaCass","title":"Tuna Casserole","ing":["Pam cooking spray","Small box elbow macaroni or shells","1 cup grated cheddar cheese (adjustable)","1 can cream of celery soup","10 ounces canned tuna","½ cup sliced green olives (adjustable)","1 soup can of milk","Pinch of salt","Butter (small amount)"],"dir":["Heat oven to 350°F","Coat baking dish with cooking spray","Cook pasta per package instructions; drain","Combine pasta, cheese, soup, tuna, olives, milk, and salt in a bowl, adjusting milk for desired consistency","Transfer mixture to prepared dish; dot with butter","Bake uncovered 20-25 minutes until golden","Rest 5 minutes before serving"],"by":"Marlene","attr":"Marlene","desc":"A family favorite that has delighted multiple generations, this dish works especially well when accompanied by fordhook lima beans.","prep":"15 minutes","cook":"35-40 minutes","total":"50-55 minutes","serves":"4-6","diff":2,"tools":"8\" x 12\" baking dish","cat":"casseroles"},{"slug":"Veggie","title":"Vegetable Casserole","ing":["2 tablespoons butter","1/2 cup chopped celery","1/4 cup chopped green pepper","1/2 cup chopped onion","1 can shoe peg corn, drained","1 can French style green beans, drained","1 cup sour cream","1 can cream of celery soup","1/2 cup grated cheese (or more)","1 stick butter, melted","1/2 box Cheez-It crackers, crushed"],"dir":["Heat oven to 350°F","Sauté celery, pepper, and onion for 5 minutes until onion becomes transparent","Combine sautéed vegetables with corn, green beans, sour cream, soup, and cheese; transfer to casserole dish","Mix melted butter with crushed crackers; spread evenly over casserole","Bake uncovered 30-40 minutes until bubbling"],"by":"Susan Hodge","attr":"Marilyn Brock","desc":"A cherished Hodge family holiday staple that can be assembled in advance and frozen, with final components added before baking.","prep":"15 minutes","cook":"1 hour","total":"1 hour 15 minutes","serves":"6-8","diff":1,"tools":"9\" x 13\" casserole dish","cat":"casseroles"},{"slug":"Williamsburg","title":"Williamsburg Souffle","ing":["8 slices day-old bread, cubed","1/4 cup butter","2 cups fresh mushrooms, sliced","1 onion, finely chopped","2 cups cooked ham, diced","4 cups cheddar cheese, shredded","2 tablespoons all-purpose flour","8 eggs","2 1/2 cups milk","2 tablespoons prepared mustard","1 teaspoon salt"],"dir":["Heat oven to 350°F","Arrange bread cubes in buttered dish","Sauté mushrooms and onion in butter until tender; layer over bread with ham","Mix cheese and flour; sprinkle over ham","Whisk eggs, milk, mustard, and salt; pour over cheese","Cover and refrigerate overnight","Let sit 30 minutes at room temperature, then bake uncovered 45-60 minutes at 350°F"],"by":"Roz","attr":"Roz","desc":"A layered casserole dish combining bread, sautéed mushrooms and onions, ham, and cheddar cheese bound together with an egg and milk custard.","prep":"30 minutes","cook":"45-60 minutes (plus overnight refrigeration)","total":"30 minutes active prep, overnight chill, then 45-60 minutes baking","serves":"6","diff":2,"tools":"9\"x13\" casserole dish at least 2\" deep","cat":"casseroles"}]},{"slug":"cocktails","name":"Cocktails","recipes":[{"slug":"Blood","title":"Bloody Mary","ing":["1 ounce vodka (unflavored)","V8 Vegetable Juice","Worcestershire Sauce","Soy Sauce","Garlic Pepper (or cumin, coriander seeds, nutmeg, allspice)","Fresh Ground Pepper","Tabasco Sauce","Salt","Crushed ice","Dill Pickle Spears (Claussen brand recommended)","Crisp bacon strips"],"dir":["Pour vodka into glass","Fill glass 3/4 full with vegetable juice","Add Worcestershire, soy sauce, garlic pepper, fresh pepper, Tabasco, and salt","Stir, taste, and adjust seasonings as needed","Add ice and stir","Garnish with pickle spear and/or bacon strip; serve with straw"],"by":"Cathy","attr":"Cathy","desc":"This is a customizable vodka-based cocktail. As the recipe notes, \"Bloodies are better when made to taste; that's the draw of a Bloody Bar.\"","prep":"5 minutes","total":"5 minutes","serves":"1","diff":1,"tools":"Tall highball glass (10-12 ounce); Collins straw","cat":"cocktails"},{"slug":"ChristMule","title":"Christmas Mule","ing":["1 1/2 ounce Vodka","1/2 ounce sugar syrup","1/2 ounce cranberry juice","3 ounces chilled ginger beer (Vernor's, Bleinhem's, etc)"],"dir":["Combine ingredients and serve over ice.","Nice!"],"by":"Marcia","attr":"Santa","desc":"A nice refreshing holiday drink.","prep":"5 minutes","cook":"5 minutes","total":"10 minutes","serves":"1","diff":1,"cat":"cocktails"},{"slug":"CranPunch","title":"Cranberry Punch","ing":["1 quart cranberry juice cocktail","1 quart pineapple juice","1 teaspoon almond extract","Ice ring (with maraschino cherries frozen inside, optional)","7 Up, 2-liter bottle (ginger ale may be substituted)"],"dir":["Combine juices and extract together","Pour mixture over ice ring in punch bowl and add 7 Up just before serving"],"by":"Marilyn","attr":"Marilyn","desc":"Great holiday punch for the whole family","prep":"5 minutes","cook":"5 minutes","total":"10 minutes","serves":"Punchbowl full","diff":1,"tools":"Punch bowl","cat":"cocktails"},{"slug":"Effen","title":"Effen","ing":["Effen Cucumber Vodka, 1 ounce (preferably from the freezer)","Lemonade, old school (not sugar free, fat free, or gluten free)","Ice, cubed"],"dir":["Pour the vodka into the glass","Add a small handful of ice and lemonade until the glass reaches three-quarters full; stir to combine","Insert straw and enjoy this refreshing beverage"],"by":"Rick","attr":"Marcia","desc":"Delightful, uber-refreshing summer drink","prep":"2 minutes","cook":"2 minutes","total":"4 minutes","serves":"1","diff":1,"tools":"10-12 ounce highball glass; Collins straw","cat":"cocktails"},{"slug":"MaiTai","title":"Mai Tai","ing":["½ ounce Hana Bay white rum","¼ ounce orange Curacao","½ ounce Orgeat syrup","2 ounces pineapple juice","2 ounces Hana Bay dark rum"],"dir":["Combine the first four ingredients (optional: blend with ice)","Pour into glass","Add ice cubes as preferred, then gently pour dark rum to create a floating layer on top"],"by":"Max & Mary","attr":"Mamas Fish House in Maui","desc":"The Real Deal","prep":"5 minutes","total":"10 minutes","serves":"1","diff":1,"tools":"An original Mamas Fish House Mai Tai glass is recommended, though these are quite rare.","cat":"cocktails"},{"slug":"RussTea","title":"Russian Tea","ing":["2 cups sugar","1 cup instant tea (unsweetened)","14 ounces Tang (approximately 2 cups)","2 teaspoons cinnamon","2 teaspoons ground cloves"],"dir":["Combine all ingredients together","Mix 2 teaspoons with 8 ounces of water, more or less of each to taste"],"by":"Marilyn","attr":"Someone in Russia","desc":"Beverage (unless you use Stolichnaya instead of water, then it becomes Rocket Fuel)","prep":"5 minutes","cook":"5 minutes","serves":"120 glasses (at 2 teaspoons per glass)","diff":1,"cat":"cocktails"}]},{"slug":"cookies-brownies-bars","name":"Cookies, Brownies & Bars","recipes":[{"slug":"BlackBean","title":"Black Bean Brownies","ing":["1 can (15 ounce) black beans, rinsed and drained","½ cup semisweet chocolate chips, divided","3 tablespoons canola oil","3 large eggs, room temperature","⅔ cup packed brown sugar","½ cup cocoa powder","1 teaspoon vanilla extract","½ teaspoon baking powder","⅛ teaspoon salt"],"dir":["Heat oven to 350°F. Line an 8×8-inch pan with parchment paper.","Combine beans, ¼ cup chocolate chips, and oil in food processor until blended.","Add eggs, brown sugar, cocoa powder, vanilla, baking powder, and salt; process until smooth.","Transfer mixture to parchment-lined pan. Top with remaining chocolate chips.","Bake 20–25 minutes until toothpick inserted in center comes out clean. Cool on wire rack before cutting into bars."],"by":"Mary Hodge","attr":"Mary Hodge","desc":"You'd never guess these rich, velvety chocolate treats contain a can of black beans. They are so amazing!","prep":"15 minutes","cook":"20–25 minutes plus cooling","total":"Approximately 40–50 minutes plus cooling","serves":"12","diff":1,"tools":"Food processor, parchment paper","cat":"cookies-brownies-bars"},{"slug":"WhyBoil","title":"Boiled Cookies","ing":["2 cups Sugar","1/2 cup Milk","1/4 cup Butter, salted","3 tablespoons Cocoa powder","1 teaspoon Vanilla extract","3 cups Quick-cook oats","1/2 cup Peanut butter (optional)","1/2 cup Pecans (optional)"],"dir":["Prepare two baking sheets with parchment paper.","Heat sugar, milk, butter, and cocoa in a saucepan over medium heat, whisking constantly until boiling.","Maintain the boil without stirring for exactly one minute.","Remove from heat; fold in vanilla, oats, and optional peanut butter and pecans.","Mix until glossy and uniform; scoop about 2 tablespoons onto paper using an ice cream scoop.","Refrigerate for one hour before serving.","Keep in an airtight container in the refrigerator for up to two weeks."],"attr":"Rosemary, Rick","desc":"A no-bake chocolate cookie recipe from a family cookbook.","prep":"10 minutes","cook":"20 minutes","total":"30 minutes","serves":"24 small cookies","diff":2,"tools":"Ice cream scoop; Wax or parchment paper","cat":"cookies-brownies-bars"},{"slug":"Browny","title":"Brownies","ing":["1 stick butter, melted","2/3 cup all-purpose flour","1 teaspoon vanilla extract","4 tablespoons cocoa powder","2 eggs","1 cup sugar"],"dir":["Heat oven to 375°F. Prepare a 9\"x13\" baking dish with grease.","Combine butter, flour, vanilla, cocoa powder, eggs, and sugar in a medium bowl. Blend thoroughly until the mixture achieves a glossy consistency.","Bake 20-22 minutes until a toothpick test indicates doneness. Cool on a rack and cut into portions."],"by":"Leon and Mary Brock","attr":"Lydia Barineau","desc":"Simple chocolate brownies","prep":"30 minutes","cook":"45 minutes","serves":"12","diff":1,"tools":"9\"x13\" baking dish","cat":"cookies-brownies-bars"},{"slug":"Chess","title":"Chess Cookies","ing":["1 box Duncan Hines Yellow cake mix (or equivalent)","4 Eggs","1 stick Butter, softened","1 8-ounce package Cream cheese, softened","3 cups Powdered Sugar","1/2 cup Walnuts or pecans, chopped"],"dir":["Preheat oven to 350°F","Combine softened butter and cake mix until sandy texture forms","Beat one egg and mix into cake layer","Press mixture into greased 9\"x13\" baking dish, approximately 1/4 inch thick","Cream the softened cream cheese","Add remaining eggs one at a time, blending fully between additions","Mix in powdered sugar carefully without overmixing; fold in nuts","Pour cream cheese mixture over cake base","Bake 30-40 minutes until toothpick inserted in center comes out clean","Cool in pan before cutting into squares"],"attr":"Marilyn","desc":"A layered cookie combining a cake mix crust with a creamy topping","prep":"20 minutes","cook":"60 minutes","total":"80 minutes","serves":"12","diff":2,"tools":"Hand mixer or stand mixer; Toothpicks; Cooking Spray","notes":"A variation in the cookie is to use Duncan Hines chocolate cake mix.","cat":"cookies-brownies-bars"},{"slug":"ChocoyChips","title":"Chocolate Chip Cookies","ing":["2/3 cup shortening or butter, softened","1/2 cup sugar","1/2 cup packed brown sugar","1 egg","1 teaspoon vanilla extract","1 1/2 cups all-purpose flour","1/2 teaspoon baking soda","1/2 teaspoon salt","6 ounces semisweet chocolate chips","1/2 cup chopped pecans or walnuts (optional)"],"dir":["Heat oven to 375°F.","Cream together fats, sugars, egg, and vanilla until golden and smooth.","Sift flour, baking soda, and salt in separate bowl.","Combine wet and dry mixtures, then fold in chocolate chips and nuts if desired.","Drop tablespoon-sized portions 2 inches apart on ungreased sheet.","Bake 8–10 minutes until set. Cool on wire racks."],"by":"Marcia","attr":"Marcia","prep":"20 minutes","cook":"30 minutes","total":"50 minutes","serves":"2 dozen cookies","diff":2,"tools":"Hand mixer or stand mixer (optional)","notes":"Source: Five Family Cookbook. Increase flour by 1/4 for a softer cookie.","cat":"cookies-brownies-bars"},{"slug":"Pillow","title":"Chocolate Peanut Pillows","ing":["6 ounces semi-sweet chocolate chips","1 tablespoon shortening","1/2 cup creamy peanut butter","2 tablespoons confectioner sugar","1 (15 ounce) box Post Shredded Wheat Big Biscuits","1/2 cup peanuts, finely chopped"],"dir":["Melt chocolate chips with shortening in a medium saucepan over low heat, stirring often.","Remove from heat and blend in peanut butter and confectioners sugar.","With a fork, dip Shredded Wheat Biscuits in chocolate mixture, coating all sides; gently shake off excess.","Roll biscuits in chopped peanuts while the chocolate is still tacky. Cool on rack, store in refrigerator."],"by":"Cathy","attr":"Cathy","prep":"15 minutes","cook":"15 minutes","total":"30 minutes","serves":"18 pillows","diff":1,"cat":"cookies-brownies-bars"},{"slug":"cookie-brownies","title":"Cookie Brownies","ing":["1 cup flour","1/2 cup brown sugar","1/2 cup softened butter","3 tablespoons sugar","1/4 teaspoon salt","1/4 teaspoon vanilla extract","1/4 cup milk","2 eggs","Chocolate chips (as desired)"],"dir":["Heat oven to 350 degrees","Combine all ingredients except chocolate chips using an electric mixer in a large bowl","Fold in chocolate chips with spatula","Prepare 9x9 pan with cooking spray or butter","Transfer mixture to pan and level the surface","Bake 14-20 minutes until golden"],"by":"Olivia Brock","attr":"Olivia Brock","prep":"5 minutes","cook":"14-20 minutes","total":"19-25 minutes","serves":"Approximately 10","diff":1,"tools":"Pam or butter, 9x9 pan, spatula, hand or stand mixer, large mixing bowl","notes":"You can leave out the eggs and make edible raw cookie dough!!","cat":"cookies-brownies-bars"},{"slug":"DateNut","title":"Date Nut Balls","ing":["1/2 cup Butter or margarine","3/4 cup Sugar","1 (8oz) pkg Dates, pitted and minced","2 1/2 cup Puffed rice cereal","1 cup Pecans, chopped","Flaked coconut or powdered sugar to coat"],"dir":["Combine butter, sugar, and dates in a medium saucepan over high heat.","Bring mixture to a boil. Cook, stirring constantly, 3 minutes. Remove from heat.","Stir in rice cereal and pecans until fully coated and sticky.","Rest mixture in the refrigerator until cool to touch, about 30 minutes.","Grease your hands or work with food gloves to shape the mixture into 1\" balls. Roll each ball in flaked coconut or powdered sugar.","Store in an air-tight container."],"attr":"Mom","serves":"12 (1-inch) balls","diff":2,"notes":"From Five Family Cookbook.","cat":"cookies-brownies-bars"},{"slug":"FruitCake","title":"Fruit Cake Cookies","ing":["1 cup shortening","2 cups brown sugar, firmly packed","2 eggs","4 cups all-purpose flour","1 teaspoon baking soda","1 teaspoon salt","2/3 cup buttermilk","1 cup pecans, chopped","1 cup candied cherries, cut into quarters","2 cups dates, chopped","1 cup candied fruit and peel, chopped","2 cups red and green cherry halves (optional garnish)","2 cups pecan halves (optional garnish)"],"dir":["Cream shortening until pale; gradually incorporate sugar while beating. Add eggs individually, beating thoroughly after each addition.","Sift flour, baking soda, and salt together in a separate bowl. Alternate adding this mixture with buttermilk to the creamed mixture, starting and finishing with dry ingredients.","Fold in pecans, quartered cherries, dates, and candied fruit and peel evenly. Refrigerate dough for at least 2 hours or overnight.","Heat oven to 375°F. Lightly coat two baking sheets with cooking spray.","Spoon dough by tablespoon portions onto sheets, spacing 2 inches apart. Garnish each with a cherry or pecan half.","Bake 8 to 10 minutes. Cool on wire racks."],"by":"Gram","attr":"Gram","prep":"20 minutes","cook":"3 hours","total":"3 hours 20 minutes","serves":"3 dozen cookies","diff":2,"tools":"Stand mixer or hand mixer, cooking spray","cat":"cookies-brownies-bars"},{"slug":"mega-chocolate-chip-cookies","title":"Mega Chocolate Chip Cookies","ing":["1 cup salted butter, cubed","1/2 cup light brown sugar, packed","1/2 cup dark brown sugar, packed","1/2 cup white sugar","2 eggs","3 cups all-purpose flour","1 teaspoon cornstarch","1 teaspoon baking soda","1 teaspoon salt","2 teaspoons vanilla extract","6 cups semi-sweet chocolate chips, divided","2 cups mini chocolate chips","Sea salt for sprinkling"],"dir":["Cream butter and sugars for 5 minutes until smooth; incorporate eggs individually until pale batter forms","Sift flour, cornstarch, and baking soda separately; combine with batter, vanilla, and salt without overmixing","Mix in 2 cups chocolate chips; shape dough into 6\"x8\" rectangle, cut into twelve 2\"x2\" squares, form balls, refrigerate 30+ minutes","Preheat oven to 400°F","Coat chilled dough balls with 4 cups chocolate chips and mini chips; fill gaps with mini chips","Bake on parchment for 17 minutes until golden; immediately sprinkle sea salt and fill any remaining gaps while hot"],"by":"Hannah","attr":"Hannah","desc":"A homemade interpretation of Gideon's Bakehouse cookies, featuring oversized chocolate chip cookies weighing approximately half a pound each. The recipe allows for creative variations using white chocolate, nuts, butterscotch, or caramel alongside the primary chocolate chips.","prep":"25 minutes","cook":"45 minutes","total":"70 minutes","serves":"12","diff":3,"tools":"Stand mixer or electric hand mixer","cat":"cookies-brownies-bars"},{"slug":"Neiman","title":"Neiman Marcus Chocolate Chip Cookies","ing":["2 cups butter","2 cups sugar","2 cups brown sugar","4 eggs","2 teaspoons vanilla extract","4 cups all-purpose flour","5 cups rolled oatmeal (pulsed finely)","1 teaspoon salt","2 teaspoons baking powder","2 teaspoons baking soda","24 ounces chocolate chips","1 (8 ounce) Hershey bar, grated","3 cups chopped nuts"],"dir":["Heat oven to 375°F","Cream butter and sugars; add eggs and vanilla","Sift flour, baking powder, and baking soda separately","Combine wet and dry ingredients in batches; fold in chocolate, Hershey bar, and nuts","Form 1-inch balls; space 2 inches apart on greased sheets","Bake 10 minutes; cool on wire rack"],"by":"Marcia","attr":"Marcia","desc":"A legendary recipe reportedly from a Neiman Marcus food hall customer who requested the recipe and was charged $250 for it.","prep":"45 minutes","cook":"55 minutes","total":"100 minutes","serves":"10 dozen cookies","diff":2,"tools":"Hand mixer or stand mixer (optional)","notes":"For best results, rest cookie dough in fridge for up to 2 hours before baking.","cat":"cookies-brownies-bars"},{"slug":"Brittle","title":"Peanut Brittle","ing":["1.5 cups Sugar","1/2 cup Light Karo syrup","1/4 cup Water","2 cups Peanuts","1/4 teaspoons Salt","1.5 teaspoons Baking Soda"],"dir":["Prepare a greased rimmed cookie sheet and set it aside.","Combine sugar, karo syrup, and water in a large saucepan.","Attach candy thermometer and heat mixture, stirring occasionally until reaching 250°F.","Add peanuts and stir constantly until temperature reaches 300°F.","Remove from heat and immediately stir in salt and baking soda until foamy.","Pour onto prepared sheet, spread evenly with knife or spatula, and cool 30+ minutes.","Break into pieces and enjoy."],"attr":"Mom & Dad","desc":"Classic homemade candy from the Five Family Cookbook","serves":"8-10 servings","diff":3,"tools":"Rimmed cookie sheet; Candy thermometer","notes":"I have salt and soda measured in a little bowl, ready to put in at the last second.","cat":"cookies-brownies-bars"},{"slug":"Balls","title":"Peanut Butter Balls","ing":["1/2 cup butter, softened","1 (16 ounce) jar creamy peanut butter","2 cups confectioners sugar","2 cups semi-sweet chocolate chips"],"dir":["Combine confectioners sugar with peanut butter until stiff and easily formed into a ball.","Shape mixture into 24 one-inch balls with greased hands; chill 30 minutes on parchment-lined sheets.","Melt chocolate chips via package directions using a water bath or microwave until smooth.","Dip each ball in melted chocolate using a fork until fully coated; place on wax paper and refrigerate until set."],"attr":"Mom","desc":"Classic homemade chocolate-covered peanut butter confection","serves":"2 dozen balls","diff":1,"tools":"Parchment or wax paper","cat":"cookies-brownies-bars"},{"slug":"PButter","title":"Peanut Butter Cookies","ing":["1 cup butter, softened","1 cup sugar","1 cup brown sugar, firmly packed","2 eggs","2.5 cups all-purpose flour","2 teaspoons baking soda","1/4 teaspoon salt","1 cup creamy peanut butter","1 teaspoon vanilla extract"],"dir":["Heat oven to 375°F.","Cream butter until pale. Gradually incorporate sugars, beating until golden. Add eggs individually, beating after each.","In separate bowl, combine flour, baking soda, and salt.","Alternate dry ingredients with peanut butter into creamed mixture, starting and finishing with flour.","Mix in vanilla extract.","Refrigerate dough 30 minutes.","Form into 1-inch balls on ungreased sheets, 2 inches apart. Make crosshatch pattern with fork.","Bake 10 minutes; cool on racks."],"by":"Mom","prep":"45 minutes","cook":"55 minutes","total":"100 minutes","serves":"10 dozen cookies","diff":2,"tools":"Hand mixer or stand mixer (optional)","cat":"cookies-brownies-bars"},{"slug":"Potato","title":"Potato Chip Cookies","ing":["1 pound butter","1 cup sugar","1 cup crushed potato chips","1 teaspoon vanilla extract","3 cups all-purpose flour, sifted","1 cup chopped nuts","1 cup confectioners sugar"],"dir":["Heat oven to 350°F and prepare two greased baking sheets.","Cream butter with sugar until smooth, then blend in potato chips and vanilla.","Gradually incorporate flour, then fold in nuts throughout mixture.","Place teaspoon-sized portions on sheets with 2 inches between each.","Bake 15–18 minutes until set.","Once cool enough to handle, coat with confectioners sugar and cool completely on a wire rack."],"attr":"Marilyn Brock","prep":"15 minutes","cook":"35 minutes","total":"50 minutes","serves":"3 dozen cookies","diff":2,"tools":"Hand mixer or stand mixer (optional)","notes":"Source: Five Family Cookbook. This recipe originally called for Oleo, and if you prefer and can find margarine, you should. The version presented uses butter instead.","cat":"cookies-brownies-bars"},{"slug":"RVWCCC","title":"Red Velvet White Chocolate Chunk Cookies","ing":["1 (15.25 ounce) box Red velvet cake mix","1 cup All-purpose flour","2 sticks Butter, softened","1 Egg","2 cups White chocolate chips"],"dir":["Preheat oven to 350°F","Cream softened butter until fluffy","Sift flour and cake mix together in separate bowl","Gradually combine dry ingredients with creamed butter, then add egg and white chocolate chips","Roll dough into 1-inch balls and space 2 inches apart on ungreased baking sheet","Bake 8-10 minutes and cool on wire rack"],"by":"Susan","attr":"Susan","desc":"These were a favorite of Gram's that I would make her around Christmas. Easy and not complicated.","prep":"10 minutes","cook":"20 minutes","total":"30 minutes","serves":"24 small cookies","diff":2,"tools":"Hand or stand mixer","cat":"cookies-brownies-bars"},{"slug":"SSPHB","title":"Sea Salt Peanut Butter Cookies","ing":["1¼ cups all-purpose flour","1 teaspoon sea salt","1 teaspoon baking powder","½ cup butter, room temperature","¾ cup crunchy peanut butter","½ cup sugar (plus extra for sprinkling)","½ cup packed brown sugar","½ teaspoon vanilla extract","1 egg"],"dir":["Heat oven to 375°F","Sift flour, salt, and baking powder together","Cream butter, peanut butter, and sugars; add vanilla and egg","Combine wet and dry ingredients","Form ¾-inch balls on greased sheet","Flatten each with fork tines in crosshatch pattern; sprinkle with sugar","Bake 10-12 minutes; cool on wire rack"],"by":"Cathy","attr":"Cathy","desc":"This recipe distinguishes itself by mixing sea salt into the batter rather than sprinkling it on top, creating the occasional, and thus sublime, perfect bite when the salt explodes in a symphony of goodness.","prep":"20 minutes","cook":"10-12 minutes (plus cooling)","total":"35 minutes","serves":"Approximately 3 dozen","diff":2,"tools":"Hand mixer or stand mixer","cat":"cookies-brownies-bars"}]},{"slug":"fish-and-shellfish","name":"Fish & Shellfish","recipes":[{"slug":"Chowder","title":"Clam Chowder","ing":["3 cans cream of potato soup","3 cans New England Clam Chowder","1/2 stick melted butter","1 can minced clams","1-2 tablespoons onion flakes","4 cups half & half","Oyster crackers (optional topping)"],"dir":["Combine all ingredients in crockpot and cook on low setting for 4 hours"],"by":"Susan Hodge","attr":"Phyllis Hodge","desc":"This recipe came from Noah's Ark restaurant in St. Charles, MO. It is perfect for a cold night with a sandwich on the side.","prep":"5 minutes","cook":"4 hours","total":"4 hours 5 minutes","serves":"8","diff":3,"tools":"Crock pot","cat":"fish-and-shellfish"},{"slug":"CHOGS","title":"Crispy Honey Orange Glazed Salmon","ing":["1 Tablespoon olive oil","2 Teaspoons butter","4 (6-ounce) Skinless salmon filets","1/4 Cup fresh orange juice","3 Tablespoons honey","2 Tablespoons soy sauce","4 Cloves garlic, crushed or minced","Salt and cracked black pepper, to taste","1/2 Orange, sliced to serve"],"dir":["Sear salmon in heated butter over medium-high heat, then add orange juice and reduce. Incorporate garlic, honey, and soy sauce to create a syrup-like glaze. Finish cooking either in the skillet or under a preheated broiler for charred edges. Season and serve with the reduced sauce and orange slices alongside steamed vegetables or salad."],"by":"Marcia","desc":"During Covid Rick and I would FaceTime with our friend Kim. Weekly we would rotate who selected the menu, then cook and eat together. This was a recipe shared by Kim.","prep":"10 minutes","cook":"10 minutes","total":"20 minutes","serves":"4","diff":2,"tools":"Cast iron skillet or oven safe skillet","cat":"fish-and-shellfish"},{"slug":"Corona","title":"Lowcountry Shrimp Boil","ing":["Seasonings: cayenne, black pepper, cloves, bay leaves, Old Bay, Tabasco","2 lemons","1 onion","½ pound sausage, cut into 1-inch pieces","½ pound raw shrimp in shell","3 whole red potatoes","1 ear corn, cut into thirds or halves"],"dir":["Fill pot with water and add seasonings, quartered lemons, and sliced onion. Boil until rolling.","Verify strainer is in pot before adding ingredients.","Add potatoes and sausage; cook 10 minutes. Add corn; cook 10 minutes. Add shrimp; cook 2-3 minutes depending on size.","Remove strainer, dump contents onto plate, and serve."],"attr":"Rick","desc":"There is nothing like a Wall Lowcountry Boil. While this recipe brings the food to life the true joie de vie of Rick Wall's preparation of this dish can't be duplicated.","prep":"15 minutes","cook":"25 minutes","total":"40 minutes","serves":"1 (per-person quantities)","diff":3,"tools":"Large stock pot","cat":"fish-and-shellfish"},{"slug":"MBCWLAG","title":"Mediterranean Baked Cod with Lemon and Garlic","ing":["1 1/2 lbs cod filet pieces (4-6 pieces)","5 garlic cloves, minced","1/4 cup fresh parsley, chopped","5 tbsp fresh lemon juice","5 tbsp extra virgin olive oil","2 tbsp melted butter","1/3 cup all-purpose flour","1 tsp ground coriander","3/4 tsp sweet Spanish paprika","3/4 tsp ground cumin","3/4 tsp salt","1/2 tsp black pepper"],"dir":["Preheat oven to 400°F","Combine lemon juice, olive oil, and melted butter in shallow bowl","Mix flour and spices in separate shallow bowl","Pat fish dry; coat by dipping in lemon mixture, then flour mixture","Heat 2 tbsp olive oil in cast iron skillet over medium-high heat until shimmering; sear fish 2 minutes per side until colored","Add minced garlic to reserved lemon mixture; drizzle over fish","Bake 10 minutes until fish flakes easily; top with parsley"],"by":"Marcia","attr":"The Mediterranean Dish","desc":"Covid FaceTime dinner recipe with Kim; pairs well with Crispy Honey Orange Glazed Salmon","prep":"10 minutes","cook":"12 minutes","total":"22 minutes","serves":"4","diff":2,"tools":"Cast iron skillet, fish spatula","notes":"Serve alongside Greek salad.","cat":"fish-and-shellfish"},{"slug":"Oyster","title":"Oyster Pie","ing":["½ cup unsalted butter (plus more for the baking dish)","20 saltine crackers, lightly crumbled","2 cups fresh oysters (or one 16-ounce container)","Kosher salt and black pepper","1 cup whole milk","1 beaten egg","1 teaspoon Worcestershire sauce","2–3 drops Tabasco sauce"],"dir":["Heat oven to 400°F; butter an 8-inch square pie plate.","Layer one-third of cracker crumbs evenly in the dish.","Add half the oysters; season with salt and pepper.","Distribute one-third of butter in thin slices; repeat layering.","Top with remaining cracker crumbs and butter.","Whisk together milk, egg, Worcestershire, and Tabasco; pour over layers.","Bake 15–20 minutes until set. Broil briefly if browning is desired.","Rest 5–10 minutes before serving."],"by":"Susan Hodge","attr":"Susan Hodge","desc":"A traditional Southern holiday dish featuring oysters layered with saltine crackers and butter in a custard-like mixture. Despite its name, this preparation sits alone rather than stuffing poultry.","prep":"10 minutes","cook":"15–20 minutes","total":"45 minutes","serves":"4","diff":1,"cat":"fish-and-shellfish"},{"slug":"PaFrSc","title":"Pan Fried Scallops","ing":["6 scallops (U 10 size recommended)","1 tablespoon vegetable or olive oil","1 tablespoon butter","Salt and freshly ground pepper to taste"],"dir":["Rinse scallops and pat dry; season with salt and pepper","Heat oil until smoking, sear scallops 2 minutes, remove and set aside","Melt butter in hot skillet, return scallops browned-side up, cook 60-90 seconds","Flip every 60-90 seconds, monitoring internal temperature until reaching 135°F","Rest for 5 minutes before serving"],"by":"Rick","attr":"Rick","desc":"Described as the \"Best scallop recipe\" that works with a cast iron pan on a grill outdoors or a stovetop skillet with proper ventilation. It pairs well with cheese grits.","prep":"5 minutes","cook":"11 minutes","total":"16 minutes","serves":"6 scallops (3 per person for 2 servings)","diff":2,"tools":"Cast iron skillet with grill, or nonstick skillet","cat":"fish-and-shellfish"},{"slug":"SalmonPatt","title":"Salmon Patties","ing":["1 small (7 oz) can sockeye salmon, drained","1 egg","2 teaspoons lemon juice","1 tablespoon parsley","1 cup breadcrumbs or cracker crumbs","1/4 teaspoon lemon pepper"],"dir":["Remove bones and skin from canned salmon","Combine all ingredients and form into patties","Refrigerate patties if preparing fried potatoes as a side dish","Heat skillet with enough grease to coat the bottom; cook patties over medium heat until browned (approximately 5 minutes)","Flip patties, reduce heat to low, and cook until the second side browns (approximately 5 minutes)"],"attr":"Gram Horn","desc":"A beloved family recipe that is synonymous with Gram and a favorite of many family members.","prep":"5 minutes","cook":"10 minutes","total":"15 minutes","serves":"4","diff":2,"tools":"Cast iron skillet or oven-safe skillet","cat":"fish-and-shellfish"},{"slug":"Gumbo","title":"Seafood Gumbo","ing":["2/3 cup butter","2/3 cup flour","2 stalks celery, diced","1 small onion, diced","1 green bell pepper, diced","1 clove garlic, minced","1 10-oz can stewed tomatoes with juice, chopped","2 cups chicken broth","1 cup flat beer (optional; substitute stock)","1 bay leaf","1 teaspoon salt","Pepper to taste","1 pinch dried thyme","1/2 cup fresh flat-leaf parsley, chopped","1/2 teaspoon cayenne pepper","3/4 pound raw peeled shrimp","1/2 pound cooked shredded lump crab meat","1/2 pound browned andouille sausage, sliced or crumbled","1.5–2 cups cooked brown rice"],"dir":["Melt butter in large soup pot over medium heat. Add flour and whisk for 10–15 minutes until browned.","Add diced vegetables and garlic; cook 10 minutes until softened.","Stir in tomatoes with juice, cover, and stir 3–4 times over 15 minutes.","Add broth, water, and beer. Season with spices and simmer uncovered 15 minutes.","Add sausage and seafood; cook until shrimp is fully cooked.","Serve over or mixed with rice. Top with filé powder and hot sauce if desired. Freezes well."],"by":"Susan Hodge","attr":"Susan Hodge","desc":"A traditional New Orleans gumbo that has become a quick favorite","prep":"10 minutes","cook":"55 minutes","total":"1 hour 5 minutes","serves":"6","diff":2,"tools":"Stock pot","cat":"fish-and-shellfish"},{"slug":"ShrimAs","title":"Shrimp and Asparagus","ing":["4 English muffins","1 pound fresh young asparagus spears, trimmed and halved (steamed)","4 tablespoons butter, divided","1/4 teaspoon salt","32 extra large shrimp, peeled and deveined","4 teaspoons lemon juice","1/4 cup blue cheese","1 cup sour cream"],"dir":["Toast split English muffins; set aside.","Boil water with 1 tablespoon butter and salt in steamer pan base.","Steam asparagus until tender, 5-10 minutes.","Sauté shrimp in 3 tablespoons melted butter over medium heat until opaque, about 2 minutes.","Arrange 6 asparagus pieces parallel on each muffin half.","Top with 4 shrimp and lemon juice.","Blend blue cheese with sour cream; add 1 tablespoon mixture per serving.","Broil 3-5 minutes.","Quarter each assembly into bite-sized pieces with one shrimp per piece."],"attr":"Marlene","desc":"An elegant seafood appetizer combining steamed asparagus, sautéed shrimp, and blue cheese sour cream on toasted English muffins.","prep":"10 minutes","cook":"20 minutes","total":"30 minutes","serves":"4-8","diff":2,"tools":"Toaster, pot with steamer basket","cat":"fish-and-shellfish"},{"slug":"SrimSal","title":"Shrimp Salad","ing":["2 1/3 cups canned corn, drained","15 oz black beans, drained and rinsed","1/2 pound cooked shrimp, tails removed","2 small jalapeños, chopped","1/2 red onion, chopped","1-2 ripe avocados","1/3 cup lime juice","1-2 tablespoons sugar","1 tablespoon mayonnaise","3/4 teaspoon salt","1/2 teaspoon pepper","1/8 teaspoon Tabasco sauce","1-2 tablespoons fresh cilantro","2/3 cup olive oil","Lettuce and baguette for serving"],"dir":["Combine corn, black beans, shrimp, jalapeños, red onion, and avocados","Mix lime juice, sugar, mayonnaise, salt, pepper, Tabasco, and cilantro","Add olive oil to sauce mixture","Pour sauce over salad just before serving; adjust quantity to taste","Chill and serve on lettuce with bread"],"by":"Susan Hodge","attr":"Susan Hodge","desc":"A refreshing seafood salad ideal for summer entertaining and beach outings.","prep":"10 min","total":"10 min","serves":"4-6","diff":1,"cat":"fish-and-shellfish"},{"slug":"SSaSP","title":"Smoked Shrimp and Scallop Platter","ing":["1 pound medium to large shrimp","3/4–1 pound sea scallops","3 tablespoons olive oil","Juice of 1 lemon","1½ tablespoons coarsely cracked black pepper","1½ teaspoons coarse salt (kosher or sea salt)"],"dir":["Heat smoker to 180–200 degrees.","Peel shrimp, keeping tails intact. Halve any scallops larger than one inch.","Combine shrimp and scallops with oil, lemon juice, pepper, and salt; marinate 15–20 minutes at room temperature.","Arrange on grill rack. Smoke away from direct heat until cooked through and opaque, approximately 30 minutes.","Serve warm or chilled."],"by":"Susan Hodge","attr":"Tom Hodge via Smoke and Spice","desc":"A shellfish dish designed to serve as a main dish platter for up to 4 to share or make it an appetizer for a lucky group.","prep":"20 minutes","cook":"30 minutes","total":"50 minutes","serves":"4","diff":3,"tools":"Smoker","cat":"fish-and-shellfish"}]},{"slug":"grilling","name":"Grilling","recipes":[{"slug":"3-2-1","title":"3-2-1 Ribs","ing":["1 slab St. Louis-cut spare ribs","1 cup Jack Daniel's Pork Rub","1/4 cup honey","1 cup packed brown sugar","1 bottle Parkay squeezable butter"],"dir":["Heat smoker to 225–250°F.","Remove membrane from ribs using a butter knife; generously season with pork rub on a rimmed baking sheet.","Smoke ribs for 3 hours, adding smoke regularly.","Wrap ribs in foil, drizzle with honey, brown sugar, and butter. Return to smoker for 2 hours.","Unwrap and smoke for 1 additional hour."],"attr":"Leon and Mary Brock","desc":"OH SO YUMMY! Smoky and sweet and falling off the bone!","prep":"15 minutes","cook":"6 hours 15 minutes","total":"6 1/2 hours","serves":"2 to 4","diff":3,"tools":"Rimmed baking sheet; Tin foil; Smoker","cat":"grilling"},{"slug":"beef-brisket","title":"Beef Brisket","ing":["1 whole, untrimmed packer cut brisket (10-12 pounds)","2 cups apple juice","Kosher salt (optional rub)","Pepper (optional rub)","Sweet Baby Ray's BBQ Sauce (optional)","Open Pit BBQ Sauce (optional)"],"dir":["Trim excess fat, keeping a 1/8\" to 1/4\" fat cap.","Apply rub of equal parts salt and pepper.","Place fat-side up on smoker at 225-250°F.","After 4 hours, flip meat-side up, rotate 90 degrees, and spritz with apple juice.","Continue spritzing every 2 hours until internal temperature reaches 170°F.","Wrap in foil and cook at 300°F until reaching 205°F internally.","Blend BBQ sauces in approximately 6:1 ratio (optional).","Rest at least 30 minutes before slicing.","Separate flat and point sections, slicing across the grain at 1/4\" to 3/8\" thickness."],"by":"Leon and Mary Brock","attr":"Leon and Mary Brock","desc":"A Texas-style barbecue preparation for smoking a large beef brisket.","prep":"30 minutes","cook":"10-12 hours","total":"10-12 hours","serves":"8-10","diff":3,"tools":"Rimmed baking sheet; Tin foil; Smoker; Instant-read thermometer; Spray bottle","cat":"grilling"},{"slug":"boston","title":"Boston Butt","ing":["1 cup molasses","3/4 cup pickling salt","2 quarts water","4 lb Boston butt (pork shoulder)","Sticky Fingers Rub (optional)","3 tablespoons paprika","1 1/2 teaspoons salt","3/4 teaspoon black pepper","3/4 teaspoon cayenne pepper","3/4 teaspoon garlic powder"],"dir":["Combine molasses, pickling salt, and water; submerge Boston butt completely. Refrigerate minimum 8 hours (12 hours ideal).","Smoke with indirect heat for 6 hours at 210-220°F (approximately 1.5 hours per pound).","After 4 hours, wrap in foil for final 2 hours. Internal temperature should reach 145°F.","Final temperature reaches 195°F. Rest 1 hour minimum before pulling or chopping."],"by":"Leon and Mary Brock","attr":"Leon and Mary Brock","desc":"Slow food yumminess! It takes a while to do but is SO worth it!","prep":"Overnight","cook":"18-24 hours total","total":"18-24 hours","serves":"8-12","diff":3,"tools":"Large pot or small cooler; Smoker; Aluminum foil","cat":"grilling"},{"slug":"GrillChick","title":"Grilled Chicken","ing":["1/4 cup + 1 cup lemon juice","1/4 cup Dijon mustard","4 boneless/skinless chicken breasts (6-8 ounces each)"],"dir":["Heat grill to 375°F.","Marinate chicken breasts in 1 cup lemon juice for at least 2½ minutes per side.","Mix remaining ¼ cup lemon juice with Dijon mustard into a paste.","Grill chicken 7½ minutes per side, basting with lemon-mustard mixture; cook until internal temperature reaches 165°F.","Serve immediately."],"attr":"Leon 2","desc":"Simple grilled chicken preparation for a quick cookout. Pairs great with fettuccine alfredo or tabouli","prep":"10 minutes","cook":"15 minutes","total":"25 minutes","serves":"4","diff":3,"tools":"Charcoal or gas grill; Meat thermometer; Basting brush","cat":"grilling"},{"slug":"GrillHam","title":"Grilled Hamburgers","ing":["1 pound hamburger (82%-85% lean)","1 tablespoon soy sauce","1½ teaspoons Worcestershire sauce","½ teaspoon Tabasco sauce","Black pepper to taste"],"dir":["Heat your grill to temperature.","Blend all ingredients thoroughly with your hands.","Shape into 6-8 discs measuring 4-5 inches across and ½-¾ inch thick.","Grill approximately 5 minutes per side for medium doneness, adjusting as preferred."],"attr":"Rick Wall","desc":"A cookout staple!","prep":"10 minutes","cook":"10 minutes","total":"20 minutes","serves":"6","diff":3,"tools":"Charcoal or gas grill","cat":"grilling"},{"slug":"GrillSam","title":"Grilled Salmon","ing":["1 1/2 lb salmon with skin on","Emeril's Essence Seasoning"],"dir":["Heat grill to 400°F.","Apply seasoning to salmon.","Grill salmon 10–15 minutes until internal temperature reaches 130°F."],"by":"Leon and Mary Brock","attr":"Leon and Mary Brock","desc":"Great meal for a nice dinner. Serve with rice or pasta and steamed asparagus.","prep":"10 minutes","cook":"20 minutes","total":"30 minutes","serves":"4","diff":3,"tools":"Rimmed baking sheet; Grill; Meat thermometer","cat":"grilling"},{"slug":"HoneyGrill","title":"Honey Grilled Chicken Breasts","ing":["1/4 cup fresh orange juice","3 tablespoons honey","2 tablespoons fresh lemon juice","2 tablespoons soy sauce","1 tablespoon minced fresh ginger (or 1 teaspoon powder)","1 tablespoon minced garlic (or 1 teaspoon powder)","1 1/2 teaspoons sea salt","1/2 teaspoon black pepper","6 boneless, skinless chicken breasts (4-6 ounces each)"],"dir":["Whisk together all ingredients except chicken in a large bowl.","Add chicken and coat thoroughly with marinade. Refrigerate 4 hours or overnight, turning occasionally. Allow to reach room temperature before cooking.","Grill over hot coals 3 inches from heat for 4-5 minutes per side until internal temperature reaches 165°F. Rest 5 minutes before serving."],"attr":"Mary Horn","desc":"Simple grilled chicken preparation for a quick cookout.","prep":"5 minutes + 4-8 hours marinating","cook":"8-10 minutes (4-5 minutes per side)","total":"4-8 hours including marinating","serves":"6","diff":3,"tools":"Charcoal or gas grill; Meat thermometer","cat":"grilling"},{"slug":"Seekh","title":"Indian Seekh Kebobs","ing":["1 lb ground lamb (or combination with goat meat)","1 onion, finely chopped","¼ cup mint leaves, chopped","¼ cup cilantro, chopped","½ tbsp ginger paste","½ tbsp green chili paste","1 tsp ground cumin","1 tsp ground coriander","1 tsp paprika","½ tsp cayenne pepper","1 tsp salt","Olive oil"],"dir":["Mix ingredients; refrigerate 2 hours.","Shape mixture around skewers into sausage forms.","Grill at high heat with oiled surface, turning until browned (approximately 10 minutes to 160°F internal temperature). Rest 5 minutes before serving."],"attr":"Rick Wall","desc":"A traditional Indian grilled meat dish. The recipe suggests serving alongside \"chicken tikka masala, mushroom bhaji, naan & you're off to the races\"","prep":"15 minutes + 2 hours refrigeration","cook":"Approximately 10 minutes","total":"2½ hours","serves":"16 kebobs (32 for double recipe)","diff":2,"tools":"16 wooden skewers; Grill or skillet","cat":"grilling"},{"slug":"Italian","title":"Italian Grilled Chicken","ing":["4 (4-6 ounce) boneless, skinless chicken breasts","1 bottle of Italian dressing","Lemon pepper"],"dir":["Place chicken in a 1 gallon ziploc bag and add bottle of Italian dressing. Marinate for 30 minutes to 1 hour.","Preheat the grill to 450 degrees.","Grill chicken over direct heat until chicken reaches 165°F.","Remove from the grill and sprinkle with lemon pepper and serve."],"attr":"Leon and Mary Brock","desc":"Easy recipe that tastes great for a special occasion or just a weeknight that you want to feel special","prep":"30 minutes","cook":"30 minutes","total":"1 hour","serves":"4","diff":3,"tools":"Rimmed baking sheet; Gallon ziploc bag; Grill; Meat thermometer","cat":"grilling"},{"slug":"maple-bourbon-ham","title":"Maple Bourbon Ham","ing":["Ham & Paste: 12 to 14 pound bone-in cooked, ready-to-eat ham","Ham & Paste: 2 tablespoons pure maple syrup","Ham & Paste: 2 tablespoons freshly ground black pepper","Ham & Paste: 2 tablespoons Dijon mustard","Ham & Paste: 1 tablespoon bourbon","Ham & Paste: 1 tablespoon vegetable oil","Ham & Paste: 1 tablespoon paprika","Ham & Paste: 1 tablespoon onion powder","Ham & Paste: 2 teaspoons kosher salt","Mop: 1/4 cup pure maple syrup","Mop: 1/4 cup bourbon","Mop: 1/4 cup apple cider vinegar","Mop: 3 tablespoons vegetable oil","Mop: 2 teaspoons Dijon mustard","Glaze: 3/4 cup pure maple syrup","Glaze: 1/4 cup plus 2 tablespoons bourbon","Glaze: 3 tablespoons Dijon mustard","Glaze: 2 tablespoons butter","Glaze: 2 tablespoons minced onion","Glaze: 1 tablespoon apple cider vinegar","Glaze: 2 teaspoons yellow mustard seeds (cracked)","Glaze: 1 teaspoon freshly ground pepper"],"dir":["Score ham's fatty side overnight with criss-cross cuts approximately 1/4\" to 1/2\" deep.","Combine paste ingredients, apply to ham inside a plastic bag, seal, and refrigerate overnight.","Remove ham from refrigerator 45-60 minutes before smoking to reach room temperature.","Heat smoker to 200-220°F.","Warm mop ingredients in saucepan over low heat.","Place ham on wire rack in smoker; cook 5.5-6 hours, basting hourly.","Apply glaze twice during final hour until heated through with smoke flavor."],"by":"Leon and Mary Brock","attr":"Leon and Mary Brock","desc":"Fancy slow cooking ham recipe","prep":"Overnight","cook":"5.5 to 6 hours","total":"18-24 hours","serves":"10 to 12","diff":3,"tools":"Large plastic bag; Smoker","cat":"grilling"},{"slug":"TrashBag","title":"NYC Trash Bag Ham","ing":["Protein: 10-12 pound fully cooked ham (spiral cut)","Paste: 2 Tablespoons maple syrup","Paste: 2 Tablespoons Dijon mustard","Paste: 1 Tablespoon black pepper","Paste: 1 Tablespoon bourbon","Paste: 1 Tablespoon vegetable oil","Paste: 1 Tablespoon onion powder","Paste: 1 Tablespoon paprika or chipotle powder","Paste: 1 Tablespoon salt","Glaze: 1/2 Cup maple syrup","Glaze: 1/2 Cup bourbon","Glaze: 1/2 Cup cider vinegar","Glaze: 3 Tablespoons vegetable oil","Glaze: 3 Tablespoons Dijon mustard"],"dir":["Combine paste ingredients together.","Place cooked spiral-cut ham in a trash bag.","Score the fatty top, cutting against the grain.","Apply paste generously to ham.","Seal and refrigerate for 2-3 hours minimum.","Mix glaze ingredients in separate bowl.","Preheat oven to 300°F.","Transfer ham to shallow baking dish and bake 10-15 minutes per pound.","Baste with glaze every 45-60 minutes during cooking.","Rest 10 minutes before serving."],"by":"Richard Wall","attr":"Richard Wall","desc":"A creative adaptation for urban cooks without access to traditional smoking equipment, this recipe brings maple bourbon ham flavors to NYC apartments.","prep":"30 minutes","cook":"150-180 minutes (10-15 minutes per pound for a 10-12 lb ham)","total":"30 minutes plus 150-180 minutes","serves":"12","diff":3,"tools":"Roasting dish; Turkey bag for brining; Basting mop","cat":"grilling"},{"slug":"Smoke","title":"Regular Smoked Ham","ing":["3 pounds pre-cooked ham","1 jar Boar's Head ham glaze"],"dir":["Heat your smoker to 275 degrees.","Brush the Boar's Head glaze onto the ham using a rimmed baking sheet.","Smoke the ham for 3 hours on the rack."],"by":"Leon and Mary Brock","attr":"Leon and Mary Brock","desc":"Ham for a special occasion when you don't have overnight to prep the ham","prep":"15 minutes","cook":"3 hours","total":"3½ hours","serves":"6","diff":3,"tools":"Rimmed baking sheet; Smoker","cat":"grilling"},{"slug":"1ribs","title":"Ribs","ing":["1 slab St. Louis cut ribs","1 cup Jack Daniels Pork Rub","Apple juice in a spray bottle"],"dir":["Heat smoker to 275 degrees.","Remove the membrane from ribs with a butter knife. Apply pork rub generously to both sides on a rimmed baking sheet.","Smoke for approximately 3 hours. Beginning after 45 minutes, spritz ribs with apple juice at 15-30 minute intervals for the remainder of cooking time."],"by":"Leon and Mary Brock","attr":"Leon and Mary Brock","desc":"Another way to prepare smoked ribs","prep":"15 minutes","cook":"2 hours 45 minutes","total":"3 1/2 hours","serves":"2 to 4","diff":3,"tools":"Spray bottle; Rimmed baking sheet; Smoker","cat":"grilling"},{"slug":"smokeRib","title":"Smoked Ribs","ing":["1 rack of ribs (approximately 2.5 pounds)","Rib rub (your choice)","1/2 cup honey","1/2 cup apple juice"],"dir":["Preheat smoker to 300°F using hickory, apple, or cherry wood.","Remove membrane from rib back; coat both sides with rub. Smoke for 1 hour 45 minutes.","Transfer to foil/pan; brush with honey and add apple juice. Seal with foil; return to smoker for 30 minutes.","Verify internal temperature reaches 195-200°F (FDA minimum is 145°F).","Wrap in blanket/towel or place in ice chest; rest 1 hour before serving."],"by":"Rick","attr":"Rick","desc":"This smoking technique works excellently in a Green Egg or similar smoker maintained at approximately 300°F over several hours. The recipe suggests pairing with complementary side dishes and enjoying during sporting events.","prep":"20 minutes","cook":"2 hours 20 minutes","total":"4 hours","serves":"1 rack (approximately 10 ribs)","diff":3,"tools":"Smoker; Heavy-duty foil or large foil pan; Heavy blanket, bath towel, or ice chest","cat":"grilling"},{"slug":"Varsity","title":"Varsity Drive-In Chili Dogs","ing":["2 cloves garlic, minced","1/2 cup onion, chopped fine","2 tablespoons vegetable oil","1 pound lean ground beef","1 teaspoon salt","1/2 teaspoon ground black pepper","1 tablespoon yellow mustard","1 tablespoon vinegar","1 teaspoon Worcestershire sauce","1/2 teaspoon Tabasco sauce (or to taste)","1/4 cup ketchup","1/2 cup tomato juice","6 large hot dog buns","6 cooked hot dogs"],"dir":["Warm oil in large skillet; sauté garlic and onion over medium heat until softened.","Brown ground beef, breaking it apart; drain excess fat.","Stir in remaining ingredients with enough tomato juice for a loose (not soupy) consistency; simmer 10 minutes.","Top cooked hot dogs on buns with chili sauce."],"attr":"The Varsity Drive-In in Hotlanta as translated by Rick Wall","desc":"Famous chili sauce from Atlanta's iconic drive-in restaurant","prep":"5 minutes","cook":"25 minutes","total":"30 minutes","serves":"6","diff":2,"cat":"grilling"}]},{"slug":"pies-and-cakes","name":"Pies & Cakes","recipes":[{"slug":"4layer","title":"4-Layer Chocolate Cheesecake","ing":["1.5 cups flour","12 tablespoons butter, melted","1 cup nuts, finely chopped","8 ounces cream cheese","16 ounces Cool Whip, divided","1 cup confectioners sugar","2 (5.9 ounce) packages instant chocolate pudding","3 cups milk"],"dir":["Heat oven to 350°F.","Combine flour, melted butter, and chopped nuts until sandy; press into greased 9\"×13\" pan and bake 15 minutes.","Mix cream cheese with 8 ounces Cool Whip and confectioners sugar; spread over cooled crust.","Prepare pudding mix with milk per package instructions; layer over cream cheese mixture.","Top with remaining 8 ounces Cool Whip.","Refrigerate 2 hours before serving."],"by":"Lynn Mitchell","attr":"Lynn Mitchell","desc":"This decadent cheesecake consists of four layers and is best made the day before serving.","prep":"30 minutes","cook":"15 minutes (crust baking)","total":"45 minutes, plus cooling and 2-hour refrigeration","serves":"8","diff":3,"tools":"Hand mixer or stand mixer","cat":"pies-and-cakes"},{"slug":"25000","title":"$25,000 Chocolate Cherry Cake","ing":["1 (15.25 oz) box fudge cake mix","1 (21 oz) can cherry pie filling","1 tsp almond extract","1 cup sugar","5 tbsp margarine or salted butter","1/3 cup milk","12 oz semi-sweet chocolate chips"],"dir":["Heat oven to 350°F. Prepare a 9\"x13\" pan with grease and flour.","Mix cake mix, pie filling, and almond extract by hand until smooth; skip eggs, oil, and water.","Bake 35 minutes until a toothpick comes out clean.","Meanwhile, heat sugar, margarine, and milk to boiling, remove from heat, then add chocolate chips.","Move cake to serving dish and pour warm frosting over it."],"attr":"Marilyn","desc":"A simple fudge cake enhanced with cherry pie filling and topped with chocolate frosting","prep":"10 minutes","cook":"35 minutes","total":"45 minutes","serves":"8","diff":2,"tools":"9\"x13\" baking pan","notes":"Pour frosting while the cake is hot for optimal results.","cat":"pies-and-cakes"},{"slug":"AppleCa","title":"Apple Cake","ing":["3 cups apples, peeled and sliced thin","1.25 cups sugar","1.75 cups flour, sifted","1 teaspoon cinnamon","1/2 teaspoon salt","1 teaspoon baking soda","3/4 cup vegetable oil","2 eggs, room temperature","1/2 cup nuts, chopped"],"dir":["Heat oven to 350°F. Prepare an 8\"x8\" baking dish with grease and flour.","Combine apples and sugar in a medium bowl until well coated.","In another bowl, sift together flour, cinnamon, salt, and baking soda. Mix into apple mixture.","Stir in oil and eggs until smooth; fold in nuts.","Transfer batter to prepared dish and bake 45 minutes until a toothpick test confirms doneness."],"by":"Mom","attr":"Mom","prep":"20 minutes","cook":"45 minutes","total":"65 minutes","serves":"8","diff":1,"cat":"pies-and-cakes"},{"slug":"AppleCr","title":"Apple Crisp","ing":["1 medium yellow apple, thinly sliced","1 can applesauce","Cinnamon","1 (15.25 ounce) box Duncan Hines Golden Cake Mix","Nuts, toasted","2/3 cup vegetable oil"],"dir":["Heat oven to 325°F and prepare an 8\"x8\" pan with greasing.","Arrange apple slices on pan bottom.","Add the applesauce layer.","Dust with cinnamon.","Distribute dry cake mix evenly.","Top with lightly toasted broken nuts.","Drizzle vegetable oil over entire mixture.","Bake at 325°F for 30-40 minutes."],"attr":"Marilyn","cook":"30-40 minutes","notes":"From the Five Family Cookbook.","cat":"pies-and-cakes","diff":0},{"slug":"ApplePi","title":"Apple Pie","ing":["2 tablespoons unsalted butter","3 Granny Smith apples (cored, peeled, sliced thin)","3 Honeycrisp apples (cored, peeled, sliced thin)","1/4 teaspoon ground allspice","1/2 teaspoon ground cinnamon","1/4 teaspoon kosher salt","3/4 cup plus 1 tablespoon granulated sugar","2 tablespoons all-purpose flour","1 tablespoon apple cider vinegar","2 Pillsbury refrigerated pie doughs","1 egg (lightly beaten)","Vanilla ice cream (optional)","Whipped cream (optional)"],"dir":["Position baking sheet on middle oven rack and preheat to 425°F.","Melt butter in large sauté pan over medium-high heat; add apples.","Whisk spices, salt, and 3/4 cup sugar together; sprinkle over apples and stir. Reduce heat and cook until soft (5-7 minutes).","Sprinkle flour over apples, stir, and cook 3-5 minutes more.","Remove from heat, add vinegar, stir, transfer to bowl, and cool.","Place one crust in pie tin, trim edges, freeze while oven preheats.","Add cooled apples to crust, cover with remaining dough, crimp edges, cut three steam vents, brush with egg wash, sprinkle with remaining sugar.","Bake 20 minutes at 425°F, then reduce to 375°F and bake until filling bubbles and crust is golden (30-40 minutes more)."],"by":"Mary Brock","attr":"Mary Brock","desc":"Classic apple pie with a flaky crust and spiced apple filling","prep":"30 minutes","cook":"50-70 minutes","total":"2 hours 30 minutes–3 hours 30 minutes","serves":"8","diff":2,"tools":"Measuring spoons, measuring cups, large sauté pan, large bowl, pie tin, rimmed baking sheet","cat":"pies-and-cakes"},{"slug":"ChocoFrost","title":"Chocolate Frosting","ing":["2 cups confectioners sugar","4 tablespoons unsweetened cocoa powder","Pinch of salt","1/4 cup melted butter","3 tablespoons milk","1/2 teaspoon vanilla extract"],"dir":["Sift confectioners sugar, cocoa, and salt together in a medium bowl.","Combine melted butter, milk, and vanilla extract with dry ingredients, mixing until smooth. Add milk by the tablespoon if needed to reach desired texture.","Refrigerate frosting for 30 minutes before applying."],"attr":"Mom","desc":"This icing works well for both cakes and brownies. For authenticity, the original recipe calls for substituting the butter with a mixture of oleo and Crisco.","prep":"10 minutes","cook":"30 minutes (chilling)","total":"40 minutes","serves":"1 cake's worth","diff":1,"notes":"To stay authentic to the original recipe, swap the butter for 2 tablespoons of oleo melted with 2 tablespoons of Crisco.","cat":"pies-and-cakes"},{"slug":"CocoPecFill","title":"Coconut Pecan Filling","ing":["1 cup evaporated milk","1 cup sugar","3 egg yolks, slightly beaten","½ cup butter or margarine","1 teaspoon vanilla extract","1½ cups sweetened flaked coconut","1 cup chopped pecans"],"dir":["Combine milk, sugar, egg yolks, butter, and vanilla in a heavy saucepan over medium heat.","Stir constantly until mixture thickens, about 12 minutes. Remove from heat.","Add coconut and pecans, then beat until the mixture cools to a spreadable texture."],"by":"Marlene","attr":"Marlene","desc":"A classic filling from the Five Family Cookbook, ideal for German chocolate cake and similar desserts.","prep":"15 minutes","cook":"5 minutes","total":"20 minutes","serves":"2½ cups filling (enough for three pies)","diff":1,"notes":"This versatile filling works beautifully atop layer cakes or as a standalone topping for various desserts.","cat":"pies-and-cakes"},{"slug":"GermanChoco","title":"German Chocolate Cake","ing":["4 ounces Baker's German Sweet Chocolate","1/2 cup boiling water","1 cup butter, room temperature","2 cups sugar","4 eggs, separated","1 teaspoon vanilla extract","2 1/2 cups Swan's Down cake flour, sifted","1/2 teaspoon salt","1 cup buttermilk"],"dir":["Heat oven to 350°F and prepare cake pans with grease.","Combine chocolate with boiling water until smooth, then cool.","Beat butter and sugar until light. Incorporate egg yolks individually, then chocolate mixture and vanilla.","Alternately add flour mixture and buttermilk to chocolate batter.","Whip egg whites to stiff peaks and gently fold into batter.","Distribute between pans and bake 30-40 minutes until set. Cool completely.","Layer with Coconut Pecan Filling and frost with Chocolate Frosting."],"by":"Five Family Cookbook","attr":"Marlene","prep":"30 minutes","cook":"30-40 minutes","total":"60-75 minutes","serves":"8","diff":2,"tools":"Three 8-inch cake pans","notes":"All-purpose flour works as a substitute for cake flour.","cat":"pies-and-cakes"},{"slug":"LemMerignPi","title":"Lemon Meringue Pie","ing":["Lemon Pie Filling: Lemon Jello Cook & Serve Pudding","Lemon Pie Filling: 1/2 cup Sugar","Lemon Pie Filling: 2 1/4 cup Water","Lemon Pie Filling: 2 Egg Yolks","Pie Crust: 1 Frozen Pie Crust (or homemade)","Meringue: 3 Egg Whites","Meringue: 1/2 cup Sugar"],"dir":["Preheat oven to 350°F.","Combine pie filling ingredients in pot; stir over medium heat until boiling.","Remove from heat; cool 5 minutes.","Pour into pie crust.","Beat egg whites until foamy; gradually add sugar until stiff peaks form.","Spread meringue over pie to edges.","Bake 10-15 minutes until browned.","Cool at room temperature; refrigerate after 4 hours."],"by":"Susan Hodge","attr":"Gram","desc":"This was the birthday dessert of choice for Pap, Leon Jr, and L3.","prep":"15 minutes","cook":"10-15 minutes (baking)","total":"30 minutes","serves":"6-8","diff":2,"tools":"Stand mixer or hand mixer","cat":"pies-and-cakes"},{"slug":"LemSCPi","title":"Lemon Sour Cream Pie","ing":["2 pie crusts (pre-baked or graham cracker)","1 (14 oz) can Eagle Brand sweetened condensed milk","12 oz frozen lemonade concentrate, thawed","8 oz sour cream","8 oz Cool Whip"],"dir":["Prepare pie shells according to package directions and cool, or use 2 graham cracker crusts.","In a medium bowl, blend the condensed milk with thawed lemonade concentrate. Fold in sour cream and Cool Whip, mixing thoroughly.","Distribute filling evenly between pie shells and chill until firm, approximately 4 hours minimum before serving."],"attr":"Marilyn","desc":"A no-bake dessert requiring refrigeration, ideally prepared one day in advance.","prep":"10 minutes","total":"4 hours 10 minutes or overnight","serves":"8","diff":1,"notes":"Best made ahead; requires several hours of refrigeration.","cat":"pies-and-cakes"},{"slug":"Million","title":"Million Dollar Pie","ing":["2 pie crusts or graham cracker crusts","1 (14 ounce) can condensed milk","1/2 cup lemon juice","1 (8 ounce) can crushed pineapple, drained","1/2 cup chopped nuts","1 teaspoon almond flavoring","1 (8 ounce) container Cool Whip"],"dir":["Bake pie crusts per package directions if not using graham cracker crusts.","Combine milk with lemon juice in a bowl, then fold in pineapple, nuts, and almond flavoring.","Fold in Cool Whip last; pour into prepared crust.","Freeze until set; thaw 30 minutes before serving."],"by":"Marilyn","attr":"Marilyn","desc":"A frozen dessert combining condensed milk, lemon juice, pineapple, and nuts","prep":"15 minutes","total":"4 hours 45 minutes","serves":"2 pies","diff":1,"cat":"pies-and-cakes"},{"slug":"MiniPumpCup","title":"Mini Pumpkin Cupcakes","ing":["1 cup canned solid pack pumpkin","1/2 cup unsalted butter, melted","1/3 cup orange juice","2 large eggs, room temperature","1 2/3 cups all-purpose flour","1 1/2 cups sugar","1 teaspoon baking soda","3/4 teaspoon salt","1/2 teaspoon nutmeg","1/2 teaspoon cinnamon","Powdered sugar"],"dir":["Heat oven to 375°F and prepare 48 mini muffin cups with liners.","Combine pumpkin, butter, juice, and eggs with mixer until smooth.","Mix in remaining dry ingredients until just combined, scraping bowl as needed.","Fill each liner with 1 tablespoon batter.","Bake 10 minutes until a tester inserted in center emerges clean.","Cool completely, then dust with powdered sugar."],"attr":"Mom","prep":"30 minutes","cook":"10 minutes","total":"40 minutes","serves":"48 muffins","diff":3,"tools":"Miniature muffin tins; Paper liners; Electric mixer; Cake tester","notes":"From the Five Family Cookbook.","cat":"pies-and-cakes"},{"slug":"PecanPi","title":"Pecan Pie","ing":["1/4 cup melted butter","1 cup light brown sugar","1 cup white Karo syrup","1/4 teaspoon salt","3 large eggs","1 teaspoon vanilla","1 cup pecans","1 unbaked pie shell"],"dir":["Heat oven to 350°F.","Combine butter, brown sugar, Karo syrup, salt, eggs, and vanilla in blender until well mixed.","Spread pecans evenly across the bottom of an unbaked pie shell.","Pour blended mixture over pecans and bake for 50 minutes."],"by":"Mom","attr":"Mom","prep":"15 minutes","cook":"50 minutes","total":"1 hour 5 minutes","serves":"8","diff":1,"tools":"Blender","cat":"pies-and-cakes"},{"slug":"Pound","title":"Pound Cake","ing":["3 cups sugar, sifted","2 sticks butter, softened","3 cups flour, sifted","1/2 teaspoon baking soda","1 cup sour cream","6 large eggs","1 teaspoon vanilla flavor","1 teaspoon almond flavor","Oil or baking spray and flour for pan preparation"],"dir":["Preheat oven to 325°F and prepare cake pan with oil/spray and flour.","Using stand mixer, cream together butter and sugar.","Alternate adding flour-baking soda mixture and sour cream to the creamed mixture.","Incorporate eggs one at a time, then add vanilla and almond flavoring.","Transfer batter to prepared pan and bake 1½ hours. Cool 15 minutes, then invert onto cooling rack."],"by":"Mom","attr":"Mom","desc":"This makes an EXCELLENT dipper for Ultimate Chocolate Fondue recipe","prep":"15 minutes","cook":"1 hour 30 minutes","total":"2 hours","serves":"12","diff":1,"tools":"Stand mixer; Flour sifter; Tube pan","cat":"pies-and-cakes"},{"slug":"PumpPi","title":"Pumpkin Pie","ing":["2 cups (16 oz can) pumpkin","1 cup brown sugar","1/2 teaspoon salt","1 teaspoon ground cinnamon","1 (12 ounce) can evaporated milk","2/3 cup whole milk","4 large or 5 medium eggs, slightly beaten","2 cups milk (or approximately 1 1/3 cups evaporated milk plus regular milk to reach 2 cups total)","Unbaked pie shell"],"dir":["Heat oven to 450°F.","Combine pumpkin, sugar, salt, and cinnamon.","Add evaporated milk and whole milk.","Beat eggs and mix with remaining canned milk, then combine with pumpkin mixture.","Pour into unbaked pie shell.","Bake at 450°F for 10 minutes, then reduce to 325°F for 35-40 minutes until a plain knife blade inserted into the pie comes out clean."],"by":"Mom","attr":"Mom","prep":"30 minutes","cook":"45-50 minutes","total":"1 hour 20 minutes","serves":"8","diff":2,"notes":"From the Five Family Cookbook.","cat":"pies-and-cakes"},{"slug":"RaisPi","title":"Raisin Pie","ing":["2 cups raisins","2 cups water","1/2 cup packed brown sugar","2 tablespoons cornstarch","1/2 teaspoon ground cinnamon","1/4 teaspoon salt","1 tablespoon white vinegar","1 tablespoon unsalted butter","1 refrigerated pie crust (bottom and top)"],"dir":["Heat oven to 350°F.","Boil raisins and water for 5 minutes in a saucepan.","Mix brown sugar, cornstarch, cinnamon, and salt; add to raisins and cook and stir until the syrup is clear.","Remove from heat; stir in vinegar and butter, then cool briefly.","Pour filling into pi
