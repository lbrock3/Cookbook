<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Family Cookbook</title>
<meta name="description" content="Family Cookbook: recipes from our family kitchens.">
<style>html{color-scheme:light;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..650;1,8..60,400..500&display=swap">
<style>
:root{
  --paper:#f6efdf; --paper-2:#efe5cf; --card:#fffaf0; --ink:#2b2118; --soft:#665640;
  --rule:#d8c9a8; --accent:#a23b24; --on-accent:#fffaf0; --sage:#56633f; --mark:#f3d98b;
  --shadow:0 1px 0 rgba(60,40,10,.06), 0 10px 28px -14px rgba(60,40,10,.28);
  --serif:"Source Serif 4", "Iowan Old Style", Georgia, "Times New Roman", serif;
  --display:"Fraunces", "Iowan Old Style", Georgia, "Times New Roman", serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1d1812; --paper-2:#27211a; --card:#2a231b; --ink:#f0e6d2; --soft:#bba98d;
    --rule:#4b4032; --accent:#e5896140; --accent:#e58961; --on-accent:#1d1812; --sage:#a8b689; --mark:#6a5420;
    --shadow:0 1px 0 rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#1d1812; --paper-2:#27211a; --card:#2a231b; --ink:#f0e6d2; --soft:#bba98d;
  --rule:#4b4032; --accent:#e58961; --on-accent:#1d1812; --sage:#a8b689; --mark:#6a5420;
  --shadow:0 1px 0 rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--serif); font-size:1.0625rem; line-height:1.6;
  padding-inline:16px; padding-block:0 3rem;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
a{color:var(--accent); text-underline-offset:.18em; text-decoration-thickness:1px}
a:hover{text-decoration-thickness:2px}
:focus-visible{outline:2px solid var(--accent); outline-offset:3px; border-radius:2px}
.skip{position:absolute; left:-999px; top:0; background:var(--accent); color:var(--on-accent); padding:.5rem .9rem; z-index:10}
.skip:focus{left:16px; top:8px}
.wrap{max-width:62rem; margin-inline:auto; min-width:0}

/* masthead */
.mast{padding-top:2rem; text-align:center}
.mast .kicker{font-size:.78rem; letter-spacing:.22em; text-transform:uppercase; color:var(--soft); margin:0}
.mast h1{font-family:var(--display); font-weight:600; font-size:clamp(2.3rem,7vw,4rem); line-height:1.02; margin:.35rem 0 1.25rem; letter-spacing:-.01em; font-variation-settings:"opsz" 144}
.mast h1 a{color:inherit; text-decoration:none}
.mast .sub{font-style:italic; color:var(--soft); margin:0 0 1.25rem; text-wrap:balance}
.dbl{border:0; border-top:3px double var(--rule); margin:0}
.nav{display:flex; flex-wrap:wrap; gap:.5rem 1.25rem; align-items:center; justify-content:space-between; padding:.7rem 0; border-bottom:1px solid var(--rule)}
.nav ul{list-style:none; display:flex; flex-wrap:wrap; gap:.25rem 1.25rem; margin:0; padding:0}
.nav a{color:var(--ink); text-decoration:none; font-size:.82rem; letter-spacing:.14em; text-transform:uppercase; padding:.3rem 0; border-bottom:1px solid transparent}
.nav a:hover,.nav a[aria-current="page"]{color:var(--accent); border-bottom-color:var(--accent)}
.search{display:flex; flex:1 1 15rem; max-width:22rem; min-width:0}
.search input{
  width:100%; min-width:0; font:inherit; font-size:.95rem; color:var(--ink); background:var(--card);
  border:1px solid var(--rule); border-radius:999px; padding:.45rem 1rem;
}
.search input::placeholder{color:var(--soft); opacity:.9}
.search input:focus-visible{outline-offset:1px}

main{padding-top:2rem; outline:none; min-width:0}
h2,h3,h4{font-family:var(--display); font-weight:600; line-height:1.15; text-wrap:balance}
.eyebrow{font-size:.78rem; letter-spacing:.2em; text-transform:uppercase; color:var(--soft); margin:0 0 .4rem}
.crumbs{font-size:.9rem; color:var(--soft); margin:0 0 1.2rem}
.crumbs a{color:var(--soft)}
.crumbs span[aria-hidden]{margin-inline:.45rem}

/* home */
.lede{display:grid; grid-template-columns:minmax(0,1fr); gap:2rem}
.contents h2{font-size:clamp(1.5rem,3.5vw,2rem); margin:0 0 1rem; font-style:italic; font-weight:500}
.toc{list-style:none; margin:0; padding:0; columns:1; column-gap:3rem}
.toc li{break-inside:avoid}
.toc a{
  display:flex; align-items:baseline; gap:.6rem; padding:.55rem 0; text-decoration:none; color:var(--ink);
  border-bottom:1px dotted var(--rule);
}
.toc a:hover .nm{color:var(--accent)}
.toc .num{font-family:var(--display); font-style:italic; color:var(--accent); min-width:2.2rem; font-size:.95rem}
.toc .nm{font-family:var(--display); font-size:1.12rem; font-weight:500; flex:1 1 auto; min-width:0}
.toc .ct{color:var(--soft); font-size:.9rem; font-variant-numeric:tabular-nums}
.side{display:grid; gap:1rem; align-content:start}
.panel{background:var(--card); border:1px solid var(--rule); border-radius:4px; padding:1.1rem 1.25rem; box-shadow:var(--shadow)}
.panel h3{margin:0 0 .35rem; font-size:1.2rem}
.panel p{margin:0 0 .7rem; color:var(--soft); font-size:.97rem}
.panel p:last-child{margin-bottom:0}
.btn{
  display:inline-block; font:inherit; font-size:.82rem; letter-spacing:.12em; text-transform:uppercase; text-decoration:none;
  background:var(--accent); color:var(--on-accent); padding:.55rem 1.05rem; border-radius:2px; border:1px solid var(--accent); cursor:pointer;
}
.btn:hover{filter:brightness(1.08); text-decoration:none}
.btn.ghost{background:transparent; color:var(--accent)}
.btn.ghost:hover{background:var(--paper-2)}
@media (min-width:52rem){
  .lede{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr); gap:3rem}
  .toc{columns:1}
}

/* category */
.chap{display:flex; align-items:baseline; gap:1rem; flex-wrap:wrap; margin-bottom:.4rem}
.chap h2{font-size:clamp(2rem,5.5vw,3rem); margin:0; font-weight:600}
.chap .n{font-family:var(--display); font-style:italic; color:var(--accent); font-size:1.4rem}
.count{color:var(--soft); margin:0 0 1.5rem}
.grid{list-style:none; margin:0; padding:0; display:grid; gap:1rem; grid-template-columns:repeat(auto-fill,minmax(min(100%,17.5rem),1fr))}
.card{
  display:flex; flex-direction:column; gap:.4rem; height:100%; min-width:0;
  background:var(--card); border:1px solid var(--rule); border-radius:4px; padding:1rem 1.1rem 1rem; text-decoration:none; color:var(--ink);
  box-shadow:var(--shadow); transition:transform .15s ease, border-color .15s ease;
}
.card:hover{border-color:var(--accent); transform:translateY(-2px); text-decoration:none}
.card h3{margin:0; font-size:1.2rem; color:var(--ink)}
.card:hover h3{color:var(--accent)}
.card p{margin:0; color:var(--soft); font-size:.94rem; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden}
.card .foot{margin-top:auto; padding-top:.6rem; display:flex; justify-content:space-between; align-items:center; gap:.5rem; font-size:.84rem; color:var(--soft); border-top:1px dotted var(--rule)}
.dots{display:inline-flex; gap:3px; vertical-align:middle}
.dots i{width:.55rem; height:.55rem; border-radius:50%; border:1px solid var(--accent); display:block}
.dots i.on{background:var(--accent)}

/* recipe */
.recipe{background:var(--card); border:1px solid var(--rule); border-radius:4px; box-shadow:var(--shadow); padding:clamp(1rem,3vw,2rem); min-width:0}
.recipe-in{border:1px dashed var(--rule); padding:clamp(1rem,3.2vw,2.2rem); min-width:0}
.recipe h2{font-size:clamp(2rem,5.5vw,3.2rem); margin:0 0 .4rem; font-weight:600; font-variation-settings:"opsz" 144; letter-spacing:-.01em}
.by{color:var(--soft); margin:0 0 1rem; font-size:.97rem}
.by b{font-weight:600; color:var(--ink)}
.desc{font-style:italic; font-size:1.15rem; margin:0 0 1.5rem; max-width:44rem; text-wrap:pretty}
.meta{display:grid; grid-template-columns:repeat(auto-fit,minmax(8rem,1fr)); gap:0; border-block:1px solid var(--rule); margin-bottom:1.75rem; background:var(--paper-2)}
.meta div{padding:.7rem .9rem; min-width:0; border-right:1px dotted var(--rule)}
.meta div:last-child{border-right:0}
.meta dt{font-size:.7rem; letter-spacing:.18em; text-transform:uppercase; color:var(--soft)}
.meta dd{margin:.1rem 0 0; font-family:var(--display); font-size:1.02rem; font-weight:500; overflow-wrap:anywhere}
.meta dl{display:contents}
.body{display:grid; grid-template-columns:minmax(0,1fr); gap:2rem}
@media (min-width:54rem){ .body{grid-template-columns:minmax(0,5fr) minmax(0,7fr); gap:3rem} }
.body h3{font-size:1.45rem; margin:0 0 .75rem; font-style:italic; font-weight:500; padding-bottom:.35rem; border-bottom:2px solid var(--ink)}
.ing h4{font-family:var(--serif); font-size:.74rem; letter-spacing:.18em; text-transform:uppercase; color:var(--accent); margin:1.2rem 0 .1rem; font-weight:650}
.ing h4:first-of-type{margin-top:0}
.ing ul{list-style:none; margin:0; padding:0}
.ing li{padding:.4rem 0 .4rem 1.15rem; border-bottom:1px dotted var(--rule); position:relative; overflow-wrap:anywhere}
.ing li::before{content:""; position:absolute; left:.1rem; top:1.02rem; width:.38rem; height:.38rem; border:1px solid var(--accent); border-radius:50%}
.steps{list-style:none; margin:0; padding:0; counter-reset:s}
.steps li{counter-increment:s; position:relative; padding:0 0 1rem 2.6rem; overflow-wrap:anywhere}
.steps li::before{
  content:counter(s); position:absolute; left:0; top:-.1rem; font-family:var(--display); font-weight:600; font-size:1.5rem; line-height:1.2; color:var(--accent); width:2rem; text-align:right;
}
.extra{margin-top:1.75rem; display:grid; gap:1rem}
.note{border-left:3px solid var(--sage); padding:.15rem 0 .15rem 1rem}
.note b{display:block; font-size:.72rem; letter-spacing:.18em; text-transform:uppercase; color:var(--sage); font-weight:650}
.pager{display:flex; flex-wrap:wrap; gap:1rem; justify-content:space-between; margin-top:1.5rem}
.pager a{
  flex:1 1 14rem; min-width:0; text-decoration:none; color:var(--ink); border:1px solid var(--rule); border-radius:4px; padding:.7rem 1rem; background:var(--card);
}
.pager a:hover{border-color:var(--accent)}
.pager small{display:block; font-size:.72rem; letter-spacing:.18em; text-transform:uppercase; color:var(--soft)}
.pager .nx{text-align:right}
.pager span.t{font-family:var(--display); font-size:1.05rem; font-weight:500}

/* search */
.results{list-style:none; margin:0; padding:0}
.results li{padding:.85rem 0; border-bottom:1px dotted var(--rule)}
.results a.t{font-family:var(--display); font-size:1.25rem; font-weight:500; text-decoration:none; color:var(--ink)}
.results a.t:hover{color:var(--accent)}
.results .cat{font-size:.78rem; letter-spacing:.16em; text-transform:uppercase; color:var(--soft); margin-left:.6rem}
.results p{margin:.15rem 0 0; color:var(--soft); font-size:.95rem}
mark{background:var(--mark); color:inherit; padding:0 .1em; border-radius:2px}
.empty{color:var(--soft); font-style:italic}

/* menus */
.menus{display:grid; gap:1.25rem; grid-template-columns:repeat(auto-fit,minmax(min(100%,18rem),1fr))}
.menu-card{
  background:var(--card); border:1px solid var(--rule); border-radius:4px; box-shadow:var(--shadow); padding:1.4rem 1.3rem; text-align:center; text-decoration:none; color:var(--ink); display:block;
}
.menu-card:hover{border-color:var(--accent)}
.menu-card h3{margin:.2rem 0 .3rem; font-size:1.5rem}
.menu-card p{margin:0; color:var(--soft); font-size:.95rem}
.menu-sheet{max-width:34rem; margin-inline:auto; background:var(--card); border:1px solid var(--rule); box-shadow:var(--shadow); padding:clamp(1rem,3vw,1.6rem); border-radius:4px}
.menu-sheet .in{border:1px double var(--rule); border-width:3px; padding:clamp(1.5rem,5vw,2.75rem) clamp(1rem,4vw,2rem); text-align:center}
.menu-sheet h2{font-size:clamp(1.7rem,5vw,2.4rem); margin:0 0 .3rem}
.orn{display:flex; align-items:center; gap:.8rem; justify-content:center; color:var(--accent); margin:.9rem 0 1.4rem}
.orn::before,.orn::after{content:""; height:1px; background:var(--rule); flex:1 1 0}
.orn i{width:.5rem; height:.5rem; background:var(--accent); transform:rotate(45deg); display:block}
.menu-list{list-style:none; margin:0; padding:0; display:grid; gap:1.1rem}
.menu-list a{font-family:var(--display); font-size:1.3rem; font-weight:500; color:var(--ink); text-decoration:none}
.menu-list a:hover{color:var(--accent)}
.menu-list small{display:block; font-size:.72rem; letter-spacing:.2em; text-transform:uppercase; color:var(--soft); margin-top:.1rem}

.dsc{display:block}
.abar{margin:0 0 1.25rem}
.abar:empty{display:none}
.rform{display:grid; gap:1.1rem; max-width:44rem; min-width:0}
.fgrid{display:grid; gap:1rem; grid-template-columns:repeat(auto-fit,minmax(min(100%,9.5rem),1fr))}
.fld{display:grid; gap:.3rem; min-width:0}
.fld label{font-weight:650; font-size:.95rem}
.hint{color:var(--soft); font-size:.85rem}
select.ti{appearance:auto}
.ta.tall{min-height:11rem}
.rbar{display:flex; flex-wrap:wrap; gap:.75rem 1.25rem; align-items:center}
.rmsg{margin:0; min-height:1.4em; color:var(--accent)}
.hp{position:absolute; left:-9999px; width:1px; height:1px; opacity:0}
/* discussion */
.cm{margin-top:2rem; padding-top:1.25rem; border-top:3px double var(--rule)}
.cm h3,.th-head h3{font-size:1.45rem; margin:0 0 .5rem; font-style:italic; font-weight:500}
.posts{list-style:none; margin:0; padding:0}
.post{padding:.9rem 0; border-bottom:1px dotted var(--rule); min-width:0}
.post .who{font-weight:650}
.post .when{color:var(--soft); font-size:.85rem; margin-left:.5rem}
.ptext{white-space:pre-wrap; overflow-wrap:anywhere; margin:.3rem 0 0}
.pact{display:flex; flex-wrap:wrap; gap:.4rem 1rem; margin-top:.4rem; align-items:center}
.lk{background:none; border:0; padding:0; font:inherit; font-size:.85rem; color:var(--accent); cursor:pointer; text-decoration:underline; text-underline-offset:.18em}
.lk.danger{color:var(--accent); font-weight:650}
.composer{display:grid; gap:.6rem; margin-top:1rem; min-width:0}
.composer .btn{justify-self:start}
.ta,.ti{width:100%; min-width:0; font:inherit; font-size:1rem; color:var(--ink); background:var(--card); border:1px solid var(--rule); border-radius:4px; padding:.6rem .8rem}
.ta{resize:vertical; min-height:5.5rem}
.tlist{list-style:none; margin:1.25rem 0 0; padding:0}
.tlist li{padding:.9rem 0; border-bottom:1px dotted var(--rule)}
.tlist a{font-family:var(--display); font-size:1.25rem; font-weight:500; color:var(--ink); text-decoration:none}
.tlist a:hover{color:var(--accent)}
.tlist p{margin:.15rem 0 0; color:var(--soft); font-size:.92rem}
.badge{font-size:.7rem; letter-spacing:.14em; text-transform:uppercase; color:var(--sage); margin-left:.4rem}
.th-head{margin:.2rem 0 .6rem}
.th-head h2{font-size:clamp(1.7rem,5vw,2.4rem); margin:0 0 .3rem}

/* submit */
.two{display:grid; gap:1.25rem; grid-template-columns:repeat(auto-fit,minmax(min(100%,19rem),1fr))}
.url{display:block; margin-top:.6rem; font-size:.82rem; color:var(--soft); overflow-wrap:anywhere; user-select:all}

footer{margin-top:3.5rem; text-align:center; color:var(--soft); font-size:.9rem}
footer p{margin:.4rem 0 0}

html{-webkit-text-size-adjust:100%; text-size-adjust:100%}
h2[tabindex="-1"]:focus,h2[tabindex="-1"]:focus-visible,main:focus,main:focus-visible{outline:none}
.search input{font-size:1rem}
@media (pointer:coarse){
  .nav a,.crumbs a,.lk{display:inline-flex; align-items:center; min-height:44px}
  .nav ul{gap:0 1.1rem}
  .crumbs{display:flex; flex-wrap:wrap; align-items:center}
  .btn{display:inline-flex; align-items:center; min-height:44px}
  .search input{min-height:44px}
  .pact{gap:0 1.25rem}
}
@media (prefers-reduced-motion: reduce){ html{scroll-behavior:auto} .card{transition:none} .card:hover{transform:none} }

/* grocery list */
.gl-count{display:inline-block; min-width:1.4em; padding:0 .4em; margin-left:.4em; border-radius:999px; background:var(--accent); color:var(--on-accent); font-size:.72rem; letter-spacing:0; line-height:1.55; text-align:center; font-variant-numeric:tabular-nums; vertical-align:.08em}
.gl-count:empty{display:none}
.rtools{display:flex; flex-wrap:wrap; gap:.4rem 1rem; align-items:center; margin:0 0 1.25rem}
.gl-status{color:var(--sage); font-size:.92rem}
.grid li{position:relative}
.grid .card h3{padding-right:2.4rem}
.gl-card{position:absolute; top:.6rem; right:.6rem; width:2.1rem; height:2.1rem; display:grid; place-items:center; padding:0; border-radius:50%; border:1px solid var(--rule); background:var(--card); color:var(--accent); font:inherit; font-size:1.2rem; line-height:1; cursor:pointer; z-index:1}
.gl-card:hover{border-color:var(--accent)}
.gl-card[aria-pressed="true"]{background:var(--accent); color:var(--on-accent); border-color:var(--accent)}
.gl-bar{display:flex; flex-wrap:wrap; gap:.6rem 1rem; align-items:center; margin:0 0 .5rem}
.gl-wrap{display:grid; grid-template-columns:minmax(0,1fr); gap:2rem; min-width:0}
@media (min-width:54rem){ .gl-wrap{grid-template-columns:minmax(0,4fr) minmax(0,7fr); gap:3rem} }
.gl-wrap h3{font-size:1.45rem; margin:0 0 .75rem; font-style:italic; font-weight:500; padding-bottom:.35rem; border-bottom:2px solid var(--ink)}
.gl-wrap h4{font-family:var(--serif); font-size:.74rem; letter-spacing:.18em; text-transform:uppercase; color:var(--accent); margin:1.3rem 0 .1rem; font-weight:650}
.gl-recipes{list-style:none; margin:0; padding:0}
.gl-recipes li{display:flex; flex-wrap:wrap; gap:.4rem 1rem; align-items:center; justify-content:space-between; padding:.7rem 0; border-bottom:1px dotted var(--rule); min-width:0}
.gl-recipes .t{flex:1 1 11rem; min-width:0; font-family:var(--display); font-size:1.12rem; font-weight:500; color:var(--ink); text-decoration:none; overflow-wrap:anywhere}
.gl-recipes .t:hover{color:var(--accent)}
.gl-recipes .t small{display:block; font-family:var(--serif); font-size:.82rem; font-weight:400; color:var(--soft)}
.gl-recipes .ctl{display:flex; flex-wrap:wrap; gap:.4rem 1rem; align-items:center}
.gl-recipes select.ti{width:auto; padding:.35rem .6rem; font-size:.95rem}
.gl-items{list-style:none; margin:0; padding:0}
.gl-items li{display:flex; gap:.75rem; align-items:flex-start; justify-content:space-between; border-bottom:1px dotted var(--rule)}
.gl-items label{display:flex; gap:.75rem; align-items:flex-start; flex:1 1 auto; min-width:0; padding:.55rem 0; cursor:pointer}
.gl-items input[type="checkbox"]{flex:none; width:1.2rem; height:1.2rem; margin:.28rem 0 0; accent-color:var(--accent)}
.gl-items .tx{min-width:0; overflow-wrap:anywhere}
.gl-items .src{display:block; font-size:.82rem; color:var(--soft)}
.gl-items input:checked + .tx{text-decoration:line-through; color:var(--soft)}
.gl-items li > .lk{margin-top:.6rem}
.gl-add{display:flex; flex-wrap:wrap; gap:.5rem; margin:0 0 .5rem; min-width:0}
.gl-add .ti{flex:1 1 14rem; width:auto}
@media (pointer:coarse){
  .gl-card{width:44px; height:44px; top:.45rem; right:.45rem}
  .grid .card h3{padding-right:3.1rem}
  .gl-items label{min-height:44px; align-items:center}
  .gl-items input[type="checkbox"]{width:1.4rem; height:1.4rem; margin:0}
  .gl-recipes select.ti{min-height:44px}
}

.rphoto{margin:1rem 0 1.4rem}
.rphoto img{display:block; width:100%; max-height:28rem; object-fit:cover; border:1px solid var(--rule); border-radius:3px; background:var(--card)}
.cthumb{display:block; width:100%; aspect-ratio:16/9; object-fit:cover; border-radius:3px; margin:0 0 .6rem; background:var(--rule)}
.pbox{min-height:0}
.pbox img{display:block; max-width:14rem; max-height:11rem; border:1px solid var(--rule); border-radius:3px; margin:.2rem 0 .5rem; object-fit:cover}
.pfile{display:flex; flex-wrap:wrap; gap:.6rem 1rem; align-items:center}
.subform .row{display:grid; gap:1rem; grid-template-columns:repeat(auto-fit,minmax(min(100%,12rem),1fr))}
.hpt{position:absolute; left:-9999px; width:1px; height:1px; overflow:hidden}


/* stage 3: made-it notes, shared lists, backups */
.made{margin-top:2rem; padding-top:1.25rem; border-top:3px double var(--rule)}
.made h3{font-size:1.45rem; margin:0 0 .5rem; font-style:italic; font-weight:500}
.mlist{list-style:none; margin:0 0 1rem; padding:0; display:grid; gap:.9rem}
.mlist li{display:grid; grid-template-columns:auto minmax(0,1fr); gap:.9rem; padding-bottom:.9rem; border-bottom:1px dotted var(--rule); align-items:start}
.mlist li:not(.has-img){grid-template-columns:minmax(0,1fr)}
.mlist img{display:block; width:7rem; height:5.25rem; object-fit:cover; border:1px solid var(--rule); border-radius:3px; background:var(--paper-2)}
.mlist .who{font-weight:650}
.mlist .when{color:var(--soft); font-size:.88rem; margin-left:.5rem}
.mlist p{margin:.2rem 0 0; overflow-wrap:anywhere; white-space:pre-wrap}
.mform{max-width:36rem}
.mform summary{list-style:none; display:inline-flex; cursor:pointer}
.mform summary::-webkit-details-marker{display:none}
.mform form{display:grid; gap:.9rem; margin-top:1rem}
.sharebox{margin:0 0 1rem; padding:.9rem 1rem; border:1px solid var(--rule); border-radius:4px; background:var(--paper-2); display:grid; gap:.6rem; max-width:40rem}
.sharebox .row{display:flex; flex-wrap:wrap; gap:.5rem}
.sharebox input{flex:1 1 14rem; min-width:0}
.sharebox p{margin:0; font-size:.92rem; color:var(--soft)}
.bkp{margin-top:2rem}
.bkp ul{margin:.4rem 0 0 1.1rem; padding:0; color:var(--soft); font-size:.92rem}
/* stage 2: favorites, scaling, filters */
.fav-card{position:absolute; bottom:.5rem; right:.6rem; width:1.9rem; height:1.9rem; display:grid; place-items:center; padding:0; border:0; background:none; color:var(--accent); font:inherit; font-size:1.3rem; line-height:1; cursor:pointer; z-index:1; border-radius:50%}
.fav-card:hover{background:var(--paper-2)}
.grid .card .foot{padding-right:2.2rem}
.fav-btn[aria-pressed="true"]{background:var(--accent); color:var(--on-accent)}
.scaler{display:flex; flex-wrap:wrap; gap:.35rem; align-items:center; margin:0 0 1rem}
.scaler .lbl{font-size:.72rem; letter-spacing:.16em; text-transform:uppercase; color:var(--soft); margin-right:.3rem}
.scaler button{font:inherit; font-size:.92rem; min-width:2.6rem; padding:.28rem .55rem; border:1px solid var(--rule); border-radius:999px; background:var(--card); color:var(--ink); cursor:pointer}
.scaler button:hover{border-color:var(--accent)}
.scaler button[aria-pressed="true"]{background:var(--accent); color:var(--on-accent); border-color:var(--accent)}
.scale-note{margin:0 0 .9rem; font-size:.9rem; font-style:italic; color:var(--soft)}
.sflink{font-size:.8rem; color:var(--soft); white-space:nowrap; align-self:center; margin-left:.7rem}
.sfil{display:grid; gap:.9rem 1rem; grid-template-columns:repeat(auto-fit,minmax(min(100%,11.5rem),1fr)); background:var(--paper-2); border:1px solid var(--rule); border-radius:4px; padding:1rem; margin:0 0 1.25rem}
.sfil label{display:block; font-size:.72rem; letter-spacing:.14em; text-transform:uppercase; color:var(--soft); margin:0 0 .25rem}
.sfil .chk{display:flex; align-items:center; gap:.5rem; font-size:.95rem; letter-spacing:0; text-transform:none; color:var(--ink); margin:0; min-height:2rem}
.sfil .chk input{width:1.1rem; height:1.1rem; accent-color:var(--accent)}
.sfil .ti{padding:.4rem .6rem; font-size:.95rem}
.sfil .full{grid-column:1/-1; display:flex; flex-wrap:wrap; gap:.5rem 1.5rem; align-items:center}
.pfoot{display:none}
@media (max-width:40rem){ .fav-card{width:44px; height:44px; bottom:.2rem; right:.35rem} .grid .card .foot{padding-right:3rem} .scaler button{min-height:44px; min-width:3rem} .sfil .ti,.sfil select{min-height:44px} .sfil .chk{min-height:44px} }
@media print{
  .made,.sharebox{display:none !important}
  :root{--paper:#fff; --card:#fff; --paper-2:#f4f4f4; --ink:#000; --soft:#333; --rule:#999; --accent:#000}
  body{background:#fff; padding:0; font-size:11pt}
  .mast,.nav,.pager,.crumbs,footer,.skip,.cm,.noprint,.abar{display:none !important}
  .gl-wrap{display:block}
  .gl-items input[type="checkbox"]{accent-color:#000}
  main{padding:0}
  .recipe,.recipe-in{border:0; box-shadow:none; padding:0}
  .body{grid-template-columns:4fr 7fr; gap:1.5rem}
  .recipe h2{font-size:24pt}
  .steps li,.ing li{break-inside:avoid}
  @page{margin:.55in}
  body{font-size:10.5pt; line-height:1.38}
  .scaler,.sflink,.fav-card{display:none !important}
  .recipe h2{font-size:21pt; margin-bottom:.15rem}
  .desc{font-size:11pt; margin-bottom:.7rem}
  .by{margin-bottom:.5rem}
  .rphoto{margin:.4rem 0 .7rem}
  .rphoto img{max-height:2.3in; border-radius:0}
  .meta{margin-bottom:.8rem}
  .meta div{padding:.35rem .6rem}
  .ing li{padding:.18rem 0 .18rem 1rem}
  .ing li::before{top:.58rem}
  .steps li{padding-bottom:.45rem}
  .extra{margin-top:.8rem}
  .pfoot{display:block; text-align:center; font-size:9pt; color:#555; border-top:1px solid #999; margin-top:.9rem; padding-top:.35rem}
}

<script>
const MODE = "php";
const STANDALONE = MODE === "static", PHP = MODE === "php";
const D = {"cats":[{"slug":"appetizers","name":"Appetizers","recipes":[{"slug":"3-Ingredient","title":"3-Ingredient Sausage Dip","ing":["1 (10-ounce) can Rotel diced tomatoes and chilies","1 (16-ounce) package Jimmy Dean's original pork sausage","1 (8-ounce) package of Philadelphia cream cheese"],"dir":["In a cold pan over medium heat, saute ground sausage, breaking meat up into smaller pieces. Heat until fully browned, about 12 minutes.","Once all sausage is evenly browned, drain meat and transfer sausage to your crock pot. Set crockpot to low heat.","Add block of cream cheese and un-drained can of tomatoes and chilies to the crockpot, stirring into the sausage dip until fully incorporated. Serve with Fritos scoops or your favorite chip."],"by":"Hannah","attr":"Hannah","desc":"This easy-to-make recipe is a Super Bowl party sensation.","prep":"20 minutes","total":"20 minutes","serves":"6","diff":1,"tools":"Crock Pot or Chafing Dish","cat":"appetizers"},{"slug":"Artichoke","title":"Artichoke Dip","ing":["1 cup Mayonnaise","1 cup Parmesan cheese, grated","1 can (14 ounces) Artichoke hearts (NOT marinated)","1/8 teaspoon Garlic salt"],"dir":["Preheat oven to 350 degrees.","Drain water off the artichoke hearts and mix everything together in a blender.","Blend until it is a smooth consistency.","Bake at 350 degrees in an uncovered baking dish for 15-30 minutes or until starts bubbling.","Serve hot with your choice of crackers."],"by":"Marilyn Brock","attr":"Marilyn","desc":"Tastes Great!","prep":"5 minutes","total":"15-30 minutes","serves":"8-12","diff":1,"tools":"Blender, 8 inch by 8 inch baking dish","cat":"appetizers"},{"slug":"WrappedDates","title":"Bacon Wrapped Dates","ing":["16 pitted Medjool dates","8 slices thick-cut Bacon (1/2 piece per date)","16 pickled Jalapeño slices","4 ounces Parmigiano reggiano cheese (or similar), broken into bite-sized chunks"],"dir":["Soak toothpicks in water for 10–15 minutes.","Pit the dates, then fill each with parmesan cheese and a jalapeño slice.","Trim filling as needed and gently close the date around it.","Wrap half a bacon slice around each date and secure with a toothpick.","Preheat air fryer to 400°F/200°C on air fry setting.","Arrange dates in air fryer basket and cook 10 minutes until bacon reaches desired doneness, turning halfway through."],"by":"Hannah","attr":"Hannah","prep":"15 minutes","cook":"10 minutes","total":"45 minutes","serves":"8","diff":1,"tools":"Toothpicks, soaked; Air Fryer","cat":"appetizers"},{"slug":"BlueCheese","title":"Blue Cheese Ball","ing":["16 ounces Cream cheese","6 ounces Blue cheese","2 tablespoons chopped Pimentos","2 tablespoons chopped Green pepper","2 teaspoons Garlic salt","Optional: 1 cup Pecans, finely chopped"],"dir":["Make 24 hours before serving","Let cheeses sit at room temperature awhile for easier mixing","Mix everything together with your hands","Form into a ball","Optional: Roll ball in pecans"],"by":"Marilyn","attr":"Marilyn","desc":"A holiday staple for the Brocks","prep":"45 minutes","total":"45 minutes","serves":"12","diff":1,"cat":"appetizers"},{"slug":"BeetEggs","title":"Beeted Eggs","ing":["Eggs (usually did 6 or more)","Aunt Nellies whole pickled beets (comes in a glass jar; 1 or 2 jars depending on number of eggs)"],"dir":["Hard boil eggs, as many or as few as you would like.","Cool eggs and peel.","Place boiled eggs and pickled beets in a glass jar. Stir to be sure eggs are covered.","Refrigerate at least 24 hours. Stir/mix occasionally.","Cut eggs in half to serve. Some like a dash of pepper."],"by":"Marcia","attr":"Gram","desc":"This was always a part of our Easter. There was a plate made for deviled eggs. She would use this for serving. The outside would have the beeted eggs and the middle would be filled with pickled beets. I always understood this to be a midwestern tradition.","prep":"15 minutes","total":"24 hours plus prep time","diff":1,"notes":"These will keep in the refrigerator for several days.","cat":"appetizers"},{"slug":"boiled-peanuts","title":"Boiled Peanuts","ing":["2.5 lbs of green peanuts","1/3 cup non-iodized sea salt","8 cups of water"],"dir":["Rinse peanuts in sink filled with cool water, swirling them around in the water to remove all dirt.","In a stock pot, add peanuts, water and salt.","Bring to a boil, then reduce heat to medium for 2 hours. Check every 30 minutes and add water as needed.","Turn off burner and let peanuts soak for 30 minutes to an hour, depending on the saltiness you'd like.","Drain and enjoy!"],"by":"Mary Brock","attr":"Mary Brock","desc":"The perfect anytime appetizer for any God-fearing southerner!","prep":"10 minutes","total":"2 1/2 hours","serves":"4","diff":2,"cat":"appetizers"},{"slug":"Brie","title":"Brie in Pastry","ing":["1 handful all-purpose flour","1 sheet puff pastry","1 16 ounce wheel of brie cheese","1/4 cup Toasted almonds, sliced","1/4 cup Parsley, chopped","1 Egg, beaten with 1 teaspoon of water"],"dir":["Preheat the oven to 400 degrees.","Thaw pastry for 20 minutes.","Roll sheet out on a lightly floured surface to a 15 inch circle.","Slice brie horizontally and add a layer with almonds and parsley.","Reassemble and place in the center of the pastry.","Brush pastry edges with egg wash, and pull up sides to enclose brie.","Place seam side down on an ungreased baking sheet.","If desired, decorate the top with pastry scraps.","Brush with egg wash.","Bake for 20 minutes.","Let stand 10 minutes before serving."],"by":"Marcia","attr":"Marcia","prep":"20 minutes","cook":"20 minutes","total":"30 minutes","serves":"8","diff":2,"tools":"Pastry brush, baking sheet","cat":"appetizers"},{"slug":"Cellulite","title":"Cellulite Dip","ing":["8 ounces Cream cheese","8 ounces Sour cream","1 (8 ounces) jar Bean dip (plain or jalapeño)","8 ounces Shredded cheese (whatever kind you like)","1 bag of tortilla chips"],"dir":["Preheat oven to 350 degrees","Mix cream cheese, sour cream, and bean dip together and pour into a baking dish","Top with shredded cheese","Bake uncovered at 350 degrees for 30 minutes or until bubbly","Cool for 5 to 10 minutes","Serve with tortilla chips"],"by":"Marcia","attr":"Marcia","desc":"With a name like that, what's not to love?!","prep":"15 minutes","total":"35-40 minutes","serves":"8","diff":1,"tools":"8 inch by 8 inch baking dish","cat":"appetizers"},{"slug":"CheddarBacon","title":"Cheddar Bacon Dip","ing":["16 ounces Sour cream","1 packet Hidden Valley Ranch dressing mix","3/4 cup Bacon, chopped, cooked","1 cup shredded cheddar cheese","Fritos, baby carrots and/or celery sticks"],"dir":["Mix together sour cream, ranch dressing mix, bacon, and cheddar cheese.","Cover with cling wrap and refrigerate for 24 hours.","Serve with Fritos and/or veggies. It is also great on top of a baked potato."],"by":"Susan","attr":"Susan","desc":"This is a great dip for parties, tailgating, or just at home on game day.","prep":"5 minutes","total":"5 minutes + 24 hours refrigeration","serves":"4 cups","diff":1,"tools":"Bowl, cling wrap","cat":"appetizers"},{"slug":"cheese-ball","title":"Cheese Ball","ing":["1 pound sharp cheddar cheese","8 ounces cream cheese","1/2 teaspoon hot sauce","1/4 teaspoon garlic salt","1/4 teaspoon regular salt","2 tablespoons mayonnaise","1 teaspoon mustard","1 cup pecans, finely chopped (optional)"],"dir":["Prepare 24 hours ahead","Grind sharp cheese using a cheese grinder","Allow both cheeses to reach room temperature for simpler blending","Combine all ingredients by hand","Shape into a ball","Optionally coat with chopped pecans"],"by":"Marilyn","attr":"Marilyn","desc":"Nothing says special occasion like a ball of cheese!","prep":"15 minutes","serves":"8","diff":1,"tools":"Cheese grinder","cat":"appetizers"},{"slug":"CheeseBiscuit","title":"Cheese Biscuits","ing":["1 stick butter","1 cup sharp cheddar cheese","1/2 teaspoon red cayenne pepper","1 cup all-purpose flour","40-45 pecan halves"],"dir":["Heat oven to 350°F","Grate the cheese","Whip the butter until soft","Combine cheese with butter, then incorporate salt, pepper, and flour","Form mixture into small spheres with a pecan half pressed into each for texture","Transfer to ungreased baking sheet","Bake at 350°F for 15 minutes"],"by":"Gram","attr":"Gram","prep":"15 minutes","cook":"15 minutes","total":"15 minutes","serves":"40-45 biscuits","diff":1,"tools":"Cheese grater, hand mixer and bowl, cookie sheet","cat":"appetizers"},{"slug":"CheeseSausage","title":"Cheese Sausage Balls","ing":["3 cups Bisquick mix","1 pound finely grated sharp cheddar cheese","1 pound hot sausage"],"dir":["Preheat oven to 350 degrees.","Let cheese sit at room temperature for 15 minutes.","Combine all ingredients, mixing with hands.","Roll into balls about the size of a large walnut.","Bake for 12-15 minutes on an ungreased cookie sheet. (Check after 10 minutes)"],"by":"Gram Horn","attr":"Gram Horn","desc":"\"Especially good with mixed drinks.\" -Pap","prep":"25 minutes","cook":"12-15 minutes","total":"1 hour","serves":"50-60 balls","diff":1,"tools":"Cookie sheet","cat":"appetizers"},{"slug":"Straws","title":"Cheese Straws","ing":["1/2 pound butter, room temperature","1/2 pound grated sharp cheddar cheese, room temperature","3 cups all-purpose flour","1/2 teaspoon salt","3 dashes Tabasco sauce"],"dir":["Heat oven to 400 degrees.","Combine butter and cheese until blended.","Mix in flour, salt, and hot sauce.","Load dough into cookie press with star tube attachment and pipe strips onto greased baking sheet.","Bake briefly until golden and crisp, monitoring closely to prevent burning."],"by":"Marilyn","attr":"Marilyn","desc":"A classic from the past.","prep":"15 minutes","cook":"12 minutes","serves":"8","diff":1,"tools":"Cookie press fitted with star tube, cookie sheet","cat":"appetizers"},{"slug":"Chex","title":"Chex Mix","ing":["3 cups Corn Chex cereal","3 cups Rice Chex cereal","3 cups Wheat Chex cereal","3 cups Cheerios cereal","1 stick Butter (8 tablespoons)","2 tablespoons Worcestershire sauce","1½ teaspoons Seasoned salt","¾ teaspoon Garlic powder","½ teaspoon Onion powder"],"dir":["Preheat oven to 250°F","Combine cereals in large microwavable bowl","Microwave butter on high for ~40 seconds until melted","Stir in seasonings","Pour over cereals and mix until coated","Spread on ungreased baking sheet; bake 1 hour, stirring every 15 minutes","Cool on paper towels for 15 minutes","Store in airtight container"],"by":"Leon and Mary Brock","attr":"Marilyn Brock","desc":"Great for snacking!","prep":"5 minutes","cook":"15 minutes","serves":"8 servings","diff":1,"tools":"Microwavable mixing bowl, spoon, microwave, rimmed baking sheet, paper towels","notes":"Air fryer option: Follow steps 1–4, then cook at 350°F for 3 minutes, shake basket, and cook 2 more minutes.","cat":"appetizers"},{"slug":"dOeuvre","title":"Crab Meat Hors d'Oeuvre","ing":["1 loaf white bread","1 can (6 ounces) crabmeat, drained","5 teaspoons mayonnaise","1/2 teaspoon dry mustard","8 ounces cream cheese","1 cup sharp cheddar cheese, grated","1/2 teaspoon garlic salt","1 jar stuffed olives, halved"],"dir":["Remove crusts and cut bread into 4 squares","Toast squares until firm but not browned","Blend crabmeat, mayonnaise, mustard, cream cheese, cheddar, and garlic salt","Before serving, spread mixture on toasted bread","Add paprika and top with olive slices","Broil on high until cheese melts","Serve hot"],"by":"Marcia","attr":"Marcia","prep":"15 minutes","total":"5 minutes","serves":"8-12","diff":1,"tools":"Knife, baking sheet","cat":"appetizers"},{"slug":"CreamCheese","title":"Cream Cheese and Olive Spread","ing":["8 ounces cream cheese, softened","1 teaspoon mayonnaise","1/3 cup green olives, sliced"],"dir":["Combine all ingredients and spread on bread for sandwiches. Can be served open-faced or cut into finger sandwiches."],"by":"Marcia","attr":"Gram via Marilyn, Marlene and Marcia","desc":"A nostalgic sandwich spread featuring cream cheese and olives, with the option to substitute pineapple. \"We all remember it especially on a picnic at the beach.\"","prep":"5 minutes","serves":"4","diff":1,"tools":"Mixing bowl, spatula, bread knife","notes":"Whipped cream cheese may replace regular cream cheese; if used, omit mayonnaise.","cat":"appetizers"},{"slug":"Crescent","title":"Crescent Roll Sandwich Ring","ing":["2 (8-ounce) cans refrigerated Pillsbury crescent rolls","8 slices Provolone cheese, halved","1/4 pound deli-sliced ham","1/2 cup roasted red bell peppers (jarred), drained and patted dry","1/3 lb deli-sliced hot salami","1/4 lb deli-sliced capocolla or prosciutto","1/2 cup hot pepper rings (jarred) or pickled giardiniera, drained and patted dry","1/8 teaspoon black pepper"],"dir":["Preheat oven to 375°F (350°F for dark/nonstick sheets).","Unroll dough; arrange 16 triangles in a ring with short sides forming a 5-inch center circle, overlapping to create a sun-like pattern.","Layer cheese halves, ham, roasted peppers, salami, capocolla, and pepper rings on each triangle.","Fold dough triangles over filling, tucking underneath to secure. Sprinkle with black pepper.","Bake 23–28 minutes until golden brown. Cool 5–10 minutes before slicing."],"by":"Hannah","attr":"Hannah","desc":"This party appetizer features a ring arrangement of crescent roll triangles filled with Italian meats, cheeses, and peppers. \"Cook it on a wire rack with parchment paper, which allows the bottom of the pastry to cook all the way through without sticking.\"","prep":"20 minutes","cook":"60 minutes","serves":"8","diff":1,"tools":"Rimmed baking sheet, wire cooling rack, parchment paper","cat":"appetizers"},{"slug":"Finnish","title":"Finnish Fried Mushrooms","ing":["4 tablespoons Butter","1/4 cup chopped Onions","1/2 cup Sour cream","1 pound Mushrooms, fresh, thinly sliced"],"dir":["Melt butter and add onions.","Cook 3-5 minutes on medium heat.","Add mushrooms and cook for another 3 to 5 minutes.","Stir in sour cream until mushrooms are covered."],"by":"Marlene","attr":"Marlene","desc":"A scrumptious Scandinavian snack!","prep":"5 minutes","cook":"5 minutes","total":"10 minutes","serves":"4","diff":1,"tools":"Sauté pan","cat":"appetizers"},{"slug":"Gougeres","title":"Gougeres","ing":["1 1/2 cups water","6 ounces unsalted butter","1 tablespoon kosher salt","1 1/2 cups all-purpose flour","6 large eggs","2 cups grated Gruyere cheese","1/2 cup grated Parmesan","1 teaspoon chopped rosemary","2 teaspoons chopped thyme","1 egg for egg wash"],"dir":["Boil water, butter, and salt in a medium saucepan.","Remove from heat; stir in flour.","Return to medium-high heat, stirring until butter separates from pan sides; transfer to mixer bowl and cool slightly (about 1 minute), or cool by hand-stirring.","Add eggs individually on low speed, increasing to medium between additions until incorporated; mix thoroughly after each egg."],"by":"Marcia","attr":"Robert Sinskey Vineyards & Mike St Johns","desc":"A freezer-friendly appetizer that can be enjoyed plain or served warm alongside soft cheeses like Boursin.","prep":"20 minutes","total":"50 minutes plus freezing time","serves":"Approximately 24","diff":2,"tools":"Medium saucepan, stand mixer (optional), 1-tablespoon cookie scoop (optional), sheet pan, parchment paper","notes":"The original page's directions end after the eggs are added; the remaining steps (stirring in the cheeses and herbs, scooping, egg wash, baking, freezing) were not published.","cat":"appetizers"},{"slug":"LayerBean","title":"Layered Bean Dip","ing":["8 ounces Cream cheese","1 small can (8 1/2 ounces) Refried beans or bean dip","2 Green onions, chopped","5 ounces Sour cream","4 ounces finely grated Cheddar cheese","7 ounces Guacamole","1 cup Salsa","1 bag Tortilla chips for serving"],"dir":["Layer ingredients in pie plate in the given order","Ensure guacamole layer is completely covered by subsequent layers to prevent browning","Cover and seal well with cling film","Chill at least 2 to 3 hours for flavors to blend","Let set at room temperature for 1 hour","Serve with tortilla chips"],"by":"Marcia","attr":"Marcia","desc":"¡¡Muy Delicioso!!","prep":"15 minutes + 2-3 hours to chill + 1 hour rest","total":"4 hours 15 minutes","serves":"8","diff":1,"tools":"10\" Pie plate with 1 1/2\" high sides, cling film","cat":"appetizers"},{"slug":"MonteCarlo","title":"Monte Carlo Dip","ing":["2 pounds Velveeta Cheese","1 pound ground beef, browned","1 16-ounce can chili beans in mild sauce","1 jar (8 ounces) taco sauce","1 bag tortilla chips (for dipping)"],"dir":["Combine all ingredients in crock pot","Heat on low setting for 1 1/2-2 hours until melted","Serve warm with tortilla chips"],"by":"Susan","attr":"Phyllis Hodge","desc":"Versatile recipe suitable for \"game day tailgating, an appetizer, or as an entree for nacho night.\"","prep":"5 minutes","cook":"1 1/2-2 hours","serves":"24","diff":1,"tools":"Crock pot","cat":"appetizers"},{"slug":"Apricot","title":"Nutty Apricot Cheese Spread","ing":["2 (8-ounce) containers Cream cheese, softened","1/2 cup Apricot preserves","6 oz dried Apricots, diced into small pieces","1 cup roasted Pecan pieces (optional)"],"dir":["Combine all the ingredients.","Mix well.","Place in a crock and store in the refrigerator for up to one month.","Serve with ginger snaps or club crackers."],"by":"Marcia","attr":"Marilyn","desc":"This was a favorite, served at bridge club.","prep":"10 minutes","total":"10 minutes","serves":"8-12","diff":1,"tools":"Mixing bowl, air-tight storage container or crock","cat":"appetizers"},{"slug":"OnionBread","title":"Onion Bread Sticks","ing":["1/2 cup onion butter (see below)","12 slices white bread"],"dir":["Heat oven to 375 degrees.","Remove crusts from bread.","Spread onion butter on each slice.","Cut each slice into 5 strips.","Arrange strips on ungreased baking sheet.","Bake 10 minutes until golden."],"by":"Roz","attr":"Roz","prep":"15 minutes","cook":"10 minutes","total":"25 minutes","serves":"60 bread sticks","diff":1,"notes":"Onion Butter: Mix 1 envelope Lipton onion soup mix with 1/2 pound butter or margarine. Yields 1 1/4 cups. Store remaining butter in refrigerator. Use with baked potatoes and vegetables.","cat":"appetizers"},{"slug":"Pimento","title":"Pimento Cheese","ing":["2 cups sharp cheddar cheese, thickly shredded","2 large serving spoons Miracle Whip","1 can (4 ounces) diced pimentos, drained","Salt, to taste","Pepper, to taste"],"dir":["Combine all ingredients together","Cover and refrigerate in an air-tight container"],"by":"Mary Brock","attr":"Lydia Barineau","desc":"Delicious, especially during the Masters!","prep":"10 minutes","serves":"6","diff":1,"tools":"Mixing bowl, large serving spoon, air-tight container","cat":"appetizers"},{"slug":"Plains","title":"Plains Special Cheese Ring","ing":["1 pound sharp cheese, grated","1 cup chopped nuts","1 cup mayonnaise","1 small onion, finely grated","Black pepper to taste","1/8 teaspoon cayenne pepper","1 (12-ounce) jar strawberry preserves","1 box buttery crackers (such as Ritz)"],"dir":["Combine cheese, nuts, mayonnaise, and onion","Season with pepper","Mix thoroughly and place in greased savarin mold","Refrigerate several hours or overnight until firm","To serve, place strawberry preserves in the center and accompany with buttery crackers"],"by":"Susan","attr":"Marilyn","desc":"A signature appetizer associated with former President Jimmy Carter and his wife Rosalynn. The dish combines sharp cheese with nuts and mayonnaise, topped with strawberry preserves when served.","prep":"10 minutes","cook":"Overnight","serves":"12-16","diff":2,"tools":"5-6 quart savarin mold","cat":"appetizers"},{"slug":"Peanuts","title":"Roasted Peanuts","ing":["1 pound peanuts, fresh"],"dir":["Heat oven to 300 degrees.","Spread nuts on an ungreased baking sheet and roast for 45 minutes.","Stir occasionally throughout baking to ensure uniform toasting."],"by":"Gram","attr":"Gram","desc":"Not sure if it will taste the same in any other oven than Gram's","cook":"45 minutes","total":"45 minutes","serves":"8","diff":1,"tools":"Baking sheet","cat":"appetizers"},{"slug":"Pecans","title":"Roasted Pecans","ing":["1 pound Pecans, halved","4-5 tablespoons Margarine","Salt, to taste"],"dir":["Heat oven to 300-325 degrees.","Arrange pecans on a cookie sheet.","Distribute 3-4 tablespoons margarine over nuts.","As margarine melts, stir the pecans around.","Bake at 300-325 degrees for 10 to 15 minutes.","Season with salt immediately after removing from oven."],"by":"Gram Horn","attr":"Gram Horn","cook":"10-15 minutes","total":"10-15 minutes","serves":"8","diff":1,"tools":"Baking sheet","cat":"appetizers"},{"slug":"Schubert","title":"Sister Schubert Rolls","ing":["1 pan Sister Schubert rolls, thawed","1/2 cup butter, softened","2 tablespoons yellow mustard","1/2 teaspoon Worcestershire sauce","3 green onions, finely chopped","1 pound honey ham, finely chopped","6 ounces Swiss cheese, finely chopped","4 ounces Parmesan cheese, finely chopped","6 ounces sharp cheddar cheese, finely chopped"],"dir":["Heat oven to 375°F","Blend butter, mustard, Worcestershire sauce, and onions","Mix in all cheeses","Slice rolls and spread filling on bottom halves","Replace tops and arrange in foil pan","Cover with foil","Bake 15-20 minutes until heated through"],"by":"Marilyn","attr":"Marilyn","desc":"A simple, crowd-pleasing appetizer featuring store-bought rolls enhanced with a savory ham and cheese filling.","prep":"40 minutes","cook":"15-20 minutes","total":"55-60 minutes","serves":"2-3 pans of rolls","diff":1,"tools":"Foil pan from rolls, aluminum foil","cat":"appetizers"},{"slug":"Spanakopita","title":"Spanakopita (Spinach Pie)","ing":["1 pound spinach","2 tablespoons olive oil","7 green onions, chopped","1 pound feta cheese","2 tablespoons fresh flat leaf parsley, chopped","2 tablespoons fresh fennel or dill, chopped","Freshly ground pepper to taste","Pinch of freshly grated nutmeg (optional)","12 to 14 filo dough sheets"],"dir":["Rinse, stem, and chop spinach into small pieces; rinse again and drain thoroughly","Warm olive oil in large sauté pan over medium heat","Add spinach and green onions; sauté until wilted, approximately 5 minutes","Transfer to sieve, drain well, chop coarsely, and set aside","Mash feta cheese with fork in mixing bowl","Combine parsley, dill/fennel, and spinach mixture with feta cheese","Brush 9x13 baking pan with olive oil","Layer 6 filo sheets, brushing each with oil","Spread spinach mixture evenly over filo","Layer 6-8 more filo sheets, brushing each with oil","Cover and chill approximately 30 minutes","Preheat oven to 350°F","Bake until golden, about 30 minutes","Cool 5-10 minutes, cut into squares, and serve"],"by":"Gram and Pap","attr":"Gram and Pap","desc":"A Greek savory pastry featuring spinach and feta cheese layers","prep":"20 minutes","cook":"60 minutes","serves":"8-10","diff":1,"tools":"Knife, cutting board, colander or sieve, large sauté pan, fork, spoon, 9x13 inch baking pan, aluminum foil","cat":"appetizers"},{"slug":"StuffedMushrooms","title":"Stuffed Mushrooms","ing":["12 flat mushrooms, 2 inches across","1/2 cup melted butter","1 small onion, diced","1 clove garlic, crushed","1 teaspoon dried thyme","1/2 cup finely chopped ham","1/4 cup finely chopped parsley","1 tablespoon lemon juice","1 teaspoon butter (extra)","2 tablespoons chicken or beef stock (or water)","Ground pepper, to taste","1/2 cup soft breadcrumbs"],"dir":["Heat oven to 400°F","Wipe mushroom caps clean","Remove and finely chop stalks","Brush caps with melted butter","Arrange caps on oven-proof dish, dark side up","Heat remaining butter in pan","Cook onion 2 minutes","Add garlic, chopped stalks, and thyme","Stir in ham and cook 1 minute","Mix pepper, breadcrumbs, parsley, and lemon juice","Distribute filling evenly among caps","Dot each with butter","Add stock to dish base","Bake approximately 10 minutes until tender"],"by":"Marcia","attr":"Marcia","prep":"10 minutes","cook":"10 minutes","total":"15 minutes","serves":"12","diff":2,"tools":"Oven-proof dish, pastry brush, sauté pan","cat":"appetizers"},{"slug":"Tiropita","title":"Tiropita","ing":["6-8 cups Milk","1 cup Flour","1/2 pound Butter","2 pounds Crumbled feta cheese","5-6 Eggs","1/2 pound Phyllo pastry dough"],"dir":["Thoroughly beat eggs and combine with crumbled feta cheese","Simmer milk and butter in a pot","Add flour while stirring constantly to prevent lumping","Once thickened, remove from heat and stir in cheese-egg mixture","Melt butter for brushing phyllo; layer half the dough in baking dish, brushing each sheet","Add cheese filling; top with remaining phyllo, brushing each layer with butter","Score surface into two-by-two inch squares using a knife","Bake at 350°F for 45-60 minutes until golden brown"],"by":"Marcia","attr":"Marcia","desc":"This Greek cheese pastry offers flexibility in cheese selection. While feta is traditional, \"Greek kasseri cheese, or kefalograviera for a spicier taste\" work well. Maintain approximately two pounds of cheese total, and consider adding pepper for enhanced heat.","prep":"20 minutes","cook":"45-60 minutes","total":"1 hour 30 minutes","serves":"6","diff":2,"tools":"Fork, saucepan, 12\" x 16\" baking dish, knife","notes":"Serve immediately while hot.","cat":"appetizers"},{"slug":"Zesty","title":"Zesty Ritz Crackers","ing":["1 large box Ritz Crackers","1 stick unsalted Butter","1 envelope dried Ranch seasoning mix","1/3 cup shredded Parmesan cheese"],"dir":["Heat oven to 300 degrees","Line 2 baking sheets with parchment paper","In a large bowl, melt the butter and mix in the entire packet of ranch seasoning mix","Combine crackers with the butter mixture, coating gently","Add parmesan cheese to the coated crackers","Place the crackers on your parchment lined baking sheets in a single layer","Bake for 15-20 minutes"],"by":"Hannah","attr":"Hannah","desc":"A simple seasoned cracker appetizer","prep":"5 minutes","cook":"15-20 minutes","total":"15-20 minutes","serves":"8","diff":1,"tools":"2 Rimmed baking sheets","cat":"appetizers"}]},{"slug":"beef","name":"Beef","recipes":[{"slug":"BeefBroc","title":"Beef and Broccoli","ing":["2 pounds flank steak (slightly frozen)","2 pounds broccoli","4 teaspoons cornstarch","1/4 cup cold water","3 tablespoons soy sauce","1 teaspoon salt","1 cup vegetable or corn oil","3 cups chicken broth"],"dir":["Slice beef thinly against the grain into 3-inch lengths.","Remove broccoli stems and cut florets into 1/2- to 3/4-inch chunks.","Mix cornstarch with cold water to dissolve, then add soy sauce and salt.","Heat oil in wok and stir fry beef 8-10 minutes until done. Drain, reserving 3 tablespoons oil.","Heat chicken broth in a separate pot.","Clean wok and reheat with reserved oil.","Combine cornstarch mixture with hot broth.","Stir fry broccoli 3 minutes until oil is absorbed.","Add beef and broth mixture; stir until sauce thickens. Serve over rice."],"by":"Rick Wall","attr":"Rick Wall","desc":"A Chinese favorite","prep":"15 min","cook":"20 min","total":"35 min","serves":"4","diff":3,"tools":"Wok","notes":"Dissolve cornstarch in cold water specifically—warm water will create dumplings instead of sauce.","cat":"beef"},{"slug":"Bulgogi","title":"Beef Bulgogi Bowls","ing":["1/2 cup Jasmine rice","5 teaspoons white wine vinegar","1/2 teaspoon sugar","Salt and pepper","Cucumber","4 ounces shredded carrots","Olive oil","10 ounces ground beef, thinly sliced steak, or French Dip leftovers","1 tablespoon sesame seeds","Bulgogi sauce","4 tablespoons sour cream","1 teaspoon sriracha","1 tablespoon butter","Scallions"],"dir":["Rice: Combine rice, 3/4 cup water, and salt in a pot. Boil, then cover and simmer 15 minutes.","Vegetables: Mix vinegar, sugar, and salt. Peel cucumber into ribbons and soak in mixture. Sauté carrots in oil until tender (~1 minute).","Beef: Brown beef in oil, add half the sesame seeds and bulgogi sauce, simmer.","Sriracha Crema: Combine sour cream, salt, and sriracha; thin with water to drizzling consistency.","Assembly: Fluff rice with butter, layer in bowls with beef, cucumber, and carrots. Drizzle crema, garnish with scallions and remaining sesame seeds."],"by":"Marcia","attr":"Hannah and Richard","desc":"A great Korean dish, easy, and wonderful flavors. Don't skip the pickling of the cucumbers!","prep":"15 minutes","cook":"30 minutes","total":"45 minutes","serves":"2","diff":1,"tools":"Vegetable peeler, non-stick pan","cat":"beef"},{"slug":"BeefJerk","title":"Beef Jerky","ing":["2 pounds flank steak (eye, round, or top round steak)","1/2 cup low-sodium soy sauce","2 tablespoons worcestershire sauce","2 teaspoons coarsely-ground black pepper","1 teaspoon liquid smoke","1 teaspoon onion powder","1 teaspoon seasoned salt","1/2 teaspoon garlic powder"],"dir":["Thinly slice steak into 1/8-inch strips with or against the grain. Freezing the steak 15-30 minutes beforehand makes slicing easier. Place strips in a large ziplock bag.","Whisk remaining ingredients together. Pour mixture over steak, seal bag, and toss to coat evenly. Refrigerate at least 30 minutes or up to 1 day.","Preheat oven to 175°F using upper-middle and lower-middle racks. Line two baking sheets with foil and wire cooling racks. Arrange meat strips in single layers and bake approximately 4 hours, flipping halfway through, until dry and firm yet slightly pliable. Store in sealed container refrigerated up to 1 month."],"by":"Susan Hodge","attr":"Susan Hodge","desc":"This beef jerky recipe is full of awesome savory flavors, it includes no added sweeteners, and it's irresistibly delicious!","prep":"40 minutes (up to 1 day)","cook":"5 hours (up to 28 hours)","total":"5 hours (could be 28 hours)","serves":"12","diff":3,"tools":"Air fryer","cat":"beef"},{"slug":"Strog","title":"Beef Stroganoff","ing":["1 1/2 pounds beef filet, cut into narrow strips (hamburger may substitute)","3 tablespoons butter, divided","1 medium onion, sliced","1 tablespoon flour","1 cup beef broth or canned consommé","1 teaspoon prepared mustard","3 tablespoons sour cream","1 (4 oz) can mushrooms, drained (fresh mushrooms may substitute)"],"dir":["Cut beef into julienne strips. Heat 1 1/2 tablespoons butter in a pan; add beef and onions, browning them. Set aside and keep warm.","Melt remaining butter in a saucepan, add flour and whisk until combined. Bring consommé to a boil in a separate pan, then add to the butter mixture while stirring until thickened and smooth. Stir in mustard.","Add sour cream and mushrooms to the sauce. Heat for approximately 3 minutes until warmed through.","Pour sauce over beef and serve."],"attr":"Marcia Wall","desc":"Beef with mushroom sauce, best served with egg noodles or rice","prep":"15 minutes","cook":"20 minutes","total":"35 minutes","serves":"4","diff":2,"cat":"beef"},{"slug":"Szechwan","title":"Beef Szechwan","ing":["2 Tablespoons soy sauce","1 Tablespoon rice wine","2 Teaspoons sugar","1/4 Teaspoon monosodium glutamate","Salt to taste","2 Pounds beef flank steak, julienne cut","1 Cup vegetable oil","8-16 Small dried red peppers","1 Cup julienne carrots","1 Cup julienne celery"],"dir":["Combine soy sauce, rice wine, sugar, MSG, and salt in a bowl; reserve.","Heat oil in wok over high heat; add beef and cook 8-10 minutes with constant stirring until dry. Drain in sieve-lined bowl.","Return 1 tablespoon oil to wok on high heat. Add peppers and cook 1 minute stirring constantly. Remove and discard peppers; retain oil.","Add beef and soy mixture to wok; cook 5 minutes while stirring.","Add carrots and celery; cook 3 minutes while stirring.","Serve immediately with white rice, fried rice, or lo mein noodles."],"by":"Marcia & Rick Wall","attr":"Marcia & Rick Wall","desc":"A Chinese favorite with a little spice","prep":"15 min","cook":"20 min","total":"35 min","serves":"4","diff":3,"tools":"Wok","cat":"beef"},{"slug":"BeefTip","title":"Beef Tips","ing":["1 1/2 pounds stew beef","1/2 package Lipton Onion Soup Mix","1 (3 ounce) jar mushrooms with juice","1 (10.5 ounce) can cream of mushroom soup","3/4 cup sour cream","1/3 cup cooking sherry"],"dir":["Heat oven to 325°F","Combine onion soup mix, mushrooms with their liquid, cream of mushroom soup, sour cream, and cooking sherry in the dutch oven","Mix beef tips into the soup mixture until coated","Cover and bake at 325°F for 3 hours. Serve over rice or potatoes"],"by":"Susan Hodge","attr":"Susan Hodge","desc":"A slow-cooked beef dish that produces enticing aromas while preparing. It can be served over rice or mashed potatoes.","prep":"5 minutes","cook":"3 hours","total":"3 hours","serves":"6-8","diff":1,"tools":"Enameled cast iron dutch oven","cat":"beef"},{"slug":"Beefy","title":"Beefy Jalapeno Cornbread","ing":["1 cup yellow cornmeal","1 cup milk","2 eggs, beaten","3/4 teaspoon salt","1/2 teaspoon baking soda","1/2 cup bacon drippings or vegetable oil","1 (17 oz) can cream-style corn","1 pound ground beef","1 pound shredded cheddar cheese","1 medium onion, chopped","4-5 jalapeno peppers, seeded and chopped"],"dir":["Combine cornmeal, milk, eggs, salt, soda, bacon drippings, and canned corn; mix thoroughly.","Brown the ground beef separately; drain.","Spread half the batter in a greased pan; layer with cheese, beef, onion, and peppers. Top with remaining batter.","Bake uncovered at 350°F for 50 minutes."],"attr":"Mary Horn","desc":"A Southwestern-style savory cornbread that doubles as a complete meal, featuring ground beef and peppers baked into the cornmeal base.","prep":"15 min","cook":"50 min","total":"1 hour 30 min","serves":"10-12","diff":2,"tools":"13x9x2 inch baking pan","cat":"beef"},{"slug":"ChMac","title":"Chili Mac","ing":["1 pound ground beef","2 tablespoons olive oil","1 large onion, diced","1 large green pepper, diced","1 (14.5 oz) can diced tomatoes","1 (15.5 oz) can kidney beans","1 (8 oz) can tomato sauce","4 ounces chili peppers, minced and seeded","2 teaspoons chili powder","1 teaspoon salt","1/2 cup water","2 cups uncooked elbow pasta","Shredded cheddar cheese for serving"],"dir":["Brown ground beef in Dutch oven over medium-high heat, then drain and set aside.","Heat oil in same pot and sauté peppers and onions until softened.","Add tomatoes, beans, sauce, chili peppers, seasoning, water, meat, and uncooked pasta. Reduce heat, cover, and simmer 15-20 minutes until pasta reaches desired tenderness."],"by":"Leon and Mary Brock","attr":"Jackie Rowell","desc":"Delicious spin on chili! Serve in with shredded cheddar cheese on top.","prep":"10 minutes","cook":"15-20 minutes","total":"30 minutes","serves":"8","diff":2,"tools":"Knife, cutting board, Dutch oven with lid, ladle","cat":"beef"},{"slug":"Cubed","title":"Cubed Steak","ing":["1 Tablespoon butter","1 1/2 Pounds cubed steak","1 Package onion soup mix","1 (10.5 Ounce) Can cream of mushroom soup"],"dir":["Warm butter in skillet","Brown the steak on both sides in the hot skillet","Add onion soup mix and cream of mushroom soup to skillet; mix thoroughly. Thin with water as needed","Simmer on low heat approximately 1 hour, turning meat once or twice during cooking"],"attr":"Mary Horn","desc":"Beef & gravy, great with mashed potatoes","prep":"5 min","cook":"1 hour 15 min","total":"1 hour 20 min","serves":"4","diff":2,"cat":"beef"},{"slug":"French","title":"French Dip","ing":["3-4 pound rump roast","2 (10.5 oz) cans Campbell's beef broth","2 (10.5 oz) cans Campbell's beef consommé"],"dir":["Combine roast and soups in slow cooker on high; switch to low after 2 hours","Shred beef and serve on fresh baguettes with cooking juices for dipping"],"by":"Susan Hodge","attr":"Susan Hodge","desc":"A beef sandwich featuring shredded meat served on crusty bread with a savory dipping sauce. The recipe emphasizes convenience, as it can cook all day in a slow cooker.","prep":"5 minutes","cook":"4+ hours","total":"4+ hours","serves":"4","diff":1,"tools":"Crock Pot","cat":"beef"},{"slug":"FriedOnions","title":"Fried Onion Burgers","ing":["1 large onion, cut into 3/4\" strips","Salt (dash)","1 pound ground beef","Willies Hog Dust (or similar seasoned salt)","Worcestershire sauce","1 tablespoon butter","1 teaspoon vegetable oil","Buns","Sliced cheese (optional)"],"dir":["Season onions with salt and let rest 30 minutes to release moisture, then pat dry.","Mix Willies Hog Dust and Worcestershire sauce into ground beef; divide into four balls and refrigerate ~10 minutes.","Heat oil and butter in a pan on medium.","Form four onion piles; press each beef ball atop onions so they stick to the patty bottom.","Cook burgers onion-side down for 15 minutes.","Flip and increase heat to high for 2–3 minutes until done.","Rest 5 minutes before serving."],"by":"Marcia","attr":"Hannah and Richard","desc":"Yum, yum, yum!","prep":"10 minutes","cook":"1 hour","total":"1 hour 10 minutes","serves":"4","diff":1,"cat":"beef"},{"slug":"Goulash","title":"Goulash","ing":["1 pound hamburger","1 medium onion","4-5 medium potatoes","2 (4-ounce) cans tomato sauce","8 ounces grated cheddar cheese","Water"],"dir":["Dice potatoes into thin, small pieces resembling fried potatoes","Brown hamburger and onion in a large pot","Add potatoes, tomato sauce, and water (from rinsing cans)","Cook 20 minutes, stirring occasionally to prevent burning","Remove from heat, top with grated cheese, and allow to melt (approximately 2 minutes)"],"attr":"Mary Horn","desc":"Ground beef and potato dish with tomato sauce and melted cheddar cheese, best served with crusty bread for dipping in the au jus. Described as an easy meal to start in the morning.","prep":"15 minutes","cook":"20 minutes (stovetop) + 4+ hours (if using slow cooker)","total":"4+ hours","serves":"4","diff":1,"tools":"Crock Pot","cat":"beef"},{"slug":"hodge-family-beef-stroganoff","title":"Hodge Family Beef Stroganoff","ing":["1 pound ground beef","8 ounces wide egg noodles","1 can cream of mushroom soup","1 package Lipton onion soup mix","8 ounces sour cream"],"dir":["Brown the ground beef in a skillet over medium heat. Drain","While the beef is cooking, cook egg noodles according to package instructions. Drain","Combine ground beef, egg noodles, mushroom soup, onion soup and sour cream","Stir until all ingredients are well blended"],"by":"Susan Hodge","attr":"Hodge Family","desc":"A quick weeknight ground beef and noodle dish","cook":"20 minutes","total":"20 minutes","serves":"4","diff":2,"tools":"Skillet","cat":"beef"},{"slug":"MeatNoSpace","title":"Meatloaf","ing":["1 Egg","1/2 Cup water or tomato juice","1 1/2 Pound chopped beef","1 Cup soft bread crumbs","2 Teaspoons salt","1/8 Teaspoon pepper","4 Slices bacon"],"dir":["Grease a baking dish or bread pan with bacon. Preheat oven to 400 degrees.","Beat the egg in a mixing bowl. Add water or tomatoes and mix.","Combine beef, bread crumbs, salt and pepper. Mix thoroughly.","Shape mixture into loaf pan. Arrange bacon strips on top.","Bake for 35-45 minutes. Serve hot."],"by":"Marlene and Marcia","attr":"Gram Horn","desc":"A classic beef meatloaf recipe","prep":"15 minutes","cook":"35-45 minutes","total":"1 hour 10 minutes","serves":"9 slices","diff":2,"tools":"Baking dish or bread pan","cat":"beef"},{"slug":"MeatSpace","title":"Meat Loaf","ing":["1 pound hamburger","1 egg","1 cup cracker crumbs and torn bread pieces (combined)","3 tablespoons onion, finely chopped or minced","1 tablespoon green pepper, chopped","½ teaspoon salt","½ teaspoon pepper","Ketchup or tomato sauce for topping","2 carrots, quartered","4 small to medium potatoes, quartered"],"dir":["Preheat oven to 350°F","Combine hamburger, egg, bread crumbs, onion, bell pepper, salt, and pepper","Shape mixture into a loaf and place in baking dish","Cover top with ketchup or tomato sauce","Arrange carrots and potatoes around the meatloaf; add ½ inch water around dish edges","Bake at 350°F for 45–50 minutes, turning vegetables occasionally and basting with water as needed"],"by":"Marcia","attr":"Gram","desc":"A cherished family recipe for traditional meatloaf that holds sentimental value across generations.","prep":"15 minutes","cook":"1 hour","total":"1 hour 15 minutes","serves":"4","diff":2,"tools":"Baking dish","notes":"Onion soup mix (one envelope) can replace fresh chopped onions; omit added salt if substituting.","cat":"beef"},{"slug":"Mississippi","title":"Mississippi Pot Roast","ing":["1 (3-4 pound) chuck roast","1 packet ranch dressing mix","1 packet au jus gravy mix","1/4 cup butter","4-5 pepperoncini peppers"],"dir":["Add roast to slow cooker, then sprinkle the ranch and au jus mixes over the top. Place peppers on the seasonings and add butter.","Cook on low for 8 hours. Serve alongside noodles, rice, or mashed potatoes."],"by":"Carson Hodge","attr":"Carson Hodge","desc":"A delicious easy to do pot roast from the crock pot","prep":"Under 10 minutes","cook":"8 hours","total":"7-8 hours","serves":"6","diff":1,"tools":"Crock pot","notes":"\"Do not add any water or broth to this! It will make enough liquid as it cooks.\"","cat":"beef"},{"slug":"Mompot","title":"Mom's Pot Roast","ing":["3–4 pounds boneless chuck roast","2–3 bay leaves","2 tablespoons Worcestershire sauce","6 medium potatoes"],"dir":["Place chuck roast in a pan with water until nearly submerged over low heat. Season with salt and pepper; add bay leaves on top.","Cook 2½–3 hours until tender.","Increase heat and reduce water (keeping some liquid) until meat browns on the bottom.","Remove meat and stir Worcestershire sauce into remaining liquid. Add potatoes and simmer 20–25 minutes on low heat, adding water if needed."],"attr":"Mary Horn","desc":"A classic recipe for pot roast - slow cooking at its finest!","cook":"3–3½ hours","total":"3–3½ hours","serves":"6","diff":2,"tools":"Dutch oven","cat":"beef"},{"slug":"OnePot","title":"One Pot Beef Stroganoff","ing":["1 1/4 pounds boneless beef sirloin steak, cut into thin strips","1 tablespoon Montreal steak seasoning","4 tablespoons butter","8 ounces white mushrooms, thinly sliced","1 medium onion, finely chopped","32 ounces beef broth","1/2 cup sour cream","4 cups uncooked medium egg noodles"],"dir":["Combine beef and steak seasoning in a bowl.","Brown seasoned beef in melted butter in a Dutch oven over medium-high heat (4-7 minutes per side); set aside.","Sauté mushrooms and onion in remaining butter until browned and softened (7-9 minutes).","Add broth and heat to simmer; temper sour cream by whisking in 1/2 cup hot liquid.","Stir in noodles and boil, then simmer 10-15 minutes until tender and liquid reduces. Return beef, then remove from heat and fold in sour cream mixture. Rest 5 minutes before serving."],"by":"Leon and Mary Brock","desc":"Easy weeknight dinner","prep":"5 minutes","cook":"55 minutes","total":"1 hour","serves":"6","diff":2,"tools":"Knife, cutting board, 2 mixing bowls, 5 qt Dutch oven, ladle, tongs, plate, foil, whisk","cat":"beef"},{"slug":"StirBB","title":"Stir - Fried Beef with Broccoli","ing":["1/2 pound sirloin or tenderloin beef","1/2 pound broccoli","1/2 cup oil for frying","6 green onion sections (3/4 inch)","6 thin ginger slices","1/2 tablespoon cooking wine","Marinade: 1 teaspoon cooking wine","Marinade: 1 tablespoon soy sauce","Marinade: 1 tablespoon cornstarch","Marinade: 3 tablespoons water","Sauce: 2 tablespoons oyster or soy sauce","Sauce: 1/2 teaspoon sugar","Sauce: 1/2 teaspoon cornstarch","Sauce: 1 tablespoon water"],"dir":["Trim beef and slice across the grain into 1¼-inch thick pieces.","Marinate beef in combined marinade ingredients for 30 minutes.","Blanch broccoli florets for 2 minutes, then cool in cold water and drain.","Toss beef with 1 tablespoon oil before cooking.","Combine sauce ingredients and set aside.","Heat oil to medium-hot (275°F), add beef, stir-fry about 20 seconds until color changes. Drain on paper towels.","Using remaining oil heated to 375°F, stir-fry green onion and ginger until fragrant. Add broccoli, wine, beef, and sauce. Toss and serve hot."],"by":"Marcia Wall","attr":"Marcia Wall","desc":"Chinese classic - serve with white rice or lo mein noodles","prep":"30 min","cook":"15 min","total":"45 min","serves":"2","diff":3,"tools":"Bowl, pot, colander, pan or wok","cat":"beef"},{"slug":"SwedMeat","title":"Swedish Meatballs","ing":["1½ pounds ground beef","1 teaspoon paprika","1½ teaspoons salt","1½ medium onions, finely chopped or grated","⅓ cup Minute rice","¼ teaspoon oregano","2 tablespoons shortening or vegetable oil","1 (10.5 oz) can cream of mushroom soup","½ cup boiling water with 1 beef bouillon cube","1 cup sour cream","⅓ cup Parmesan cheese"],"dir":["Combine beef, paprika, salt, onion, rice, and oregano; form into 1-inch balls.","Heat oil in skillet and brown meatballs; transfer to paper towels.","Mix cream of mushroom soup, beef broth, and sour cream until smooth.","Place meatballs in casserole, pour sauce over them, and sprinkle with Parmesan.","Bake at 300°F for 30–40 minutes."],"by":"Marilyn Brock","attr":"Marilyn Brock","desc":"Ground beef meatballs prepared with a creamy mushroom sauce, ideal served alongside rice or noodles and a green vegetable for an elegant dinner presentation.","prep":"10 minutes","cook":"30–40 minutes","total":"1 hour 10 minutes","serves":"6","diff":2,"tools":"Two bowls, skillet, casserole dish","cat":"beef"},{"slug":"WholeBeef","title":"Whole Beef Tenderloin","ing":["3-4 Pound Whole Beef Tenderloin","Red wine"],"dir":["Allow the roast to reach room temperature for one hour before cooking","Heat oven to 350 degrees","Place in pan and add half an inch of red wine or water to reduce smoke","Roast for 15 minutes per pound; for medium-rare doneness, remove when thermometer reaches 120 - 125 degrees","Rest the meat at least 10 minutes before slicing and serving"],"by":"Marcia Wall","attr":"New York Butcher Shop Mt Pleasant","desc":"A nice, simple, easy Christmas entree.","prep":"1 hour","cook":"15 minutes per pound","total":"1 hour + 15 minutes per pound","serves":"Depends on size of tenderloin","diff":2,"tools":"Roasting pan with rack/broiler pan","cat":"beef"}]},{"slug":"breads","n d, cubed (Pepperidge Farm stuffing may substitute)","1 pound hot sausage","6-7 eggs","1 teaspoon salt","2 cups milk","1 cup sharp cheddar cheese, shredded","1/8 teaspoon Tabasco","1/8 teaspoon Worcestershire sauce"],"dir":["Arrange cubed bread in bottom of baking dish","Brown sausage, drain, crumble finely, and layer over bread","Whisk eggs with remaining ingredients","Refrigerate overnight","Bake at 350°F for 45 minutes"],"by":"Marcia","attr":"Marcia","prep":"15 minutes, plus overnight","cook":"45 minutes","total":"90 minutes, plus overnight","tools":"9 inch by 14 inch baking dish","cat":"breakfast","diff":0},{"slug":"ToastBake","title":"French Toast Bake","ing":["1/2 cup butter, melted","1 cup packed brown sugar","1 loaf thick-sliced bread (English Muffin bread recommended)","4 eggs","1 1/2 cups milk","1 teaspoon vanilla","Cinnamon","Powdered sugar","Maple syrup"],"dir":["Combine melted butter with brown sugar and transfer to glass pan","Arrange bread slices over mixture","Whisk eggs, milk, and vanilla together","Layer half the egg mixture over bread; sprinkle with cinnamon","Add second bread layer","Pour remaining egg mixture on top","Cover with foil and refrigerate overnight","Bake at 350°F for 45 minutes, uncovering after 30 minutes","Top with powdered sugar and cinnamon; serve with syrup and berries"],"by":"Marcia","attr":"Barbara Wall","desc":"This is one of those great put together-the-night-before recipes. Ideal for entertaining, it requires minimal advance preparation.","prep":"10 minutes, plus overnight","cook":"45 minutes","total":"1 hour 15 minutes, plus overnight","serves":"8","diff":1,"tools":"9x13 inch glass pan, spoon, aluminum foil","cat":"breakfast"},{"slug":"HashCass","title":"Hash Brown Casserole","ing":["2 pounds frozen hash browns (thawed)","16 ounces sour cream","1½ teaspoons salt","½ teaspoon pepper","1 can cream of chicken soup","½ cup chopped onion","12 ounces sharp cheddar cheese (grated)"],"dir":["Heat oven to 350 degrees","Combine all ingredients and transfer to a greased 9x13 casserole dish","Bake for 1 hour at 350 degrees"],"by":"Susan Hodge","attr":"Susan Hodge","desc":"A breakfast casserole inspired by Cracker Barrel's version that works well as a side dish for any meal.","prep":"5 minutes","cook":"1 hour","total":"1 hour","serves":"6-8","diff":1,"tools":"9x13 casserole dish","cat":"breakfast"},{"slug":"Juliet","title":"Juliet's Air Fryer French Toast","ing":["4 slices Brioche bread (or other thick-sliced bread)","1 egg","1/4 cup Greek yogurt","1 tablespoon maple syrup","1 teaspoon vanilla extract","1 teaspoon ground cinnamon (plus extra)","Optional: 1/4 cup berries","Optional: chocolate or white chocolate chips"],"dir":["Press a spoon into each bread slice's center to form a shallow well without piercing through","Combine egg, Greek yogurt, maple syrup, vanilla, and cinnamon in a bowl","Whisk until completely smooth with no lumps","Place bread in air fryer (two per batch); add optional fruits or sweets","Fill wells 2/3 full with egg mixture; dust with cinnamon","Air fry at 360°F for 6 minutes","Remove with spatula and tongs; repeat with remaining slices"],"by":"Hannah","attr":"Hannah","desc":"This recipe is most successful when assembled in the air fryer, rather than on the counter and transferred into the air fryer.","prep":"10 minutes","cook":"6 minutes","total":"20 minutes","serves":"2","diff":1,"tools":"Air fryer, spoon, whisk","cat":"breakfast"},{"slug":"Pancake","title":"Pancakes","ing":["2 cups All-purpose flour","4 teaspoons Baking Powder","1 tablespoon Sugar","1/8 teaspoon Salt","2 Eggs","1 cup Milk","1/4 cup Margarine, melted"],"dir":["Combine flour, baking powder, sugar, and salt in a bowl.","Stir in eggs, milk, and melted margarine until well combined.","Preheat griddle until water droplets form beads and roll across surface.","Pour batter onto hot griddle; flip when bottom browns, then cook the other side until complete."],"by":"Gram Horn","attr":"Gram Horn","desc":"Classic breakfast pancakes","prep":"5 minutes","cook":"15 minutes","total":"20 minutes","serves":"4 (approximately 12 pancakes)","diff":1,"tools":"Mixing bowl, spoon, pancake griddle or griddle pan","cat":"breakfast"},{"slug":"Raisin","title":"Raisin Granola","ing":["4 cups old-fashioned oats","2 cups shredded coconut","1 cup wheat germ","3 cups mixed nuts (walnuts, pecans, almonds)","1½ teaspoons salt","2 (14 oz) cans sweetened condensed milk","½ cup vegetable oil","3 cups raisins"],"dir":["Preheat oven to 300°F","Combine oats, coconut, wheat germ, nuts, salt, and raisins in a large bowl","Mix in oil thoroughly","Add condensed milk and stir until combined","Spread mixture evenly on parchment-lined sheets","Bake one hour at 300°F, stirring halfway through","Cool and break into bite-sized pieces"],"by":"Marcia","attr":"Golf buddy","desc":"A sweet, crunchy snack created for golf tournaments. The recipe yields a large batch and is frequently halved for personal use.","prep":"15-20 minutes","cook":"1 hour","total":"1 hour 15-20 minutes","serves":"1 gallon","diff":1,"tools":"2 cookie sheets","cat":"breakfast"},{"slug":"EggPie","title":"Sausage and Egg Pie","ing":["2 Pie crusts, unbaked","12 ounces grated Mozzarella cheese","1 pound Hot sausage","3/4 cup Milk","4 Eggs","1/2 teaspoon Pepper","1/2 teaspoon Salt"],"dir":["Place grated cheese on the bottom of pie shells.","Brown sausage and drain.","Layer over cheese; mix other ingredients and spoon over sausage.","Preheat oven to 350 degrees.","Bake for 30-40 minutes."],"by":"Susan Hodge","attr":"Marilyn Brock","desc":"This is a quiche-meets-breakfast casserole. It makes 2 pies. I usually make one substituting spinach for the sausage.","prep":"5 minutes","cook":"30-40 minutes","total":"60 minutes","serves":"6-8 (2 pies)","diff":1,"cat":"breakfast"},{"slug":"spanish-tortilla","title":"Spanish Tortilla","ing":["2 cups frozen shredded hashbrowns","1 1/2 cups extra virgin olive oil","8 eggs (room temperature preferred)","1 teaspoon kosher salt"],"dir":["Heat oil over medium-low in a non-stick skillet","Cook hashbrowns 20 minutes","Whisk eggs with salt in a bowl","Remove cooked hashbrowns with slotted spoon; drain on paper towels 5 minutes","Combine hashbrowns with eggs; let sit 20 minutes","Drain oil from pan","Reheat skillet over medium-low; add mixture","Cook 6-8 minutes until set","Flip quickly onto dinner plate, slide back into pan; cook another 6-8 minutes","Serve hot or at room temperature"],"by":"Leon and Mary Brock","attr":"España","desc":"A Spanish breakfast staple featuring a distinctive omelette made with potatoes. The recipe notes it works equally well for any meal and welcomes variations with cured meats.","prep":"1 hour","cook":"30 minutes","total":"90 minutes","serves":"6-8","diff":1,"tools":"An omelette/frittata pan with flip capability simplifies execution, though not required.","cat":"breakfast"}]},{"slug":"casseroles","name":"Casseroles","recipes":[{"slug":"ArSpChCa","title":"Artichoke-Spinach Cheese Casserole","ing":["6 ounces marinated artichoke hearts, drained","2 packages frozen chopped spinach, thawed","6 ounces cream cheese","2 Tablespoons butter, softened","4 Tablespoons milk","1/2 cup grated Romano cheese","Pepper, to taste"],"dir":["Heat oven to 350°F","Put artichoke hearts in a medium casserole dish. Squeeze the spinach dry and layer over artichokes","Blend cream cheese with butter, gradually incorporate milk, then spread over spinach layer; finish with Romano and pepper","Bake 40 minutes total—30 minutes covered, then 10 minutes uncovered"],"by":"Marlene","attr":"Marlene","desc":"May be refrigerated 24 hours prior to cooking.","prep":"30 minutes","cook":"70 minutes","total":"100 minutes","serves":"4-6","diff":2,"cat":"casseroles"},{"slug":"Aspara","title":"Asparagus Pea Casserole","ing":["1 can asparagus, drained","1 can Le Suer Peas, drained","1 can cream of mushroom soup","4 ounces grated cheddar cheese","1/2 package slivered almonds"],"dir":["Heat oven to 350°F","Combin
