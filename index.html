e crust, top with second crust, seal edges, cut vents.","Bake 30-35 minutes until golden."],"by":"Marcia","attr":"Gram","desc":"A classic raisin pie recipe","prep":"10 minutes","cook":"30-35 minutes","total":"45 minutes","serves":"8","diff":1,"cat":"pies-and-cakes"},{"slug":"RedVelv","title":"Red Velvet Cake","ing":["1 1/2 cups sugar","1 1/2 cups Wesson oil","2 eggs","2 1/4 cups self-rising flour","1 cup milk","1/2 teaspoon baking soda","1 teaspoon vinegar","2 teaspoons vanilla (divided)","1 ounce red food coloring","8 ounces cream cheese","1 stick margarine","1 box confectioners' sugar","1 can flaked coconut (divided)"],"dir":["Heat oven to 350°F.","Blend sugar with oil; incorporate eggs one at a time.","Add flour, milk, baking soda, vinegar, 1 teaspoon vanilla, and food coloring; beat thoroughly.","Transfer batter to pans; bake 25 minutes or until done (layered cakes cook faster).","Cool completely before frosting.","Blend cream cheese, margarine, remaining vanilla, sugar, and half the coconut for frosting.","Apply frosting and garnish with remaining coconut."],"attr":"Marilyn","desc":"A classic red velvet cake that yields either a 3-layer cake or a 10x14\" sheet cake, featuring a cream cheese and coconut frosting.","prep":"35 minutes","cook":"25 minutes","total":"1 hour","serves":"8-12","diff":2,"tools":"Hand mixer or stand mixer","notes":"From the Five Family Cookbook.","cat":"pies-and-cakes"},{"slug":"RichApple","title":"Rich's Apple Crisp","ing":["1 bag apples (approximately 2-3 pounds), peeled and sliced","1/2 cup sugar","1/2 cup oleo","1/4 cup brown sugar","1 cup flour"],"dir":["Heat oven to 350°F.","Spread sliced apples in a 9x13\" pan.","Combine sugar, oleo, brown sugar, and flour with hand mixer until crumbly texture forms.","Distribute mixture over apples.","Bake 30 minutes, then broil 5 minutes until browned."],"attr":"Richard","prep":"15 minutes","cook":"35 minutes","total":"50 minutes","serves":"6-8","diff":1,"tools":"Hand mixer","cat":"pies-and-cakes"},{"slug":"ScallPine","title":"Scalloped Pineapple","ing":["1 (20 oz) can pineapple chunks in juice, undrained","1 stick butter, melted","2 cups sugar","3 eggs, beaten","4 cups bread cubes (white bread, crusts removed, quartered)"],"dir":["Preheat oven to 350°F.","Drain pineapple and reserve juice.","Cool melted butter.","Combine butter, pineapple, eggs, sugar, and bread gently.","Transfer to 9x12 dish and add reserved pineapple juice to moisten top.","Bake 40 minutes until browned."],"by":"Susan Hodge","attr":"Marilyn Brock","desc":"This recipe is a hit wherever it shows up. It is very sweet and is almost more a dessert than a side dish.","prep":"15 minutes","cook":"40 minutes","total":"55 minutes","serves":"6-8","diff":1,"tools":"9x12 baking dish","cat":"pies-and-cakes"},{"slug":"ShonStrawPi","title":"Shoney's Strawberry Pie","ing":["1 pie shell, cooked","1 cup sugar","1 cup water (or Sprite/7up substitute)","1 quart strawberries, halved","3-4 tablespoons cornstarch","Whipped topping"],"dir":["Prepare pie shell per package directions.","Combine sugar, water, 1 cup strawberries, and cornstarch in saucepan over medium heat until mixture becomes translucent.","Cool both saucepan contents and baked crust.","Fold remaining berries into filling; transfer to crust and refrigerate until set.","Add whipped topping immediately before serving."],"by":"Susan Hodge","attr":"Marilyn Brock","desc":"It was a yearly tradition for Susan and Marilyn to go to the Nutcracker and was always followed by a stop at Shoney's for a piece of strawberry pie.","prep":"30 minutes","cook":"45 minutes","total":"1 hour 15 minutes","serves":"6-8","diff":2,"tools":"Large saucepan","cat":"pies-and-cakes"},{"slug":"SCPound","title":"Sour Cream Pound Cake","ing":["2 sticks butter","3 cups sugar","6 eggs","3 cups all-purpose flour, sifted","1/2 teaspoon baking soda","8 ounces sour cream","1 teaspoon vanilla","1 teaspoon lemon extract"],"dir":["Heat oven to 300°F.","Combine butter and sugar until creamy.","Separate eggs. Incorporate yolks into butter mixture.","Combine sifted flour with baking soda; alternate adding this with sour cream to the mixture.","Whip egg whites until stiff peaks form. Add vanilla and lemon extract, then fold gently into batter.","Transfer to greased, floured bundt pan. Bake 30-45 minutes until a toothpick inserted in center emerges clean."],"by":"Leon and Mary Brock","attr":"Foy Nelle Barineau","desc":"A classic pound cake enhanced with sour cream for moisture and tenderness, featuring vanilla and lemon flavoring.","prep":"15 minutes","cook":"30-45 minutes","total":"1 hour","serves":"Depends if you're sharing","diff":2,"tools":"Hand or stand mixer; Mixing bowl; Flour sifter; Spatula; Bundt cake pan","cat":"pies-and-cakes"}]},{"slug":"pork","name":"Pork","recipes":[{"slug":"air-fryer-boston-butt","title":"Air Fryer Boston Butt","ing":["5-6 lb pork shoulder","Jack Daniels Pork rub","1 sliced onion","4 crushed garlic cloves","Apple cider vinegar","Worcestershire sauce","Liquid Smoke"],"dir":["Season and refrigerate overnight in covered dutch oven.","Remove 2 hours before cooking to reach room temperature.","Cut pork into 4 equal pieces.","Add sliced onion and garlic to dutch oven bottom.","Arrange pork pieces over aromatics.","Combine 1.25 cup apple cider vinegar, 0.25 cup Worcestershire sauce, 0.5 cup water, and 1 Tbsp liquid smoke.","Pour mixture over pork, cover, and cook on Slow Cook/Low setting for 5-6 hours until internal temperature reaches 195-205°F.","Shred and serve with barbecue sauce."],"by":"Leon and Mary","desc":"This is a great alternative to a traditionally cooked boston butt. Very flavorful and tender!","prep":"20 minutes","cook":"5-6 hours","serves":"8","diff":2,"tools":"Air fryer; 5.5 qt dutch oven","cat":"pork"},{"slug":"BakeHam","title":"Baked Ham","ing":["1 large bone-in ham","Whole cloves (sufficient quantity to cover ham)","1 cup brown sugar","1 tablespoon cornstarch","1/4 teaspoon salt","1 can (8½ oz.) crushed pineapple with syrup","2 tablespoons lemon juice","1 teaspoon prepared mustard"],"dir":["Position ham skin-side up in roasting pan; cover with foil. Stud entire surface with cloves.","Bake at 325°F for 40-50 minutes per pound (approximately 3½-4 hours total).","Thirty minutes before completion, remove ham and drain pan drippings. Create shallow crosshatch pattern on surface.","Combine brown sugar, cornstarch, and salt in saucepan. Stir in can of crushed pineapple with syrup, lemon juice, and mustard.","Heat until boiling, stirring constantly; boil one minute. Apply glaze to ham surface. Yields 1¾ cup glaze."],"attr":"Mary Horn","desc":"A classic glazed ham recipe featuring a pineapple glaze with mustard and lemon.","prep":"15 minutes","cook":"4 hours","serves":"8","diff":2,"tools":"Roasting pan","cat":"pork"},{"slug":"Bar-B","title":"Bar-B-Que","ing":["6 pounds beef brisket or pork shoulder","Coarse sea salt","Ground black pepper","1 cup water","1 cup cider vinegar","Bar-B-Que sauce (your choice)"],"dir":["Remove all visible fat from the meat.","Season thoroughly with salt and pepper.","Place meat in roasting pan and add vinegar and water to bottom.","Roast at 350°F until tender, approximately 2-3 hours.","Shred the cooked meat and mix with your preferred barbecue sauce."],"attr":"Rick and Marcia","desc":"A slow-roasted meat dish featuring beef brisket or pork shoulder","prep":"15 minutes","cook":"2-3 hours","total":"2-3 hours","serves":"12-15","diff":3,"tools":"Roasting pan with rack","cat":"pork"},{"slug":"BeanHam","title":"Beans and Ham","ing":["1 package (16 ounces) dried beans (Navy, pinto, speckled butter beans, or preferred variety)","Chopped ham (leftover ham bone or 1 ham steak, cubed)","Salt and pepper to taste","1 clove garlic or to taste"],"dir":["Rinse beans and soak overnight or several hours in water. Drain and rinse again before cooking.","Combine beans with ham, seasonings, and garlic in your cooking vessel. Add sufficient water to cover ingredients well.","For Dutch oven preparation: Heat to boiling, then reduce heat and simmer gently until beans reach desired tenderness.","For slow cooker preparation: Set to high setting for several hours (typically starting in the morning). Once mixture bubbles, you may reduce to low heat."],"attr":"Mary Horn","desc":"A great use of leftover ham but also works with fresh ham","prep":"5 minutes plus overnight soak","cook":"8 hours","total":"8 hours 5 minutes (plus overnight)","serves":"8","diff":2,"tools":"Crock Pot or Dutch oven","cat":"pork"},{"slug":"Caldo","title":"Caldo Gallego","ing":["1/4 cup olive oil","1/4 pound diced salt pork","1/4 pound diced ham","1 diced onion","2 cloves crushed garlic or garlic paste","1 bay leaf","1 (16 oz) can white kidney beans","1 Boar's Head chorizo sausage, diced","1 (10 oz) box chopped spinach","2 cans diced potatoes","4 cups chicken stock","1 package ham bouillon","Salt and pepper to taste","1/4 teaspoon cumin","Crusty bread for serving"],"dir":["Sauté olive oil, salt pork, and ham over medium-high heat for 5 minutes.","Add onion, garlic, and bay leaf; sauté 5 minutes more.","Add remaining ingredients except bread. Bring to a boil, then simmer 20–25 minutes. Serve with crusty bread."],"by":"Leon and Mary Brock","desc":"Spanish Galician Soup","prep":"30 minutes","cook":"30 minutes","total":"1 hour","serves":"6","diff":1,"tools":"Knife; Cutting board; Dutch oven; Ladle","cat":"pork"},{"slug":"Carnita","title":"Carnitas","ing":["1/4 cup vegetable oil","4–6 pound pork shoulder roast, cut into fist-sized chunks, fat cap removed","Salt and pepper to taste","1 large onion, diced","1 clove garlic, crushed","3 tablespoons lime juice","1 tablespoon chili powder","1/2 teaspoon dried oregano","1/2 teaspoon ground cumin","6–8 cups chicken broth"],"dir":["Brown seasoned pork in hot oil, then braise with aromatics and broth until tender.","Shred the meat and finish in a 400-degree oven for 30 minutes, basting with cooking liquid until edges crisp."],"by":"Leon and Mary Brock","desc":"A slow-cooked pork shoulder dish that becomes tender and easily shredded, then finished in the oven for crispy edges.","prep":"45 minutes","cook":"2 to 2.5 hours (stovetop) plus 30 minutes (oven)","total":"3 hours","serves":"8 to 12","diff":2,"tools":"Large Dutch oven; Baking sheet; Aluminum foil; Slotted spoon; Cutting board; Two forks","cat":"pork"},{"slug":"Pastie","title":"Finnish Pasties","ing":["Crust: 3 cups flour","Crust: 1 cup lard or shortening","Crust: ½–1 teaspoon salt","Crust: 5–6 tablespoons water","Filling: 3 medium potatoes, sliced","Filling: 2 carrots, sliced","Filling: ½ pound beef (ground or cubed)","Filling: ½ pound pork (ground or cubed)","Filling: 1 medium onion, diced","Filling: 4 pats butter","Filling: Salt and pepper to taste","Filling: ½ cup diced rutabagas (optional)"],"dir":["Combine crust ingredients into a rollable dough.","Divide into 4 equal portions; roll each into 10-inch circles.","Mix potatoes, carrots, beef, pork, and onion together.","Place 1½ cups filling on half of each dough circle, leaving a 1-inch edge; top with butter.","Fold and crimp edges; slit the top.","Bake at 375°F for 10 minutes, then 350°F for 50 minutes."],"attr":"Roz","desc":"The pastie originates from Cornwall and became popular among copper miners in upper Michigan a century ago. Miners would place pastries under their caps for warmth, and wives would crimp the ridge so dirty-handed miners could hold it without soiling the food itself.","prep":"15 minutes","total":"1 hour 30 minutes","serves":"4","diff":3,"cat":"pork"},{"slug":"Herbe","title":"Herbed Pork Chops","ing":["1 teaspoon rosemary","1/2 teaspoon sage","1/2 clove garlic, chopped","Fresh ground pepper to taste","Salt to taste","4 large pork chops (about 8 ounces each)","1/2 cup dry white wine"],"dir":["Mix all the spices together and coat the pork chops with this mixture.","Place the chops in a greased skillet with 1 cup water and cover.","Simmer until all the water has evaporated, about 45 minutes on low heat.","Uncover and brown the chops at low-medium temperature.","Add 1/2 cup dry white wine and cook for about 1 minute, turning the chops. Wine reduces nearly completely before serving."],"attr":"Marcia","prep":"5 minutes","cook":"1 hour","serves":"4","diff":2,"cat":"pork"},{"slug":"Katsu","title":"Katsudon","ing":["4 center-cut thin boneless pork chops, pounded to 1/2 inch thick","Salt and pepper","Flour","2 eggs (for breading)","2 cups panko","Oil for frying","1 cup dashi or chicken stock","4 teaspoons sugar","2 tablespoons soy sauce","4 teaspoons mirin","4 large eggs (for topping)","2 medium onions, thinly sliced","4 servings steamed white rice","2 scallions, chopped"],"dir":["Season pork with salt and pepper; dust lightly with flour.","Beat eggs in one bowl; place panko in another.","Heat oil in skillet until a breadcrumb sizzles.","Coat pork in egg, then press into panko.","Fry 5-6 minutes per side until golden brown.","Drain on paper towels.","Combine stock, sugar, soy sauce, and mirin.","Lightly beat eggs in a separate bowl.","Heat tablespoon of oil; fry onions until translucent and caramelized.","Pour stock mixture over onions.","Slice fried pork into 1/2-inch strips; place atop onions.","Drizzle beaten egg over everything; cook on medium-low until set.","Serve over rice; garnish with scallions."],"by":"Mary Hodge","attr":"Mary Hodge","desc":"Katsudon is basically katsu (a pork chop breaded with panko and fried) over rice with onion and egg.","prep":"20 minutes","cook":"25 minutes","total":"45 minutes","serves":"4","diff":2,"tools":"Cast iron pan or skillet","cat":"pork"},{"slug":"momofukus-bo-ssam","title":"Momofuku's Bo Ssam","ing":["Pork Butt: 1 whole bone-in pork butt (8-10 pounds)","Pork Butt: 1 cup white sugar","Pork Butt: 1 cup plus 1 tablespoon kosher salt","Pork Butt: 7 tablespoons brown sugar","Ginger-Scallion Sauce: 2½ cups thinly sliced scallions","Ginger-Scallion Sauce: ½ cup minced fresh ginger","Ginger-Scallion Sauce: ¼ cup neutral oil","Ginger-Scallion Sauce: 1½ teaspoons light soy sauce","Ginger-Scallion Sauce: 1 scant teaspoon sherry vinegar","Ginger-Scallion Sauce: ½ teaspoon kosher salt","Ssam Sauce: 2 tablespoons ssamjang","Ssam Sauce: 1 tablespoon kochujang","Ssam Sauce: ½ cup sherry vinegar","Ssam Sauce: ½ cup neutral oil","Accompaniments: 2 cups cooked white rice","Accompaniments: 3 heads bibb lettuce","Accompaniments: 1 dozen fresh oysters (optional)","Accompaniments: Kimchi"],"dir":["Combine sugar and salt; rub over pork in shallow tray. Cover with plastic wrap and refrigerate 6 hours or overnight.","Preheat oven to 300°F. Cover roasting pan twice with foil. Remove pork from refrigerator, discard juice, and leave rub intact.","Place pork fatty-side up in pan and roast approximately 6 hours until easily shredded with tongs and forks.","While cooking, combine scallions, ginger, oil, soy sauce, vinegar, and salt in a bowl for ginger-scallion sauce.","Mix chili pastes, vinegar, and oil together for ssam sauce.","Prepare rice, wash lettuce, shuck oysters if using, and place condiments in serving bowls.","Combine remaining salt, brown sugar, and vinegar; gently rub over cooked pork (mainly the top).","Increase oven to 500°F. Roast 5-10 minutes until dark caramel crust forms. Serve hot with accompaniments."],"by":"Marcia and Rick","attr":"Marcia and Rick","desc":"A Korean-inspired slow-roasted pork shoulder dish featuring tender meat wrapped in lettuce with rice and multiple condiments. Simply cure the pork overnight beneath a shower of salt and some sugar, then roast it in a low oven until it collapses.","prep":"30 minutes","cook":"Approximately 6.5 hours","total":"7 hours (approximately)","serves":"6-10","diff":2,"cat":"pork"},{"slug":"PCaPD","title":"Pork Chop and Potato Dinner","ing":["4 cups sliced potatoes","1 can cream of celery soup","⅔ cup evaporated milk","2 tablespoons finely chopped onion","½ teaspoon salt and pepper","4 pork chops, trimmed of fat"],"dir":["Heat oven to 375°F.","Spread potatoes in a greased 2-quart baking dish.","Combine soup, milk, onion, salt, and pepper; pour over potatoes.","Brown pork chops in skillet over high heat.","Arrange browned chops atop potato mixture.","Cover and bake at 375°F for 1–1½ hours until potatoes soften."],"by":"Family Cookbook","attr":"Marcia","prep":"15 minutes","cook":"1–1½ hours","total":"1½ hours","serves":"4","diff":2,"tools":"9×12 baking dish","cat":"pork"},{"slug":"PMiBCS","title":"Pork Medallions in Blue Cheese Sauce","ing":["2 pounds pork tenderloin","2 tablespoons olive oil","2 tablespoons butter, divided","2 shallots, finely chopped","1/4 cup white wine","5 oz blue cheese, cubed","3/4 cup heavy cream","Salt","Freshly ground black pepper","1 teaspoon chopped fresh parsley"],"dir":["Trim tenderloin, cut into eight 2-inch medallions, flatten slightly, and season with salt and pepper.","Heat oil and 1 tablespoon butter in sauté pan over high heat. Sear half the pork until browned (2-3 minutes per side), transfer to plate, repeat with remaining meat.","Melt remaining butter, add shallots with salt, sauté briefly while scraping up browned bits.","Deglaze with wine until nearly evaporated, add cream and blue cheese, simmer 3 minutes until smooth and thickened."],"by":"Susan Hodge","attr":"Susan Hodge","desc":"A one-pan dinner featuring pork with blue cheese cream sauce, ready in half an hour and suitable for both casual weeknights and entertaining.","prep":"10 minutes","cook":"20 minutes","total":"30 minutes","serves":"4","diff":2,"tools":"Large sauté pan; Wooden spoon","cat":"pork"},{"slug":"PT-PR","title":"Pork Tenderloin/Pork Roast","ing":["4 Pound pork tenderloin","8 Ounces sauerkraut","1 Small bag baby carrots","McCormicks garlic, onion, black pepper & sea salt all purpose seasoning","1/3 Cup sliced onion","Water","Cranberry sauce","Garlic mashed potatoes"],"dir":["Season the pork with McCormicks seasoning and place in crockpot.","Around the pork, add sauerkraut, baby carrots, and chopped onion.","Add water to just cover the carrots.","Cook on low for at least 6 hours.","Serve with cranberry sauce and garlic mashed potatoes."],"by":"Marlene","attr":"Mom use to do the pork & sauerkraut","desc":"A wonderful crock pot meal with leftovers. Can be done with tenderloin or roast.","prep":"15 minutes","cook":"6 hours minimum","total":"Overnight","serves":"4-6","diff":3,"tools":"Crock pot","cat":"pork"},{"slug":"RosaSausage","title":"Rosa's Sausages","ing":["Italian sausages (20-24 count package)","Olive oil","Red wine (approximately 1/3 bottle)","1 bell pepper, coarsely chopped","1 onion, coarsely chopped","Buns"],"dir":["Preheat oven to 350°F.","Lightly coat sausages with olive oil and place in casserole dish; bake uncovered for 1 hour.","Turn sausages; bake 30 minutes.","Turn again; add wine, peppers, and onions; bake 15 minutes.","Turn once more; bake final 15 minutes.","Serve."],"by":"Marcia","attr":"My good golf buddy's Aunt Rosa","desc":"A versatile dish that fills the house with wonderful aromas. Prepare as an immediate meal, freeze for later use in spaghetti sauce, or cut into pieces for appetizers. The recipe typically uses a Costco package of 20-24 sausages.","prep":"5 minutes","cook":"2 hours 5 minutes","total":"2 hours 10 minutes","serves":"20-24","diff":1,"tools":"9\" x 13\" casserole dish","cat":"pork"},{"slug":"SCRaB","title":"Slow Cooker Rice and Beans","ing":["1 pound dried speckled butter beans (or small red beans)","1 onion, diced","4 celery stalks, chopped","7 ounces smoked boneless pork chops, diced","12 ounces andouille sausage, sliced","1 teaspoon salt","½ teaspoon cayenne or chili pepper","½ teaspoon dried thyme","2 bay leaves","6 garlic cloves, minced","White rice (4 cups prepared)","Water (7-8 cups)"],"dir":["Combine all ingredients in slow cooker with water covering everything plus 1 inch.","Cook 10 hours on high or 12 hours on low.","Prepare rice separately during cooking.","Remove bay leaves; serve bean mixture over rice."],"by":"Rick","attr":"Rick","desc":"The best food with the least effort :) Kinda like a West African 'soup', but Cajun and without the okra.","prep":"20 minutes","cook":"10 hours on high; 12 hours on low","serves":"6","diff":3,"tools":"Slow cooker","cat":"pork"},{"slug":"SousVid","title":"Sous Vide Pork Carnitas","ing":["4 lb boneless pork shoulder (Boston Butt), cut into 2\" slabs","1 medium onion, chopped roughly","2 bay leaves","1 cinnamon stick, broken into 3-4 pieces","6 garlic cloves","1 medium orange, peel intact","Sea salt to taste","Warm tortillas, lime wedges, white onion, fresh cilantro, salsa verde (for serving)"],"dir":["Heat sous vide to 185°F.","Combine pork, onion, bay leaves, cinnamon, garlic, and orange juice in a bowl; place in sealed bag with air removed.","Cook in sous vide bath for 8 hours.","Start broiler; shred pork and spread on baking sheet; broil 5-10 minutes until slightly crispy.","Serve as tacos with traditional toppings.","Store cooled carnitas refrigerated up to 5 days or frozen up to one month; broil before serving."],"by":"Rick","attr":"Marcia","desc":"Great sous vide recipe","prep":"10 minutes","cook":"8 hours sous vide + 5-10 minutes broiling","total":"8 hours 5-20 minutes","serves":"8-12","diff":3,"tools":"Sous vide with water bath; Freezer bag or vacuum sealer; Broiler; Baking sheet","cat":"pork"},{"slug":"Sweeeee","title":"Sweet \"N\" Sour Pork","ing":["1 (20 oz) can pineapple chunks in juice","3 tablespoons cornstarch","1/2 cup Karo syrup","1/4 cup cider vinegar","3 tablespoons soy sauce","2 tablespoons ketchup","4 tablespoons cooking oil","1 green pepper, cut into 1-inch squares","1 onion, cut into thin wedges","1 clove garlic, minced","3 butterfly pork chops, cut into 3/4-inch squares"],"dir":["Drain pineapple and reserve juice.","Mix juice, cornstarch, syrup, vinegar, soy sauce, and ketchup.","Heat oil in wok; stir-fry pepper, onion, and garlic for 2 minutes.","Remove vegetables; cook pork in three batches for 3 minutes each.","Leave 1 tablespoon oil in wok.","Recombine pork, sauce mixture, pineapple, and vegetables.","Bring to boil, stirring constantly, for 1 minute until thickened."],"attr":"Mary Horn","desc":"A delicious recipe for sweet n sour pork that is best served with fried rice","prep":"15 minutes","cook":"20 minutes","total":"35 minutes","serves":"4","diff":3,"tools":"Wok","cat":"pork"},{"slug":"BacWrap","title":"Sweet Potato Bacon Wrap","ing":["1 ripe avocado","2 tablespoons white wine, white, or apple cider vinegar","2 teaspoons minced fresh dill or cilantro","1 teaspoon salt (divided)","1 teaspoon pepper (divided)","8 bacon slices","1 pound sweet potato, cut into ½-inch pieces","4 flour tortillas (10-12 inches)","2 cups baby arugula, spinach, or kale"],"dir":["Mash together avocado, vinegar, herbs, and half the salt and pepper.","Cook bacon until crispy; drain on paper towels.","Render bacon fat in skillet; cook seasoned sweet potatoes until tender, about 8 minutes.","Assemble wraps by layering bacon, greens, avocado mixture, and potatoes; fold and roll.","Refrigerate up to 24 hours if desired."],"by":"Marcia","attr":"America's Test Kitchen","desc":"A pork-based wrap featuring crispy bacon, roasted sweet potatoes, and creamy avocado spread","prep":"15 minutes","cook":"45 minutes","total":"1 hour","serves":"4","diff":1,"cat":"pork"}]},{"slug":"poultry","name":"Poultry","recipes":[{"slug":"air-fryer-chicken-parmesan","title":"Air-Fryer Chicken Parmesan","ing":["3/4 cup Panko bread crumbs","2 tablespoons olive oil","1/4 cup grated Parmesan cheese","1 large egg","1 tablespoon all-purpose flour","3/4 teaspoon garlic powder","1/2 teaspoon dried oregano","Salt and pepper (1/8 teaspoon each for coating, plus extra for chicken)","2 (8 oz) boneless, skinless chicken breasts, trimmed","2 oz whole milk mozzarella cheese, shredded (about 1/2 cup)","1/4 cup jarred marinara sauce, warmed","2 tablespoons fresh basil, chopped"],"dir":["Toss panko with oil in a bowl until evenly coated. Microwave, stirring frequently, until light golden brown (1-3 minutes).","Transfer to shallow dish, cool slightly, then stir in Parmesan.","In a second shallow bowl, whisk egg, flour, garlic powder, oregano, salt, and pepper together.","Pound chicken to uniform thickness and pat dry. Season with salt and pepper.","Dredge each breast in egg mixture, then coat with panko mixture, pressing gently.","Lightly spray air-fryer basket with vegetable oil. Arrange breasts evenly, alternating ends.","Set temperature to 400°F. Cook until crispy and internal temperature reaches 165°F (12-16 minutes), flipping halfway through.","Sprinkle mozzarella on breasts. Return to air-fryer and cook until cheese melts (about 1 minute at 400°F).","Transfer to plates. Top each with 2 tablespoons warm marinara and basil."],"by":"Marcia","attr":"America's Test Kitchen","desc":"The air fryer makes this classic delightfully tasty and crispy. It pairs nicely with angel hair pasta and marinara sauce.","prep":"30 minutes","cook":"20 minutes","total":"50 minutes","serves":"2","diff":2,"tools":"Air fryer","cat":"poultry"},{"slug":"air-fryer-buffalo-wings","title":"Air-Fryer Buffalo Wings","ing":["Fresh chicken wings","Olive oil","Kosher salt","Buffalo sauce (Texas Pete Extra Mild recommended)"],"dir":["Season wings with olive oil and kosher salt, then refrigerate while preheating the air fryer. Prepare wings in batches of 14 or fewer.","Position the air fry basket in rack position 3. Insert wire rack at position 7 with a roasting pan underneath to catch drippings. Preheat to 375°F using the AirFry setting.","Spray the basket with olive oil cooking spray. Add wings and air fry at 375°F for 15 minutes. Flip and continue for 10 minutes, then broil on high for 4 minutes to crisp.","Cool wings, transfer to a gallon-sized zip-top bag, and coat with your preferred buffalo sauce."],"by":"Mary and Leon","attr":"Breville Website","desc":"The recipe makes this super tasty and crispy wings.","prep":"20 minutes","cook":"29 minutes","total":"50 minutes","serves":"5","diff":2,"tools":"Air fryer","cat":"poultry"},{"slug":"air-fryer-mardi-gras-wings","title":"Air-Fryer Mardi Gras Wings","ing":["5 lbs chicken wings","2 tablespoons dried rosemary","2 tablespoons chili powder","1 tablespoon kosher salt","1 tablespoon garlic powder","1 tablespoon dried ground oregano","1 tablespoon Tony's Creole seasoning","1½ teaspoons cumin","1 teaspoon dry yellow mustard","1 teaspoon black pepper"],"dir":["Apply the rub generously to wings (about 1 tablespoon per pound). Chill while preheating equipment. Prepare in batches of 14 wings maximum if necessary.","Position air fry basket at rack 3, wire rack at position 7, and roasting pan on rack beneath basket for drippings. Preheat to 375°F.","Oil basket with cooking spray. Add wings and air fry at 375°F for 15 minutes. Turn wings over, continue air frying for 10 minutes. Finish under broiler on high for 4 minutes until crispy."],"by":"Mary and Leon","attr":"Breville Website, et al","desc":"The Publix wings are a family favorite. The air fryer takes it to the next level!","prep":"20 minutes","cook":"29 minutes","total":"50 minutes","serves":"5","diff":2,"tools":"Air fryer","cat":"poultry"},{"slug":"baked-chicken-breast","title":"Baked Chicken Breast","ing":["8 (6 ounce) boneless chicken breasts","8 (2 ounce) slices Canadian bacon","1 (10 ounce) can cream of mushroom soup","1 (8 ounce) carton sour cream","1 (4.5 ounce) packet Shake & Bake or 1 cup seasoned breadcrumbs","Salt & pepper to taste"],"dir":["Heat oven to 275°F.","Combine sour cream with mushroom soup.","Dry chicken breasts; season with salt and pepper.","Arrange Canadian bacon on greased baking sheet.","Top each bacon slice with a chicken breast and soup mixture.","Bake covered with foil for 2 hours.","Uncover; add Shake & Bake coating.","Bake uncovered 30 minutes.","Optional: verify doneness with meat thermometer."],"by":"Marilyn","attr":"Aunt Floy","desc":"A hearty baked chicken breast. Good served with Uncle Ben's Wild Rice Mix.","prep":"10 minutes","cook":"2 hours 20 minutes","total":"2.5 hours","serves":"8","diff":1,"tools":"Foil; Meat thermometer","cat":"poultry"},{"slug":"cajun-chicken-salad-with-mango-chili-dressing","title":"Cajun Chicken Salad with Mango Chili Dressing","ing":["Mango Chili Dressing: 1 medium mango, peeled and chopped (about 1 pound)","Mango Chili Dressing: 1 small fresh jalapeño","Mango Chili Dressing: 1/2 teaspoon grated lime zest","Mango Chili Dressing: 1/4 cup lime juice","Mango Chili Dressing: 1/2 teaspoon sugar","Chicken: 1 teaspoon cayenne pepper","Chicken: 1/2 teaspoon cumin seeds","Chicken: 1/2 teaspoon dried oregano leaves","Chicken: 1/2 teaspoon dried thyme leaves","Chicken: 1 teaspoon garlic salt","Chicken: 1 pound skinless chicken breast filets","Chicken: Cooking oil spray or olive oil","Salad: 1/2 pound mixed salad greens","Salad: 2 medium tomatoes, sliced"],"dir":["Blend mango, jalapeño, lime zest, juice, and sugar until smooth. Set aside or chill.","Heat griddle to medium-high. Combine spices in a shallow bowl and coat chicken.","Spray pan with cooking oil, add chicken, and cook turning occasionally until browned and internal temperature reaches 165°F.","Cool and slice diagonally.","Arrange greens in bowls, top with tomatoes and chicken, drizzle with dressing."],"by":"Marcia","attr":"My friend Britt-Marie Cardemo","desc":"A refreshing summer dish where heat levels can be customized via cayenne pepper in the chicken and jalapeño choice in the dressing. Preparation can be completed hours ahead and refrigerated.","prep":"15 minutes","cook":"15 minutes","total":"30 minutes","serves":"4","diff":2,"tools":"Food processor or immersion blender; Griddle pan or skillet","cat":"poultry"},{"slug":"chicken-cashew","title":"Chicken Cashew","ing":["3 chicken breasts (skinned, boned, bite-sized pieces)","2/3 bell pepper, chopped","1 carrot, grated","1 onion (rings, 3/4\" pieces)","1 garlic clove","1/2 cup crushed cashews","1/2 can water chestnuts (10 oz)","1/2 can bamboo shoots (10 oz)","Glaze: 2 tsp soy sauce","Glaze: 2 tsp cornstarch","Glaze: 2 tsp sherry","Glaze: 2 tsp water","Glaze: White pepper","Glaze: 1.5 tsp vegetable oil","Cooking Sauce: 2/3 cup water","Cooking Sauce: 2 tbsp dry sherry","Cooking Sauce: 3 tbsp soy sauce","Cooking Sauce: 1/2 tsp sugar","Cooking Sauce: 1 tbsp vegetable oil","Cooking Sauce: 1 tbsp cornstarch"],"dir":["Combine glaze ingredients; coat chicken and oil; rest 15 minutes.","Prepare cooking sauce in separate bowl.","Heat wok on high with 3 tbsp oil; add garlic, stir once.","Stir-fry chicken until opaque (3 minutes); remove, retain oil.","Stir-fry vegetables 2-3 minutes; return chicken and cashews; add cooking sauce; cook until thickened."],"by":"Marcia","attr":"Gram","desc":"Asian-inspired stir-fry dish combining tender chicken with cashews and vegetables","prep":"20 minutes","cook":"20 minutes","total":"40 minutes","serves":"4","diff":2,"tools":"Wok","cat":"poultry"},{"slug":"chicken-curry","title":"Chicken Curry","ing":["1 bag frozen peas, uncooked","4 chicken breasts, boiled and cut into bite sized pieces","1 can Cream of Chicken soup","1 cup mayonnaise","2 tablespoons curry powder (more if you like)","4 ounces cheddar cheese, shredded","1/2 stick butter","4 cups cornflakes (breadcrumbs or crushed potato chips work too)"],"dir":["Heat oven to 350°F.","Layer frozen peas in a 9x13 inch baking pan, then add chicken pieces.","Mix soup, mayonnaise, and curry powder; spread over chicken and top with cheese.","Melt butter, toss with cornflakes until coated, spread over cheese layer.","Bake uncovered approximately 30 minutes until flakes brown; rest 5-10 minutes before serving."],"by":"Marcia & Rick","attr":"Marcia","desc":"Another recipe from our past. Made it all the time. Good, easy, tasty … who could ask for more?","prep":"15 minutes","cook":"30 minutes","total":"45 minutes","serves":"4","diff":2,"cat":"poultry"},{"slug":"chicken-in-mango-chutney","title":"Chicken in Mango Chutney","ing":["12 oz boneless, skinless chicken breast or thighs (1-inch pieces)","1/2 cup thinly sliced red onion","1 cup canned mango or peaches (drained, sliced)","2 tbsp golden raisins","2 tbsp apple cider vinegar","1 tsp minced fresh ginger","1/4 tsp red pepper flakes","1 tsp curry powder","1/4 tsp ground cinnamon","1/8 tsp sea salt"],"dir":["Combine all ingredients in slow cooker. Cook on low 6-8 hours until the sauce thickens and chicken reaches 165°F internal temperature."],"by":"Marcia","attr":"Erny St Johns","desc":"A slow-cooker dish featuring poultry in a sweet and tangy fruit-based sauce. The recipe specifies using canned mango rather than fresh, as the enzymes in the raw fruit will break down the proteins in the chicken.","prep":"10 minutes","cook":"6 to 8 hours","total":"6 to 8 hours","serves":"4 servings of 4-6 ounces each","diff":1,"tools":"Slow cooker","cat":"poultry"},{"slug":"chicken-pie","title":"Chicken Pie","ing":["1 rotisserie chicken, butchered","1 cup chicken broth","1 (16 ounce) can cream of mushroom or cream of chicken soup","1 stick butter","1 cup flour","1 cup milk"],"dir":["Preheat oven to 425°F.","Grease casserole dish.","Add butchered chicken to casserole.","Mix soup and broth separately, then pour over chicken.","Melt butter and combine with flour and milk.","Pour butter mixture over chicken.","Bake for 30 minutes."],"by":"Marilyn","attr":"Marilyn","desc":"A good use for a rotisserie chicken. Can be made with veggies (carrots, peas, etc.). If you do so add more chicken broth.","prep":"20 minutes","cook":"20 minutes","total":"40 minutes","serves":"4","diff":1,"tools":"2 qt. casserole","cat":"poultry"},{"slug":"chicken-pot-pie-with-biscuit-topping","title":"Chicken Pot Pie with Biscuit Topping","ing":["3/4 pound chicken breast strips/slices","3 tablespoons butter (divided)","5 Pillsbury Homestyle biscuits","2 tablespoons olive or vegetable oil (divided)","Salt & pepper to taste","2 stalks celery, diced","2 large or 4 small carrots, peeled & diced","1 small yellow onion, diced","1 clove garlic, minced","Fresh thyme, handful, stalks removed & diced (divided)","2 tablespoons all-purpose flour","1 cup chicken stock","2 tablespoons cream cheese"],"dir":["Preheat oven to 425°F.","Pat chicken dry with paper towels.","Melt 1 tablespoon butter; halve biscuits (10 pieces total); set aside.","Heat 1 tablespoon oil; brown chicken with salt and pepper (3-5 minutes); remove.","Add remaining oil; cook celery, carrots, and onion until softened (5-7 minutes).","Add garlic and half the thyme; cook 30 seconds.","Add 2 tablespoons butter; stir until melted.","Add flour; cook 1 minute stirring.","Add stock, salt, and pepper; simmer until thickened (3-5 minutes).","Turn off heat; stir in cream cheese.","Add chicken; top with biscuit halves; brush with melted butter and remaining thyme.","Bake uncovered until golden (15-20 minutes)."],"by":"Rich","attr":"Hello Fresh","desc":"An easy to prepare version of the comfort-food classic.","prep":"15 minutes","cook":"45-60 minutes","total":"60-75 minutes","serves":"4","diff":2,"tools":"Ovenproof pan/skillet","cat":"poultry"},{"slug":"chicken-salad","title":"Chicken Salad","ing":["1 can chunk chicken","1 stalk celery, diced","1 large serving spoon sweet pickle relish","1 large serving spoon Miracle Whip","1 teaspoon sugar","Salt and pepper to taste"],"dir":["Combine all components thoroughly and chill. The preparation requires minimal effort and minimal cooking time, leaving you free for other summer activities."],"by":"Leon and Mary Brock","attr":"Lydia Barineau","desc":"Quick & easy light summer dish.","prep":"5 minutes","total":"5 minutes","serves":"4","diff":1,"cat":"poultry"},{"slug":"chicken-saltimbocca","title":"Chicken Saltimbocca","ing":["4 boneless, skinless chicken breast halves (about 6 oz each), pounded thin","Kosher salt and pepper","1/3 cup all-purpose flour","2 tablespoons butter","1 tablespoon extra virgin olive oil","2 teaspoons fresh sage (chopped) or 1 teaspoon dried","2 large prosciutto slices, halved","1/4 pound fresh mozzarella, thinly sliced","3/4 cup dry white wine"],"dir":["Season and flour chicken breasts, shaking off excess.","Heat butter and oil in large pan over medium-high; cook chicken until golden (5-6 min per side).","Reduce heat to low; add sage, prosciutto, and cheese; cover until cheese melts (1½ min).","Transfer to platter; increase heat and deglaze pan with wine, reducing to ¼ cup (3 min).","Whisk in remaining butter; spoon sauce over each breast and serve."],"by":"Leon and Mary Brock","desc":"A lighter interpretation of the Italian classic, this dish reimagines traditional veal saltimbocca using poultry instead. The combination of prosciutto, sage, and mozzarella creates an elegant preparation that honors the original meaning of the dish's name.","prep":"15 minutes","cook":"30 minutes","total":"45 minutes","serves":"4","diff":2,"tools":"Large sauté pan with lid; Tongs; Serving platter","cat":"poultry"},{"slug":"crispy-duck","title":"Crispy Duck","ing":["2½ pound duck (frozen acceptable if thawed in refrigerator)","Salt (generous)","Five spice (generous)","Fresh ginger, grated (generous)","1 bunch spring onions","½ cucumber","Plum sauce (1 jar)","Wonton wrappers (1 package)"],"dir":["Preheat oven to 325°F.","Rub duck inside and outside with salt and grated ginger; dust exterior with five spice.","Mount duck on roasting stand in roasting pan with water at bottom; place in oven.","After approximately two hours, check doneness when leg meat pulls easily from bone and skin is crispy (internal temperature 180–185°F). Increase heat to 400°F briefly if additional crisping needed.","While cooking, julienne spring onions and cucumber.","Rest bird 5–10 minutes; steam wonton wrappers during this time.","Shred all meat and crispy skin using two forks.","Assemble by layering duck, skin, spring onion, cucumber, and plum sauce onto wonton wrappers; roll and serve."],"by":"Rick","attr":"Richard","desc":"Dinner of choice for the London crowd that has proven reliable over time. The recipe works equally well as an appetizer or main course depending on portion sizes.","prep":"15 minutes","cook":"2–3 hours","total":"2½–3 hours","serves":"2–3 (entree portions)","diff":2,"tools":"Vertical chicken roasting stand; Steamer; Meat thermometer","cat":"poultry"},{"slug":"egg-salad-hannah","title":"Egg Salad (Hannah)","ing":["4 eggs","2 medium avocados","1/4 cup mayonnaise","2 tablespoons yellow mustard","2 teaspoons Trader Joe's Everything but the Elote seasoning","Salt and pepper to taste"],"dir":["Prepare ice bath for cooked eggs.","Hard boil eggs using 90/10 water-to-vinegar ratio (or plain water) for about 10 minutes.","Transfer to ice bath for 10 minutes.","Peel eggs and place in mixing bowl.","Peel, dice, and add avocados.","Add mayonnaise, mustard, and seasonings.","Use pastry blender to combine ingredients to desired texture.","Rest 30 minutes before serving.","Store in airtight container."],"by":"Hannah","attr":"Hannah","desc":"A gestational diabetes-friendly recipe combining eggs and avocados. The creator serves it on low-carb wraps with turkey bacon and pepper-jack cheese.","prep":"15 minutes","cook":"10 minutes","total":"30 minutes","serves":"4","diff":1,"tools":"Egg cooker or boiling pot; Pastry blender","cat":"poultry"},{"slug":"egg-salad-marcia","title":"Egg Salad (Marcia)","ing":["6 large eggs","1/4 cup mayonnaise","2 tablespoons minced red onion","1 tablespoon minced fresh parsley leaves","1/2 stalk celery, chopped fine (about 3 tablespoons)","2 teaspoons Dijon mustard","2 teaspoons lemon juice","1/4 teaspoon salt","Pepper, to taste"],"dir":["Prepare an ice bath for the cooked eggs.","Hard boil eggs in water for about 10 minutes.","Transfer immediately to ice bath for 5 minutes.","Peel and dice the cooled eggs.","Combine diced eggs with remaining ingredients in a bowl and mix thoroughly.","Cover and refrigerate until ready to serve."],"by":"Marcia","attr":"America's Test Kitchen","desc":"There are so many variations (including Hannah's) but this has been a favorite for a long time.","prep":"15 minutes","total":"30 minutes","serves":"4 servings, 5-6 ounces each","diff":1,"cat":"poultry"},{"slug":"french-chicken","title":"French Chicken","ing":["6 chicken breasts (boned and skinless)","2/3 stick butter","1 onion","1/4 cup sherry","1/2 cup half and half cream","1 (4 ounce) can mushrooms, drained","1 (16 ounce) can mushroom soup","Paprika to taste"],"dir":["Brown chicken in 1/3 stick butter over medium heat.","Add onion strips, mushrooms, and remaining butter to the pan.","Mix thoroughly.","Stir in sherry, cream, and mushroom soup; season with paprika.","Simmer 30 minutes until cooked through."],"by":"Marilyn","attr":"Marlene","desc":"Best served with wild rice.","prep":"20 minutes","cook":"20 minutes","total":"40 minutes","serves":"6","diff":1,"cat":"poultry"},{"slug":"fried-turkey","title":"Fried Turkey","ing":["Turkey or turkey breast","Kosher salt (generous amount)","Coarse ground black pepper (generous amount)","Zatarain's Cajun Injector Injectable Marinade Creole butter","20 quarts peanut oil"],"dir":["Determine correct oil volume by submerging turkey in water to establish fill line.","Thaw turkey completely; pat dry inside and out; season with salt and pepper.","Inject marinade using 6 injection points, moving needle through different directions per hole.","Let turkey rest at room temperature for 30 minutes.","Heat peanut oil to 325°F on propane burner.","Slowly lower turkey into oil over approximately 30 seconds.","Maintain oil temperature at 275-300°F; cook 3-5 minutes per pound.","Check internal breast temperature (target: 160°F).","Remove turkey slowly; drain excess oil; transfer to paper towel-lined pan.","Rest 15 minutes before carving."],"by":"Susan Hodge","attr":"Daddy Brock","desc":"Deep Fried Turkey is always on our Thanksgiving menu! Crispy on the outside, juicy on the inside and oh so delicious!","prep":"45 minutes (including 30 minutes to marinate)","cook":"3-5 minutes per pound","total":"2 hours for a 12-pound turkey; longer for larger birds","serves":"12","diff":2,"tools":"Propane burner; Large 30-quart pot with turkey lowering attachments and basket; Fire extinguisher; Heat-resistant gloves; Oil thermometer; Meat thermometer","cat":"poultry"},{"slug":"garlic-chicken","title":"Garlic Chicken","ing":["4 boneless, skinless chicken breasts","1 tablespoon each salt, pepper, paprika (combined for rub)","1 whole head garlic","5 tablespoons olive oil","2 tablespoons brandy","3½ ounces dry sherry (Montilla)","1 bay leaf"],"dir":["Season chicken breasts with the salt, pepper, and paprika mixture; rest 15 minutes.","Peel and coarsely chop the garlic head.","Heat oil in a large frying pan over medium-high heat.","Sauté garlic until golden and crisp; remove and reserve.","Brown chicken breasts on both sides in the same pan.","Remove from heat; add brandy, sherry, bay leaf, and half the reserved garlic.","Cover and simmer on reduced heat approximately 25 minutes until chicken is tender.","Serve topped with remaining sautéed garlic."],"by":"Marcia & Rick","attr":"Marcia","desc":"Easy, tasty, healthy. Keeps the vampires away. Works!","prep":"15 minutes","cook":"25 minutes","total":"45-50 minutes","serves":"4","diff":2,"cat":"poultry"},{"slug":"greek-chicken-souvlaki","title":"Greek Chicken Souvlaki","ing":["1 lb boneless, skinless chicken breasts, cut into bite-sized pieces (24-32 pieces)","2 tablespoons olive oil","1 tablespoon white wine vinegar","4 large minced garlic cloves","3 tablespoons Greek seasoning","3 tablespoons lemon juice","½ teaspoon salt","½ teaspoon pepper"],"dir":["Combine all ingredients in a ziploc bag and shake thoroughly to distribute flavors evenly.","Refrigerate overnight minimum (at least 6 hours); discard marinade before cooking.","Thread chicken pieces onto skewers.","Grill over medium-high heat, turning occasionally, until cooked through (165°F internal temperature), approximately 15 minutes."],"by":"Leon and Mary Brock","attr":"Zorba","desc":"A traditional Greek preparation featuring marinated chicken pieces threaded onto skewers. The dish works as either a standalone entrée or served over rice accompanied by grilled Mediterranean vegetables.","prep":"6.5–24.5 hours (includes marinating)","cook":"15 minutes","serves":"4","diff":2,"tools":"1-gallon ziploc bag; 4–6 skewers; Grill or grilling pan","cat":"poultry"},{"slug":"honeylime-chicken","title":"Honey/Lime Chicken","ing":["1 pound chicken breasts (4 small-medium breasts)","6 limes or equivalent juice (about 6 ounces or 12 tablespoons)","4-6 tablespoons honey","Salt & pepper to taste"],"dir":["Pound chicken until thin (less than ½ inch).","Season both sides with salt and pepper.","Combine chicken, honey, and lime juice in zip lock bag with sufficient liquid to cover. Optional: add lime pulp pieces for extra flavor. Marinate minimum 6 hours, stirring periodically.","Heat grill pan or grill to medium-high temperature.","Grill approximately 5 minutes per side until internal temperature reaches 165°F. Light charring enhances lime-honey flavors."],"by":"Rich","attr":"Hannah","desc":"A straightforward yet delicious stovetop or grill preparation for chicken.","prep":"15 minutes plus 6 hours to marinate","cook":"Approximately 10 minutes","total":"6 1/2 hours","serves":"4 servings of 4 ounces each","diff":2,"tools":"1 gallon zip lock bag","cat":"poultry"},{"slug":"hot-chicken-salad","title":"Hot Chicken Salad","ing":["2 cups cooked, diced chicken","2 cups diced celery","1/2 cup chopped almonds","1/2 teaspoon salt","2 tablespoons grated onion","2 tablespoons lemon juice","1 cup mayonnaise","1/2 cup grated cheddar cheese","1 cup crushed potato chips"],"dir":["Heat oven to 350°F.","Combine all ingredients except cheese and chips in a baking dish.","Top with cheese and chips.","Bake uncovered 15-20 minutes until heated through."],"by":"Susan Hodge","attr":"Susan Hodge","desc":"This is a wonderful dish for lunch or a potluck. It will be asked for again and again","prep":"5 minutes","cook":"15-20 minutes","total":"25 minutes","serves":"4-6","diff":2,"cat":"poultry"},{"slug":"italian-baked-chicken","title":"Italian Baked Chicken","ing":["4 small-medium boneless, skinless chicken breasts","1/2 cup Wishbone Dressing","Salt & pepper, to taste","2 tablespoons paprika (divided)","4 ounces sliced mushrooms (fresh or canned)","1/2 cup Romano cheese, grated"],"dir":["Preheat oven to 350°F.","Arrange chicken breasts in baking pan and coat with dressing. Season with salt, pepper, and half the paprika. Cover and bake 30 minutes.","Flip chicken, top with mushrooms and cheese, sprinkle remaining paprika. Return to oven: bake 15 minutes covered, then 15 minutes uncovered (or longer if internal temperature remains below 165°F)."],"by":"Marcia & Rick","attr":"Marlene","desc":"A straightforward weeknight dish that was central to the family's early dining years. The recipe prioritizes convenience and flavor while maintaining nutritional value.","prep":"5 minutes","cook":"60 minutes","total":"65 minutes","serves":"4","diff":2,"cat":"poultry"},{"slug":"lemon-chicken-pasta","title":"Lemon Chicken Pasta","ing":["8 oz penne pasta, uncooked","1/4 cup all-purpose flour","1 teaspoon seasoned salt","1 pound boneless chicken tenders, cut into bite-sized pieces","1/4 cup garlic butter","2 tablespoons capers","2 teaspoons chicken base","3 tablespoons lemon juice","1/2 cup white wine","1/4 cup heavy whipping cream"],"dir":["Cook penne according to package instructions.","Combine flour and seasoned salt in ziploc bag; coat chicken pieces.","Sauté chicken in garlic butter 2-5 minutes until cooked through.","Add capers and chicken base, cook 2 minutes; then add lemon juice, wine, and cream; simmer 3-4 minutes.","Combine sauce with drained pasta."],"by":"Leon and Mary Brock & Susan and Tom Hodge","attr":"Marilyn","desc":"A classic lemon-forward chicken dish celebrated at beach gatherings. The recipe delivers impressive results in just half an hour, combining simple ingredients for an elegant pasta preparation.","prep":"10 minutes","cook":"20 minutes","total":"30 minutes","serves":"6","diff":2,"tools":"Gallon ziploc bag; Large pasta pot; Colander","cat":"poultry"},{"slug":"lemon-pepper-chicken","title":"Lemon Pepper Chicken","ing":["2 1/2 pounds boneless, skinless chicken breasts cut in half","1/2 cup room temperature lemon juice","1/2 cup melted butter","3 tablespoons lemon pepper (divided)","2 tablespoons seasoned salt (divided)","1 1/2 cups all-purpose flour","1/2 cup butter"],"dir":["Heat oven to 400°F.","Combine lemon juice, melted butter, 1 tablespoon lemon pepper, and 1 tablespoon seasoned salt in first bag with chicken; marinate 10 minutes.","Mix flour, remaining lemon pepper, and remaining seasoned salt in second bag.","Coat marinated chicken pieces in flour mixture.","Brown chicken in skillet over medium-high heat (approximately one minute per side).","Transfer to cookie sheet and bake 10-15 minutes until internal temperature reaches 165°F."],"by":"Leon and Mary Brock","attr":"Mary Brock","desc":"Leon's favorite!","prep":"30 minutes","cook":"10-15 minutes (oven)","total":"60 minutes","serves":"4","diff":2,"tools":"2 one-gallon ziploc bags; Skillet; Rimmed cookie sheet; Tongs","cat":"poultry"},{"slug":"marinated-chicken","title":"Marinated Chicken","ing":["1 teaspoon dill weed","1 teaspoon pepper","1 cup water","2/3 cup lemon juice","4 tablespoons parsley","2 boneless chicken breasts"],"dir":["Combine all ingredients except chicken in a bowl. Divide the mixture in half—one portion goes in a zip-top bag, the other is reserved for basting.","Place chicken in the bag with marinade and refrigerate for one hour.","Begin preheating the oven to 350°F about 15 minutes before marinating completes.","Transfer chicken to a baking dish; set aside the reserved marinade.","Bake for 45 minutes, basting periodically with the reserved marinade."],"by":"Marcia","attr":"Marcia","desc":"An oven-baked chicken dish prepared with a lemon and herb marinade that can soak for an hour or longer to develop deeper flavors.","prep":"5 minutes","cook":"45 minutes","total":"110 minutes","serves":"2","diff":1,"cat":"poultry"},{"slug":"moo-goo-gai-pan","title":"Moo Goo Gai Pan","ing":["5 teaspoons cornstarch","1 teaspoon rice wine","1/4 teaspoon white pepper","1 quart chicken broth","1 chicken breast, thinly sliced","3/4 cup celery cabbage (Napa cabbage)","1 pound button mushrooms","1 cup vegetable or peanut oil","1/3 cup bamboo shoots, thinly sliced","1/2 teaspoon sugar","1/4 teaspoon MSG or 1/2 teaspoon dark soy sauce","Water and salt to taste"],"dir":["Combine 1 teaspoon cornstarch, 1 teaspoon water, rice wine, white pepper, and salt; coat chicken and set aside.","Chop cabbage into 3/4-inch slices.","Remove mushroom stems and roughly chop.","Simmer mushrooms in chicken broth for five minutes; drain and set aside.","Heat oil in wok; cook chicken until no longer pink (15-30 seconds).","Drain chicken through colander; return 2 tablespoons oil to wok.","Cook mushrooms, bamboo shoots, and cabbage for 2 minutes, stirring frequently.","Add 1 cup chicken broth and bring to boil.","Stir in sugar, MSG/soy sauce, 4 teaspoons cornstarch, and 2 tablespoons water until thickened.","Add chicken; mix thoroughly until hot."],"by":"Marcia & Rick","attr":"Marcia & Rick","desc":"Yummy rendition of a Chinese-American favorite. Goes well with rice or cooked noodles.","prep":"15 minutes","cook":"10 minutes","total":"25 minutes","serves":"4","diff":3,"tools":"Wok; Colander","cat":"poultry"},{"slug":"pasta-with-chicken-and-broccoli","title":"Pasta with Chicken and Broccoli","ing":["1/2 pound bow tie pasta","1/4 cup olive oil","2 cloves garlic, chopped","1/2 - 1 pound boneless, skinless chicken breasts, cut into 1/2-inch strips","1 1/2 cups small broccoli florets","3/4 cup sun dried tomatoes, soaked, sliced thin, drained","1 teaspoon dried basil leaves","Crushed red pepper flakes (pinch)","Salt and pepper to taste","1/4 cup white wine","3/4 cup chicken broth","1 tablespoon butter","Parmesan cheese, grated (garnish)"],"dir":["Cook pasta according to package directions; drain and set aside.","Heat oil in a large skillet over medium-high heat.","Sauté garlic until golden.","Add chicken strips and cook until white and nearly done.","Add broccoli and cook until crisp-tender; stir in sun dried tomatoes, basil, pepper flakes, salt, and pepper.","Pour in wine, broth, and butter; simmer 3-5 minutes, stirring occasionally.","Toss with pasta and serve topped with parmesan cheese."],"by":"Marcia","attr":"Marcia","desc":"A simple poultry dish combining pasta, chicken, and broccoli in a wine and broth sauce.","prep":"5 minutes","cook":"30 minutes","total":"35 minutes","serves":"4","diff":1,"cat":"poultry"},{"slug":"parmesan-crumbed-chicken-wings","title":"Parmesan Crumbed Chicken Wings","ing":["1/2 cup freshly grated parmesan cheese","1/3 cup fine dry breadcrumbs","1 clove garlic, pressed","2 teaspoons grated lemon rind","1 1/2 teaspoons salt","1 teaspoon dried rosemary, crumbled","1 teaspoon freshly ground pepper","1/4 teaspoon cayenne pepper","7 tablespoons unsalted butter, melted","2 1/2 lbs drumsticks (patted dry) or boneless chicken strips"],"dir":["Mix parmesan, breadcrumbs, garlic, lemon rind, salt, rosemary, pepper, and cayenne in a shallow bowl.","Brush each piece with butter, coat thoroughly in the mixture, place on sheet pan, cover loosely, and refrigerate 1-24 hours.","Preheat oven to 425°F.","Arrange wings on buttered sheet pan, drizzle remaining butter, and bake uncovered 30-35 minutes until tender. Serve warm or at room temperature with dipping sauce."],"by":"Marcia","attr":"Bill & Roberta Foster","desc":"The way wings should be done. Great tailgate fare.","prep":"1-24 hours to set coating","cook":"30-35 minutes","total":"Add 45 minutes on gameday to cook","serves":"12 wings or 2 servings of 6 wings each; serves more as appetizers","diff":2,"tools":"Sheet pan","cat":"poultry"},{"slug":"roasted-chicken","title":"Roasted Chicken","ing":["4½ lb chicken (organic/free range preferred)","3 medium potatoes, cubed","4 medium carrots, cut into pieces","1 small onion, cut into pieces","1 tablespoon olive oil","Kosher salt and pepper","4 garlic cloves","2 lemons, quartered","Fresh thyme sprigs"],"dir":["Preheat oven to 425°F. Rinse and pat chicken dry, season inside and out.","Stuff cavity with half the garlic, lemon, and thyme; tie legs.","Place chicken breast-up in pan surrounded by vegetables and remaining aromatics.","Cover and cook 60-75 minutes, then uncovered 10-15 minutes until skin crisps and internal temperature reaches 165°F.","Rest 10 minutes before carving and serving."],"by":"Marcia","attr":"William Sonoma","desc":"A classic roasted bird with root vegetables. The recipe notes this is an old timey roast chicken with potatoes and carrots.","prep":"20 minutes","cook":"70-90 minutes","total":"120 minutes","serves":"4","diff":2,"tools":"4½ quart deep baking pan with lid or steam oven","cat":"poultry"},{"slug":"roast-turkey-breast","title":"Roast Turkey Breast","ing":["1/2 cup butter","Salt & pepper","3-7 pound turkey breast","Aluminum foil"],"dir":["Heat oven to 325 degrees.","Melt butter.","Season turkey breast thoroughly with salt and pepper.","Apply melted butter over the poultry and wrap tightly in foil.","Roast for the appropriate duration based on weight: 2.5-3 hours for birds under 5 pounds; 3-3.5 hours for larger birds.","Target internal temperature: 170 degrees Fahrenheit (optional thermometer use)."],"by":"Five Family Cookbook","attr":"Gram","desc":"A classic take on a baked turkey leg with an option to uncover the bird during the final 30 minutes for browning.","prep":"5 minutes","cook":"150-210 minutes (varies by weight)","total":"180 minutes (depending on size)","serves":"4","diff":1,"notes":"A meat thermometer is helpful but not essential for achieving proper doneness.","cat":"poultry"},{"slug":"soft-tacos-with-chicken-and-tomato-corn-salsa","title":"Soft Tacos with Chicken and Tomato-Corn Salsa","ing":["Poached Chicken: 1 boneless, skinless chicken breast","Poached Chicken: 1 carrot, chopped","Poached Chicken: 1 celery stalk, chopped","Poached Chicken: Small handful parsley","Poached Chicken: 1 bay leaf","Poached Chicken: Peppercorns","Poached Chicken: Salt (pinch)","Salsa: 1 ear of corn","Salsa: 1/2 small red onion, chopped","Salsa: 1 pound ripe tomatoes, finely chopped","Salsa: 1-3 jalapeño peppers, minced","Salsa: 1/2 cup fresh cilantro, chopped","Salsa: 2 tablespoons fresh lime juice","8 small corn tortillas","1/2 cup crumbled feta cheese"],"dir":["Simmer chicken with vegetables and seasonings for 15-18 minutes.","Steam corn, blanch onions, combine with tomatoes, jalapeños, cilantro, and lime juice for salsa.","Shred chicken, warm tortillas, assemble with salsa and feta."],"by":"Marcia","desc":"A nice summer Taco Tuesday alternative, particularly with fresh corn and tomatoes. Buen provecho!","prep":"15 minutes","cook":"45 minutes","total":"60 minutes","serves":"4 servings of 2 soft tacos each","diff":2,"tools":"Steamer; Tortilla warmer (optional)","cat":"poultry"},{"slug":"smoked-chicken","title":"Smoked Chicken","ing":["3 pound whole chicken","4 cups chicken broth","1 2 ounce package dried onion soup mix","2 cups Jack Daniels Poultry Rub or comparable","2 cups apple juice"],"dir":["Rinse and thoroughly dry the chicken. Marinate in broth and soup mix overnight in refrigerator.","Preheat smoker to 250°F.","Discard marinade after removing from refrigerator.","Coat chicken generously with rub.","Place chicken breast-up on meat rack in deep pan; add apple juice below rack.","Smoke for 3 hours until breast reaches 165°F internally.","Tent chicken for 15 minutes, then carve and serve."],"by":"Leon and Mary Brock","attr":"Leon","desc":"A classic from the smokemiester himself.","prep":"Overnight","cook":"3 hours","total":"Overnight plus 3 hours the next day","serves":"4","diff":2,"tools":"2 large, deep aluminum roasting pans; Smoker; Meat thermometer","cat":"poultry"},{"slug":"smoked-goat-cheese-chicken","title":"Smoked Goat Cheese Chicken","ing":["3½ lb whole chicken","3 oz fresh mild goat cheese","1 tbsp prepared pesto","8–10 basil leaves","Mop: 1 cup chicken stock","Mop: ½ cup white wine","Mop: 2 tbsp olive oil","Mop: ½ cup water","Mop: 1 tbsp prepared pesto"],"dir":["Night before: Remove chicken organs; massage bird inside and out with cheese and pesto, working mixture under skin. Insert basil leaves under skin evenly. Truss if desired. Refrigerate overnight.","Heat smoker to 200–220°F.","Remove chicken; let sit 30 minutes at room temperature.","Warm mop ingredients in saucepan over low heat.","Place chicken breast-down in smoker. Cook 3.5–4 hours, basting every 30 minutes. Turn breast-up halfway through. Internal temperature should reach 180–185°F.","Rest 5–10 minutes.","Remove skin, carve, and serve."],"by":"Leon and Mary Brock","attr":"Leon","desc":"A smoked poultry dish featuring Mediterranean-inspired flavors with goat cheese and basil, reflecting the recipe creator's culinary heritage.","prep":"Overnight","cook":"3.5–4 hours","total":"4 hours (plus overnight preparation)","serves":"3","diff":2,"tools":"Twine; Brine bag; Smoker; Meat thermometer; Mop","cat":"poultry"},{"slug":"smoked-turkey-breast","title":"Smoked Turkey Breast","ing":["1 turkey breast","8 cups chicken broth","3 medium white onions, diced","4 garlic cloves, crushed","1 cup packed dark brown sugar","2 cups Jack Daniel's Poultry Rub or comparable"],"dir":["Rinse and thoroughly dry the turkey breast.","Place turkey in roasting bag with broth, onions, garlic, and brown sugar. Seal and refrigerate overnight.","Heat smoker to 250°F.","Remove turkey from bag; discard marinade.","Coat turkey with rub.","Place on rack in aluminum pan in smoker for 5 hours until internal temperature reaches 165°F.","Remove from smoker, tent for 30 minutes, carve, and serve."],"by":"Leon and Mary Brock","attr":"Leon","desc":"Yet another classic from the smokemiester himself.","prep":"Overnight","cook":"5 hours the next day","total":"5 hours the next day","serves":"4","diff":2,"tools":"Large roasting bag; 2 large, deep aluminum roasting pans; Smoker; Meat thermometer","cat":"poultry"},{"slug":"turkey-burgers","title":"Turkey Burgers","ing":["16 ounces ground turkey","4 tablespoons scallions, minced","2 tablespoons soy sauce","2 tablespoons ketchup","1/2 teaspoon garlic powder","1/2 teaspoon ground pepper","4 ounces Monterey Jack cheese, cut into small cubes","Turkey bacon (optional, but encouraged)"],"dir":["Preheat grill to medium heat for 10 minutes.","Cook turkey bacon according to package instructions if using.","Combine turkey, scallions, soy sauce, ketchup, garlic powder, pepper, and cheese in a bowl; mix thoroughly.","Shape mixture into four quarter-pound patties.","Grill for 5 minutes, flip, then cook 5-6 additional minutes until internal temperature reaches 165°F; top with bacon and serve."],"by":"Susan Hodge","attr":"Susan Hodge","desc":"A lighter poultry option compared to traditional beef hamburgers, with optional turkey bacon for enhanced taste and suggested pairing with sweet potato fries.","prep":"15 min","cook":"10-11 min","total":"30 min","serves":"4 servings of 1 burger each","diff":1,"tools":"Outdoor grill","cat":"poultry"},{"slug":"yaki-soba","title":"Yaki Soba","ing":["1 onion, thinly sliced","2 handfuls shredded carrots","2 handfuls fresh bean sprouts","1 green pepper, thinly sliced","8 ounces cooked diced chicken breast","4 ounces cooked diced shrimp","2 inches fresh ginger, minced","4 tablespoons soy sauce","1 teaspoon salt","4 teaspoons mirin","4 teaspoons sesame seed oil","400 grams (16 ounces) soba noodles","Pickled ginger for garnish","Sesame seeds for garnish","Sliced spring onion for garnish"],"dir":["Combine onion, carrots, sprouts, pepper, chicken, shrimp, ginger, soy sauce, salt, mirin, and sesame oil in a large bowl.","Cook soba noodles per package directions and drain.","Heat wok, add sesame oil, noodles, and mixture. Stir fry until semi-crisp, working in batches if needed.","Divide into four bowls. Top with pickled ginger, spring onions, and sesame seeds. Serve with chopsticks."],"by":"Rick","attr":"Wagamamas","desc":"A stir-fried noodle dish inspired by the London restaurant. The creator reports it closely mirrors what was served at their SoHo location.","prep":"20 minutes","cook":"40 minutes","total":"60 minutes","serves":"4","diff":2,"tools":"Wok; Colander","cat":"poultry"}]},{"slug":"puddings-custards-and-ice-cream","name":"Puddings, Custards & Ice Cream","recipes":[{"slug":"Custard","title":"Baked Custard","ing":["4 cups milk","6 large eggs","1/2 teaspoon salt","1/2 cup granulated sugar","1 teaspoon vanilla extract"],"dir":["Heat oven to 350°F.","Warm milk in a heavy saucepan over medium heat until small bubbles form around edges (180-185°F).","Whisk eggs, salt, and sugar together; gradually pour in scalded milk and vanilla.","Transfer mixture to a baking dish nested in a water bath (fill no higher than 2/3 up the dish).","Bake 1 hour until a knife inserted 1 inch from edge comes out clean; center should have slight movement.","Garnish with raspberries and mint if desired. Serve warm, room temperature, or chilled."],"by":"Susan Hodge","attr":"Marilyn Brock","desc":"A straightforward custard dessert requiring minimal ingredients. Topped with a few berries and a sprig of mint, this simple recipe takes on an elegant appearance. The dish adapts well to various serving temperatures and works as comfort food.","prep":"10 minutes","cook":"1 hour","total":"1 hour 30 minutes","serves":"6","diff":1,"cat":"puddings-custards-and-ice-cream"},{"slug":"BanaPudd","title":"Banana Pudding","ing":["1 cup sugar","½ cup all-purpose flour","½ teaspoon salt","2 cups 2% milk","1 teaspoon vanilla extract","1 tablespoon butter","4 large egg yolks","1 box vanilla wafers","5 ripe bananas"],"dir":["Line baking dish bottom with vanilla wafers.","Slice bananas; cover with plastic wrap to prevent browning.","Combine sugar, flour, and salt; remove lumps.","Heat egg yolks over medium heat; gradually add flour mixture alternating with milk and vanilla while stirring constantly until thickened; add butter.","Continue cooking and stirring until pudding consistency is reached; remove from heat.","Layer banana slices on wafers, add half the pudding mixture, repeat layers, then refrigerate."],"by":"Leon and Mary Brock","desc":"A layered dessert featuring vanilla wafers, sliced bananas, and custard pudding.","prep":"12-15 minutes","total":"30 minutes plus refrigeration","serves":"6 to 8","diff":2,"tools":"9 x 9 inch baking dish; Knife; Plastic wrap; Mixing bowl; Spoon; Heavy saucepan; Fork","cat":"puddings-custards-and-ice-cream"},{"slug":"CaraCorn","title":"Caramel Corn","ing":["3 quarts popped corn","1 cup brown sugar","1 stick butter","1/4 cup Karo light syrup","Pinch of cream of tartar","Pinch of salt","1/4 teaspoon baking soda"],"dir":["Pop the popcorn and remove unpopped kernels.","Combine brown sugar, butter, Karo syrup, cream of tartar, and salt in large saucepan; boil 5 minutes with occasional stirring.","Add baking soda to sugar mixture, then pour over popcorn and stir thoroughly.","Transfer mixture to 9x12 baking dish.","Bake at 200°F for 1 hour, stirring twice during baking.","Spread on newspaper and break into pieces.","Store in airtight container to maintain crispness."],"attr":"Gram Horn","desc":"A classic caramel-coated popcorn treat","prep":"7 minutes","cook":"60 minutes","total":"1 hour 30 minutes","serves":"8-12","diff":2,"tools":"9x12 baking dish","notes":"From the Family Cookbook.","cat":"puddings-custards-and-ice-cream"},{"slug":"CaraDip","title":"Caramel Dip","ing":["1/2 cup butter","2 cups dark brown sugar","1 cup light corn syrup","14 ounces sweetened condensed milk","2 tablespoons water","1 teaspoon vanilla extract"],"dir":["Melt butter in a medium saucepan on low heat, then incorporate sugar, corn syrup, milk, and water.","Raise heat to medium, stirring continuously for approximately 15 minutes until the mixture becomes smooth.","Mix in vanilla, then transfer to a warming vessel for serving.","Pair with angel food cake slices, apples, pineapple, bananas, and similar accompaniments."],"attr":"Marcia","desc":"A warm caramel dipping sauce for desserts and fruit","prep":"20 minutes","cook":"15 minutes","total":"20 minutes","serves":"8","diff":2,"tools":"Fondue pot or chafing dish","cat":"puddings-custards-and-ice-cream"},{"slug":"CaraFudge","title":"Caramel Fudge","ing":["3 cups sugar","3/4 cup evaporated milk","1/4 cup milk","1 teaspoon vanilla extract","Chopped nuts (optional)"],"dir":["Combine 1 cup sugar and 1 cup milk in heavy pot; stir until no granules remain on sides.","Heat to medium; stir minimally until dissolved and bubbling, then add remaining 2 cups sugar and stop stirring.","Boil approximately 5 minutes; gently swirl pan for even caramelization.","Remove when reaching soft ball stage (240°F).","Cool slightly; add vanilla and optional nuts.","Beat well and pour onto buttered plate to cool."],"attr":"Gram Horn","desc":"A beloved Christmas treat featuring caramelized sugar cooked to the soft ball stage without a thermometer, originating from Aunt Wilma.","prep":"5 minutes","total":"15 minutes plus cooling","serves":"12","diff":3,"tools":"Heavy gauge metal pot (required); Candy thermometer (highly recommended); Long-handled spoon or spatula (highly recommended); Pastry brush (optional)","cat":"puddings-custards-and-ice-cream"},{"slug":"EbtCD","title":"Everything-But-The-Cannoli Dip","ing":["1 (8 oz) package cream cheese, softened","2 tablespoons unsweetened Hershey's cocoa powder","6 ounces semi-sweet chocolate chips","1 box original Teddy Grahams"],"dir":["Mix cream cheese, cocoa powder, and chocolate chips in a bowl until fully incorporated.","Serve with Teddy Grahams."],"by":"Hannah","attr":"Hannah","desc":"A low-carb, high-protein chocolate dip developed to manage gestational diabetes cravings, requiring no cooking.","prep":"10 minutes","cook":"None","total":"10 minutes","serves":"5","diff":1,"tools":"Bowl","cat":"puddings-custards-and-ice-cream"},{"slug":"Fudge","title":"Fudge","ing":["5 tablespoons cocoa","5 tablespoons evaporated milk","3/4 stick butter","1 (16 oz) box powdered sugar","1 teaspoon vanilla"],"dir":["Combine cocoa, evaporated milk, and butter in a saucepan; warm over low heat until bubbling begins.","Stir in powdered sugar and vanilla until fully combined.","Transfer mixture to glass baking dish and allow to set."],"attr":"Gram Horn","desc":"This was another perennial favorite on Gram's holiday sweet tray","prep":"5 minutes","total":"15 minutes plus cooling","serves":"12","diff":2,"tools":"9x12 baking dish","cat":"puddings-custards-and-ice-cream"},{"slug":"IceCream","title":"Ice Cream","ing":["5 large eggs, beaten until foamy","1 cup light brown sugar","1¾ cups white sugar","Pinch of salt","1½ tablespoons vanilla","8 cups homogenized milk","1 pint whipping cream","3 Junket tablets","1 tablespoon warm water","3 cups rock salt","8-12 pounds ice"],"dir":["Beat eggs until foamy.","Combine beaten eggs, sugars, salt, and vanilla in blender.","Warm milk and cream to lukewarm temperature (test with wrist method).","Dissolve Junket tablets in warm water.","Mix egg mixture, warmed dairy, and dissolved tablets together.","Pour into ice cream maker canister; twist dasher 3-4 times without exceeding fill line.","Allow mixture to cool at room temperature until it thickens to buttermilk consistency.","Position canister in bucket with motor assembly engaged.","Churn for 1-2 minutes before adding ice.","Layer ice and rock salt around canister until covered."],"attr":"Gram and Pap","desc":"A homemade vanilla ice cream recipe featuring Junket tablets as a setting agent. The recipe allows for peach variations by adding fresh fruit during freezing.","prep":"10 minutes","total":"4 hours","serves":"8-12","diff":3,"tools":"Ice cream maker","cat":"puddings-custards-and-ice-cream"},{"slug":"PartMint","title":"Party Mints","ing":["1 (16 ounce) box powdered sugar","4 tablespoons Crisco","2 tablespoons milk","4 teaspoons oil of peppermint","Wax paper","Food coloring (optional)"],"dir":["Combine sugar, Crisco, milk, and peppermint oil. Transfer mixture to cookie press.","Line container with waxed paper. Press mixture into containers, separating each layer with wax paper.","Cover and refrigerate."],"by":"Susan Hodge","attr":"Marilyn Brock","desc":"I remember these not only at my own wedding and wedding showers as well as those of my friends. They are great for any type of celebration","prep":"10 minutes","cook":"20 minutes","total":"30 minutes","serves":"40-60","diff":3,"tools":"Cookie press","cat":"puddings-custards-and-ice-cream"},{"slug":"PeachPudd","title":"Peach Pudding","ing":["1 quart sliced peaches, peeled (about 5 medium)","1¼ cups sugar","¼ teaspoon salt plus dash","1 egg","2 tablespoons melted butter","¾ cup whole milk","2 cups flour","2 teaspoons baking powder","Pinch of salt"],"dir":["Combine peaches, ¾ cup sugar, and salt in a saucepan. Heat briefly until sugar dissolves and peaches release juice; set aside.","Whisk egg, remaining sugar, milk, flour, baking powder, and salt together.","Pour peaches into baking dish and top with batter.","Bake at 375°F for 25–30 minutes until lightly browned."],"attr":"Grandma Long","desc":"A seasonal dessert from a family cookbook. When it was peach season you could always count on Gram having a peach pudding ready when you came to visit. The recipe notes that other fruits work, though peaches were the original choice.","prep":"15 minutes","cook":"25-30 minutes","total":"45 minutes","serves":"6-8","diff":1,"tools":"9x12 baking dish","cat":"puddings-custards-and-ice-cream"},{"slug":"Pralines","title":"Pecan Pralines","ing":["2 cups pecans","2 tablespoons butter","1 teaspoon vanilla","1/4 teaspoon salt (conditional)","16 ounces brown sugar","1 5oz can evaporated milk (2/3 cups)"],"dir":["Toast pecans at 350°F for 7-10 minutes. Prepare workspace with parchment paper and pre-measured ingredients.","Combine brown sugar and milk in saucepan over medium-high heat, stirring constantly until mixture reaches 245-248°F.","Remove from heat and immediately stir in butter, vanilla, pecans, and salt.","Continue stirring until mixture loses shine and begins hardening slightly.","Spoon onto prepared paper in tablespoon portions and allow to cool."],"by":"Cathy","attr":"Moi","desc":"A holiday confection featuring pecans in a sweet coating. The recipe recommends roasting nuts beforehand to enhance flavor.","prep":"1 hour","cook":"Until mixture reaches 245-248 degrees","total":"Approximately 1 hour","serves":"Multiple servings for sharing","diff":2,"tools":"Parchment or wax paper; Heavy-bottomed saucepan; Wooden mixing spoon; Candy thermometer","cat":"puddings-custards-and-ice-cream"},{"slug":"UltChoco","title":"Ultimate Chocolate Fondue","ing":["1 1/4 cups whole milk or heavy cream","1 teaspoon pure vanilla extract","2 tablespoons unsalted butter","6 ounces Ghirardelli 70% Cacao Extra Bittersweet Chocolate (baking bar or chips)","6 ounces Ghirardelli Milk Chocolate (baking bar or chips)","2 tablespoons chocolate liqueur","Dippers: strawberries, pound cake, glazed doughnut holes, cream puffs, apple slices, pirouette cookies"],"dir":["Combine milk, vanilla, and butter in a medium saucepan. Heat over medium heat until simmering.","Remove from heat and stir in both chocolates and liqueur until smooth.","Transfer to fondue pot and maintain warm temperature while serving."],"by":"Susan Hodge","attr":"Susan Hodge","desc":"This is a nice dessert companion to the Three Cheese fondue and is the dessert part of Hodge Family New Year's","prep":"5 minutes","cook":"10 minutes","total":"15 minutes","serves":"6-8","diff":1,"tools":"Fondue pot or heat source for serving","cat":"puddings-custards-and-ice-cream"}]},{"slug":"salads","name":"Salads","recipes":[{"slug":"BrocCal","title":"Broccoli-Cauliflower Salad","ing":["4 cups chopped broccoli or cauliflower","1 cup chopped celery","1/2 cup chopped green onion","1 cup halved green grapes","1 cup halved red grapes","8 slices bacon, fresh and crisp, chopped","2/3 cup walnuts, almonds, or pecans","1 tablespoon vinegar","1 cup mayonnaise","1/2 cup sugar"],"dir":["Mix broccoli, celery, green onion, grapes, bacon, and nuts together.","In a separate bowl, whisk together vinegar, mayonnaise, and sugar.","Combine both mixtures and toss thoroughly."],"by":"Marcia","attr":"Marcia","desc":"A fresh vegetable and fruit salad combining cruciferous vegetables with grapes, bacon, and nuts in a creamy dressing.","prep":"30 minutes","cook":"5 minutes","total":"35 minutes","serves":"8","diff":1,"tools":"Large bowl; Small bowl","cat":"salads"},{"slug":"CarrotQuinoa","title":"Carrot Quinoa Salad","ing":["1 teaspoon + 1 tablespoon olive oil (divided)","1/2 cup dry quinoa (rinsed and drained)","1/2 cup apple juice","1 tablespoon maple syrup","Kosher salt and freshly ground pepper","1/4 cup thinly sliced kalamata olives","1/4 cup thinly sliced dried apricots","1 tablespoon red wine vinegar","2 large or 4 medium carrots","2 ounces soft goat cheese (crumbled)"],"dir":["Heat 1 teaspoon oil in a medium saucepan over medium heat. Toast quinoa for about one minute while stirring. Add apple juice, water, maple syrup, and salt; bring to a boil. Reduce heat to low, add olives and apricots, and simmer covered for 15 minutes. Let stand covered for 5 minutes, then fluff with a fork.","Mix red wine vinegar, salt, and remaining tablespoon of oil in a bowl. Peel carrots and shave into ribbons using a vegetable peeler, tossing with the vinaigrette.","Combine cooked quinoa, carrot ribbons, and crumbled goat cheese. Divide between two plates and serve."],"by":"Hannah","attr":"Hannah","desc":"A fresh, nutritious salad combining toasted quinoa with tender carrot ribbons, dried apricots, kalamata olives, and tangy goat cheese.","prep":"25 minutes","cook":"15 minutes","total":"40 minutes","serves":"2","diff":2,"tools":"Vegetable peeler or zoodler","cat":"salads"},{"slug":"ChickAvoFeta","title":"Chickpea, Avocado, & Feta Salad","ing":["1 can chickpeas (rinsed and drained)","2 avocados (pitted and chopped)","1/3 cup chopped cilantro","2 tablespoons green onion","1/3 cup feta cheese","Juice of 1 lime","Salt and black pepper to taste"],"dir":["Combine chickpeas, avocado, cilantro, green onion, feta cheese, and lime juice in a medium bowl.","Season with salt and pepper, then serve."],"by":"Susan Hodge","attr":"Susan Hodge","desc":"Quick, Easy and Versatile","prep":"5 minutes","total":"5 minutes","serves":"4","diff":1,"tools":"Medium bowl","cat":"salads"},{"slug":"classic-waldorf-salad","title":"Classic Waldorf Salad","ing":["2 cups diced apples","1 cup (1-inch) julienne celery sticks","1/2 cup chopped walnuts","1/4 cup mayonnaise","1 tablespoon sugar","1/2 teaspoon lemon juice","Dash salt","1/2 cup whipping cream, whipped"],"dir":["Combine apple, celery, and nuts.","Blend mayonnaise, sugar, lemon juice and salt; add to apple mixture.","Fold whipped cream into apple mixture.","Serve chilled."],"by":"Marcia","attr":"Roz","desc":"For an easier salad, just use what you have on hand; apples, celery, raisins, nuts, coconut, etc. The recipe offers a lighter version using sugar-free mayonnaise or whipped cream alternatives.","prep":"20 minutes","total":"25 minutes plus chilling","serves":"6","diff":1,"cat":"salads"},{"slug":"CranSal","title":"Cranberry Salad","ing":["1 medium orange peel","3-4 medium oranges, peeled","1 medium Granny Smith apple, with peel, cored","2-3 medium Honeycrisp apples, with peel, cored","1 (12 oz) package raw cranberries","1 (20 oz) can crushed pineapple","1½ cups sugar (adjust to taste)","2 cups boiling water","2 (3 oz) packages Jello (strawberry or raspberry)"],"dir":["Process orange peel to coarse salt consistency.","Pulse oranges into pieces without over-processing.","Finely chop apples.","Finely chop cranberries.","Combine orange peel, oranges, apples, cranberries, pineapple, and sugar in pan; mix well.","Dissolve Jello in boiling water, add to pan and stir.","Refrigerate overnight until set."],"by":"Gram (Horn)","attr":"Grandma Long","desc":"A family tradition for cranberry sauce at Thanksgiving.","prep":"45 minutes","cook":"Overnight to set","total":"50 minutes plus overnight","serves":"8","diff":3,"tools":"Food processor; Apple corer; 11x9 deep baking pan","cat":"salads"},{"slug":"crushed-cucumber-salad","title":"Crushed Cucumber Salad","ing":["1 English cucumber","3 cloves garlic, crushed and minced","1 tablespoon rice vinegar","1 tablespoon soy sauce","1 teaspoon sugar","½ teaspoon salt","½ teaspoon sesame oil","2 teaspoons chili oil (optional)"],"dir":["Wash, dry, and trim cucumber ends.","Use meat cleaver to gently crush cucumber.","Cut into bite-sized pieces; refrigerate.","Mix vinegar, soy sauce, sugar, salt, and sesame oil.","Add sauce just before serving to prevent dilution.","Optional: drizzle chili oil or red pepper flakes for heat."],"by":"Cathy","attr":"Omnivores Cookbook (adapted)","desc":"A refreshing cucumber salad that allows you to adjust the heat depending on what you're serving it with. The bruising technique creates texture that helps the cucumber retain sauce and flavor.","prep":"30 minutes","total":"35 minutes plus chilling","serves":"4 (appetizer/side portions)","diff":2,"tools":"Mixing bowl; Cutting board; Meat cleaver; Measuring cups; Paring knife","cat":"salads"},{"slug":"GreekTort","title":"Greek Tortellini Salad","ing":["Salad: 1 (20 ounce) package refrigerated cheese tortellini","Salad: 1/2 cup grape tomatoes, halved","Salad: 1 large cucumber, peeled and chopped","Salad: 1 cup kalamata olives, pitted and chopped","Salad: 1/2
