 medium red onion, diced","Salad: 3/4 cup crumbled feta cheese","Dressing: 1/4 cup extra virgin olive oil","Dressing: 3 tablespoons red wine vinegar","Dressing: 1 clove garlic, minced","Dressing: 1/2 teaspoon dried oregano","Dressing: Salt and pepper to taste"],"dir":["Boil salted water, cook tortellini per package instructions, drain, and rinse with cold water.","Combine tortellini with tomatoes, cucumber, olives, onion, and feta in a large bowl.","Whisk together oil, vinegar, garlic, oregano, salt, and pepper. Coat salad with dressing and serve."],"by":"Susan","attr":"Susan","desc":"This pasta salad is always a hit at parties, potlucks, picnics, and everyday meals!","prep":"10 minutes","cook":"10 minutes","total":"20 minutes","serves":"8","diff":1,"tools":"Large bowl; Colander; Small bowl","notes":"Refrigerate up to 3 days.","cat":"salads"},{"slug":"GreenJack","title":"Green Jacket Salad","ing":["1/2 head of lettuce, chopped","1 medium tomato, chopped","2 small green onions, sliced","2/3 cup grated parmesan cheese","Croutons to taste","2 tablespoons canola oil","1 tablespoon red wine vinegar","1 teaspoon garlic salt","1 teaspoon chives","1 teaspoon oregano","1 teaspoon parsley"],"dir":["Combine lettuce, tomato, and green onions in a large bowl.","Toss with parmesan cheese and croutons.","In a small bowl, whisk together oil, vinegar, garlic salt, chives, oregano, and parsley.","Pour dressing over salad and serve."],"by":"Susan Hodge","attr":"Marilyn Brock","desc":"This was the house salad for the Green Jacket restaurant in Macon, GA. It is a very versatile salad pairing well with most all meats","prep":"10 min","total":"10 min","serves":"4-6","diff":1,"tools":"Large bowl; Small bowl","cat":"salads"},{"slug":"KSWCGD","title":"Kale Salad with Carrot Ginger Dressing","ing":["Carrot Ginger Dressing: 1/2 cup chopped roasted carrots","Carrot Ginger Dressing: 1/3–1/2 cup water","Carrot Ginger Dressing: 1/4 cup extra-virgin olive oil","Carrot Ginger Dressing: 2 tablespoons rice vinegar","Carrot Ginger Dressing: 2 teaspoons minced ginger","Carrot Ginger Dressing: 1/2 teaspoon salt","Salad: 1 can (15.5 oz) roasted chickpeas","Salad: 1 bunch curly kale, stems removed","Salad: 1 teaspoon lemon juice","Salad: 1/2 teaspoon extra-virgin olive oil","Salad: 1 small carrot, grated","Salad: 1 small red beet, grated","Salad: 1/2 watermelon radish, thinly sliced","Salad: 1 avocado, cubed","Salad: 2 tablespoons dried cranberries","Salad: 1/2 cup toasted pepitas","Salad: 1 teaspoon sesame seeds","Salad: Sea salt and black pepper"],"dir":["Prepare dressing and chickpeas by roasting at 400°F for 25 minutes until crisp.","Blend roasted carrots with water, oil, vinegar, ginger, and salt; refrigerate overnight.","Massage kale with lemon juice, oil, and salt until softened.","Combine kale with grated vegetables, radish, half the avocado, cranberries, pepitas, seasoning, and dressing.","Top with remaining avocado, chickpeas, and sesame seeds."],"by":"Rick","attr":"Rick","desc":"A vibrant, nutrient-dense salad combining leafy greens with roasted legumes and fresh vegetables, featuring a smooth root vegetable-based dressing.","prep":"15 minutes","cook":"25 minutes","total":"25 minutes plus overnight dressing chill","serves":"4","diff":2,"tools":"Large baking sheet or air fryer; Blender; Large bowl; Grater","cat":"salads"},{"slug":"Marinate","title":"Marinated Salad","ing":["10.5 oz fresh asparagus OR 1 can asparagus spears, drained","1 can artichoke hearts, drained","1 can hearts of palm, drained","Dash seasoned salt","8 oz bottle Italian dressing","8 cups water (for blanching)","2 tablespoons coarse salt (for blanching)"],"dir":["Blanch fresh asparagus by boiling 3–4 inch pieces in salted water 3–4 minutes, then shock in ice water.","Combine vegetables in a shallow dish, season with salt, and pour Italian dressing over mixture.","Refrigerate several hours before serving."],"by":"Marlene","attr":"Marlene","desc":"A vegetable side dish featuring asparagus, artichoke hearts, and hearts of palm soaked in Italian dressing. The recipe notes that asparagus was only available during the summer months when originally created, offering both fresh and canned preparation options.","prep":"10 minutes (canned) / 20 minutes (fresh)","cook":"3–4 minutes (blanching only)","total":"25 minutes plus several hours marinating","serves":"6","diff":1,"tools":"Colander; Shallow dish","cat":"salads"},{"slug":"Jello","title":"Orange Jello Salad","ing":["1 (3 ounce) box orange jello","1/2 cup boiling water","1 1/2 cups orange juice","1 (11 ounce) can mandarin oranges, drained","1 (8 ounce) can crushed pineapple, drained well"],"dir":["Dissolve jello in boiling water.","Mix in orange juice.","Fold in drained fruit.","Refrigerate overnight until set."],"by":"Marilyn","attr":"Marilyn","desc":"If you are a true southerner this would be referred to as a congealed salad","prep":"20 minutes","total":"25 minutes plus overnight refrigeration","serves":"6","diff":1,"tools":"Colander; 8x8 pyrex dish","cat":"salads"},{"slug":"PastaHouse","title":"Pasta House Salad","ing":["1 head iceberg lettuce","1/2 head romaine lettuce","1 can (14 oz) artichoke hearts, drained","1 medium red onion, thinly sliced","1 jar (4 oz) pimientos, diced","2/3 cup olive oil","1/3 cup red wine vinegar","1/4 teaspoon black pepper","1 teaspoon salt","2/3 cup parmesan cheese"],"dir":["Combine lettuce, artichoke hearts, onion, and pimiento in a large bowl.","Mix oil, vinegar, pepper, salt, and cheese in a container with tight lid.","Shake vigorously until blended.","Toss dressing with salad until coated."],"by":"Susan Hodge","attr":"Phyllis Hodge","desc":"A copycat version of the popular salad from a St. Louis restaurant, considered the mother-in-law's signature dish. Pairs well with pizza and Italian meals.","prep":"10 minutes","cook":"None","total":"10 minutes","serves":"8-10","diff":1,"tools":"Large bowl","notes":"Do not add dressing for more than 30 minutes prior to serving, because the acids in the dressing will break down the lettuce.","cat":"salads"},{"slug":"PastaSal","title":"Pasta Salad","ing":["1 (16 oz) box pasta shells","1 (14 oz) can artichoke hearts, drained and chunked","1 (4.25 oz) can sliced black olives, drained","1 (4 oz) can sliced mushrooms, drained","Dash garlic salt","3/4 cup olive oil","1/4 cup red wine vinegar","2 splashes Italian dressing","1/4 cup grated parmesan cheese"],"dir":["Boil pasta per package instructions; drain into colander and transfer to large bowl.","Combine artichoke hearts, olives, and mushrooms into pasta.","Season with garlic salt to taste.","Blend olive oil with red wine vinegar; pour over salad with Italian dressing splashes and mix thoroughly.","Top with parmesan cheese before serving."],"by":"Marcia","attr":"Marcia","desc":"A flexible pasta salad recipe using tri-color spirals or penne, with artichoke hearts, olives, and mushrooms tossed in an olive oil and red wine vinegar dressing.","prep":"10 minutes","total":"15 minutes","serves":"8","diff":1,"tools":"Colander; Large bowl","cat":"salads"},{"slug":"QVSWLBD","title":"Quinoa Vegetable Salad with Lemon-Basil Dressing","ing":["1 cup white quinoa (uncooked)","1½ cups vegetable broth","6 ounces grape tomatoes, halved","1 medium orange bell pepper, chopped","4 green onions, sliced","1 (15 ounce) can garbanzo beans, rinsed and drained","1½ cups sweet corn, cooked","2-3 tablespoons fresh basil, chopped","3 tablespoons fresh lemon juice","2 teaspoons apple cider vinegar","1-2 cloves garlic, minced","1½ teaspoons fresh basil","¼ teaspoon salt"],"dir":["Cook rinsed quinoa in vegetable broth over medium-high heat until boiling, then simmer covered on medium-low for 15-20 minutes.","Whisk together lemon juice, vinegar, garlic, basil, and salt.","Cool cooked quinoa briefly, then combine with vegetables and beans in a large bowl.","Pour dressing over ingredients and toss thoroughly to blend.","Serve immediately or refrigerate several hours to develop flavors."],"by":"Susan","attr":"Susan","desc":"Found this recipe when looking for make ahead salad for lunch before graduation. It has continued to be a favorite.","prep":"10 minutes","cook":"15-20 minutes","total":"30 minutes plus 2-3 hours refrigeration","serves":"8","diff":2,"cat":"salads"},{"slug":"strawberry-salad","title":"Strawberry Salad","ing":["10 ounces salad greens","1 quart fresh strawberries, cut","3/4 cup crumbled feta cheese","3/4 cup pecans or walnuts","1/4 cup raspberry vinaigrette"],"dir":["Combine greens and remaining ingredients (except vinaigrette) in bowl.","Add vinaigrette just before serving and toss."],"by":"Family Cookbook","attr":"Marcia","desc":"A flexible spinach and strawberry salad recipe designed to serve a crowd. Arugula can replace half the spinach for peppery notes, while goat cheese or mild blue cheese work in place of feta. Buy block cheese and crumble it fresh for superior creaminess compared to pre-crumbled varieties.","prep":"10 minutes","total":"15 minutes","serves":"8","diff":1,"tools":"Large bowl","notes":"Prepare-ahead tip: dress salad as close to serving time as possible; if storing portions, dress only what you'll consume immediately. Keep undressed leftovers refrigerated up to 4 days.","cat":"salads"},{"slug":"TomatAvo","title":"Tomato Avocado Salad","ing":["3-4 medium tomatoes on the vine, chopped","2 avocados, peeled and cut into bite-size chunks","1/2 small red onion, chopped","Cilantro, chopped to taste","2 tablespoons olive oil","2 tablespoons fresh lime juice","Zest from 1 lime","1 garlic clove, minced","1/2 teaspoon salt","Pepper to taste"],"dir":["Combine tomatoes, avocados, red onion, and cilantro in a large bowl.","Drizzle with olive oil and lime juice.","Add lime zest, garlic, salt, and pepper; toss gently.","Serve immediately or refrigerate up to two hours for best results."],"by":"Susan","attr":"Susan","desc":"A versatile dish adaptable as a side, protein topping, or taco ingredient.","prep":"15 min","total":"2 hours 25 min","serves":"4","diff":1,"tools":"Large bowl; Zester","cat":"salads"},{"slug":"TaWBS","title":"Tuna and White Bean Salad","ing":["3 tablespoons extra virgin olive oil","2 tablespoons red wine vinegar","2 teaspoons Dijon mustard","1/2 teaspoon pepper","2 (15 ounce) cans albacore tuna in water, drained","1 cup halved grape tomatoes","1 cup coarsely chopped pitted green olives","3 green onions, thinly sliced","3 tablespoons chopped fresh chives","1/2 head bibb lettuce, separated into leaves (optional)"],"dir":["Whisk together oil, vinegar, mustard, and pepper in a large bowl.","Add beans, tuna, tomatoes, olives, and onions and toss.","Top with chives."],"by":"Susan","attr":"Susan","desc":"This no cook salad is easy to put together. You can serve it on a piece of bibb lettuce if you wish or it also pairs well with wheat thins.","prep":"20 minutes","total":"40 minutes","serves":"6","diff":1,"notes":"The ingredient list on the original page doesn't show the white beans named in step 2; add a can of white beans, drained and rinsed, to taste.","cat":"salads"},{"slug":"WBSWAAC","title":"Wheat Berry Salad With Apples and Cranberries","ing":["Dressing: 3 tablespoons extra virgin olive oil","Dressing: 3 tablespoons pure honey","Dressing: 1 tablespoon apple cider vinegar","Dressing: 1 tablespoon freshly squeezed lemon juice","Dressing: 1/8 teaspoon table salt","Dressing: 1/4 teaspoon freshly ground black pepper","Salad: 1 cup whole wheat berries, dry","Salad: 1 large apple, chopped","Salad: 1 orange, peeled and segmented","Salad: 1/2 cup dried cranberries","Salad: 2 stalks green onion, thinly sliced","Salad: 1 cup baby kale leaves","Salad: 1 cup toasted pecans, chopped"],"dir":["Prepare dressing by whisking together all dressing components; refrigerate until needed.","Cook wheat berries in heavy pot according to package directions (approximately one hour of boiling).","Drain thoroughly and cool, optionally rinsing with cold water to expedite cooling.","Combine cooled berries with apples, orange, cranberries, green onions, and kale in large bowl.","Toss mixture with prepared dressing; adjust seasoning as needed.","Add pecans immediately before serving."],"by":"Hannah","attr":"Hannah","desc":"A wonderful make-ahead salad for holiday meals, or a great meal to last through the week","prep":"30 minutes","cook":"60 minutes","total":"90 minutes","serves":"6","diff":2,"tools":"Small bowl; Large bowl; Whisk; Heavy pot; Colander","cat":"salads"}]},{"slug":"soup","name":"Soups & Stews","recipes":[{"slug":"Beef-Stew","title":"Beef Stew","ing":["1 package stew beef (1-1/2 lb)","1 medium onion, chopped","4-5 medium potatoes, diced","3-4 carrots, sliced","1 can (4.5-6 oz) sliced mushrooms, drained, or 8 oz fresh mushrooms","2 cans Campbell's Golden Mushroom Soup","1/4-1/2 cup sherry, to taste","Salt and pepper to taste"],"dir":["Place stew meat and onion in Dutch oven; sear over high heat approximately 3 minutes until browned on multiple sides.","Cover with water and bring to a boil; season with salt and pepper.","Reduce heat to low; simmer 2-3 hours until meat becomes tender, maintaining minimal water to prevent burning and adding small amounts as needed.","Add potatoes, carrots, mushrooms, soup, and sherry; cook until vegetables soften (about 15 minutes)."],"by":"Family Cookbook","attr":"Marilyn","desc":"A hearty stew for a cold night. Pair it with a baguette Yum Yum","prep":"10 minutes","cook":"3 hours 20 minutes","total":"3 hours 30 minutes","serves":"4-6","diff":2,"tools":"7-quart Dutch oven","cat":"soup"},{"slug":"Brunswick-Stew","title":"Brunswick Stew","ing":["1 young whole chicken (2-4 pounds)","1 package stew beef (1-1½ pounds)","1 bay leaf","1 onion, chopped","1 cup chopped celery","1½ cups frozen baby lima beans","2 cups frozen corn","2 large potatoes, diced small","1 tablespoon parsley","½ teaspoon black pepper (or to taste)","Salt to taste","½ tsp crushed red pepper (optional)","4 cups chicken broth","2 cups beef broth","4 cups V-8 or tomato juice","½ cup BBQ sauce"],"dir":["Boil chicken in water for 90 minutes; shred meat and reserve broth.","Simmer stew beef with bay leaf for 90 minutes; shred and reserve broth.","Combine all ingredients in crock pot; simmer 8-12 hours.","Add BBQ sauce several hours before serving."],"attr":"Mary Horn","desc":"This recipe has been translated to the best of our ability. The amounts of V8 juice and BBQ sauce can be varied according to taste preferences.","prep":"2 hours","cook":"8-12 hours","serves":"8","diff":2,"tools":"Crock pot","cat":"soup"},{"slug":"BBnPC","title":"Black Bean 'n Pumpkin Chili","ing":["1 medium onion","2–3 carrots, diced","1 celery stalk, diced","1\" fresh ginger","2 tablespoons olive oil","3 cups chicken broth","2 cans (15 oz each) black beans, rinsed and drained","2½ cups cubed cooked chicken or turkey","1 can (15 oz) solid pack pumpkin","1 can (14½ oz) diced tomatoes, undrained","2 teaspoons dried parsley flakes","2 teaspoons chili powder","1½ teaspoons dried oregano","1½ teaspoons ground cumin","½ teaspoon salt","Crusty baguette"],"dir":["Prepare protein using leftover rotisserie chicken, boiled chicken breasts, or sautéed chicken pieces (2½ cups total).","Sauté onion, carrots, and celery until tender (~5 minutes); add ginger for one additional minute.","Transfer to 5-quart slow cooker and stir in remaining ingredients.","Cover and cook on low 4–5 hours until heated through."],"by":"Cathy","attr":"Cathy","desc":"A fall and winter slow cooker dish that improves when allowed to sit overnight. The recipe offers flexibility—those avoiding ginger can substitute a sweet yellow pepper and garlic cloves instead.","prep":"20 minutes (plus cooking time if preparing chicken)","cook":"4–5 hours","total":"4 hours 20 minutes – 5 hours 20 minutes","serves":"10 (2½ quarts)","diff":3,"tools":"Slow cooker","cat":"soup"},{"slug":"BBSiSC","title":"Black Bean Soup in Slow Cooker","ing":["1 pound dried black beans (unsoaked)","1 yellow onion, quartered","5 garlic cloves, smashed and peeled","1 chipotle chili in adobo sauce plus 1 tablespoon sauce","2 teaspoons ground cumin","2 dried bay leaves","1 teaspoon dried oregano","1/4 teaspoon baking soda (optional)","Kosher salt","1 teaspoon apple cider vinegar","Sour cream, Greek yogurt, corn chips, cilantro, and lime wedges for serving"],"dir":["Combine beans, onion, garlic, chipotle chili with sauce, cumin, bay leaves, oregano, and baking soda in a 5-8 quart slow cooker.","Add 6 cups water and 1 teaspoon salt; stir.","Cook on low for 8-10 hours until beans are tender, or bring to a boil on high, then reduce to low.","Remove bay leaves. Transfer onion, garlic, chipotle, and 2 cups of beans with broth to a blender and puree until smooth.","Return puree to slow cooker, stir in vinegar, and season with salt to taste."],"by":"Marcia","attr":"NYT","desc":"A straightforward slow cooker soup featuring dried black beans with aromatic spices. The baking soda softens the beans to a fudgy texture, and the finished soup thickens upon cooling, making it suitable for reheating or transforming into refried beans.","prep":"10 minutes","cook":"8-10 hours","total":"8-10 hours","serves":"4-6","diff":3,"tools":"Slow cooker; Blender, food processor, or immersion blender","cat":"soup"},{"slug":"BBSPC","title":"Black Bean & Sweet Potato Chili","ing":["2 medium sweet potatoes","2 tablespoons light olive oil","1 cup chopped onion","2 garlic cloves","1 medium red pepper, diced","1 (32 ounce) can black beans, drained and rinsed","1 (28 ounce) can diced tomatoes","1-2 fresh hot chilies, minced, or 1 (4 ounce) can mild green chilies","2 teaspoons cumin","1/2 teaspoon dried oregano","Salt to taste"],"dir":["Partially cook sweet potatoes by baking or microwaving until just firm (3-4 minutes per potato). Peel and cut into 3/4-inch cubes.","Sauté onion and garlic in heated oil until golden. Combine with beans, tomatoes, chilies, cumin, oregano, and salt. Simmer 15 minutes over medium heat.","Add cooked sweet potatoes and continue cooking 10-15 minutes until tender throughout."],"by":"Tammy","attr":"Tammy","desc":"A flavorful chili combining black beans with sweet potatoes and warm spices.","prep":"15 minutes","cook":"25-30 minutes","total":"45 minutes","serves":"6-8","diff":1,"tools":"Soup pot","cat":"soup"},{"slug":"ColdZucc","title":"Cold Zucchini Soup","ing":["2 large zucchini, sliced","1 green pepper, chopped","1/4 cup finely chopped yellow onion","3 cups chicken stock","1 cup sour cream or plain yogurt","1 tablespoon chopped fresh parsley","1/2 teaspoon chopped fresh dill","Salt and pepper to taste","1/2 cup (or more) chopped zucchini"],"dir":["Set aside 4 zucchini slices for garnish. Combine remaining zucchini, green pepper, onion, and stock in a saucepan. Cover and simmer 20 minutes.","Strain vegetables while preserving the stock.","Blend vegetables with sour cream, parsley, dill, salt, and pepper until smooth.","Mix puree with reserved stock in a container.","Refrigerate covered until cold.","Serve with chopped zucchini for texture, topped with a zucchini slice, sour cream, and dill."],"by":"Susan Hodge","attr":"Yeaman's Hall","desc":"A light refreshing summer soup","prep":"20 minutes","cook":"20 minutes","total":"40 minutes + chill time","serves":"4","diff":3,"tools":"Blender; Strainer","cat":"soup"},{"slug":"Downhome","title":"Downhome Chili","ing":["1 pound ground beef","1 can (16 oz) kidney beans","2 cans (8 oz each) tomato sauce","1 package chili seasoning","1 package brown gravy mix","1 cup cold water","Sour cream (optional)","Shredded cheddar cheese (optional)","Chopped green onions (optional)"],"dir":["Brown ground beef in Dutch oven.","Drain beef thoroughly using colander; rinse with hot water if needed.","Return meat to pot; add beans, tomato sauce, seasonings, gravy mix, and water.","Bring to boil, then simmer on medium-low for at least 20 minutes."],"by":"Family Cookbook","attr":"Rick","desc":"A hearty winter chili that can be easily scaled up for gatherings. The recipe produces a thick consistency that can be thinned with additional water if preferred. Commonly topped with cheese, onions, and sour cream.","prep":"10 minutes","cook":"20 minutes (minimum)","total":"30 minutes","serves":"4","diff":1,"tools":"5-quart Dutch oven; Colander","cat":"soup"},{"slug":"FreshVeg","title":"Fresh Vegetable Soup","ing":["2 garlic cloves, minced","1 medium onion, diced","2 medium carrots, diced","1 medium sweet red pepper, diced","1 celery stalk, diced","2 small zucchini, diced","2 cups green cabbage, shredded","2 cups swiss chard, chopped","2 cups cauliflower, small florets","2 cups broccoli, small florets","2 teaspoons fresh thyme, chopped","2 cups vegetable broth","2 tablespoons fresh parsley or chives, chopped","1/2 teaspoon salt","1/4 teaspoon fresh ground black pepper","2 tablespoons fresh lemon juice"],"dir":["Combine garlic, vegetables, thyme and broth in a large stock pot. Cover and bring to boil; reduce heat and simmer partially covered for 10 minutes. Puree partially with an immersion blender for thicker consistency.","Add parsley/chives, salt, pepper and lemon juice to each bowl to taste."],"by":"Rick","attr":"Marcia","desc":"This is the penultimate vegan soup","prep":"35 minutes","cook":"15 minutes","total":"50 minutes","serves":"12 (1 cup servings)","diff":1,"tools":"Stock pot","notes":"You can feel the weight melt off, no?","cat":"soup"},{"slug":"GhanNut","title":"Ghanian Peanut Chicken Soup","ing":["2 tsp Berbere spice mix","2 tsp Peanut rub spice mix","4 chicken breasts","1 onion, diced","1 green bell pepper, diced","3 carrots, diced","1 garlic clove, minced","1 jalapeño pepper, diced","4 cups chicken broth","½ cup smooth peanut butter","1 tbsp tomato paste","1 tomato, diced","1 inch fresh ginger, minced","½ cup coconut milk","Salt and pepper","Vegetable oil","Rice, quinoa, or couscous for serving"],"dir":["Rub chicken with Berbere spice; brown in hot oil on all sides. Remove and set aside.","Sauté onion, bell pepper, carrots, garlic, and jalapeño for 5 minutes until softened.","Add Peanut Rub; cook 2 minutes.","Add chicken broth; simmer 20 minutes until reduced by half.","Reduce heat, stir in peanut butter, tomato paste, tomato, ginger, and coconut milk. Simmer 3-4 minutes.","Add chicken; cook 30 minutes, stirring frequently.","Serve over rice or grain base."],"by":"Rick","attr":"Marcia","desc":"In many west African countries, a 'soup' is anything that has a bed of rice and something on top. The chef notes this dish features rich, complex flavors once the spices are properly balanced.","prep":"15 minutes","cook":"1 hour 5 minutes","total":"1 hour 20 minutes","serves":"4","diff":2,"tools":"Braiser","cat":"soup"},{"slug":"ChickDump","title":"Grams' Chicken & Dumplings","ing":["6 chicken tenders or 1-2 chicken breasts (approximately 1 pound)","1 cup flour","1 egg","3-4 tablespoons water","Salt and pepper"],"dir":["Boil chicken in water until tender (15-20 minutes); reserve broth.","Mix flour, egg, and water into soft dough; knead as needed.","Roll dough to 1/8\" thickness on floured surface.","Cut into 1\" wide strips.","Fill dutch oven halfway with broth and water; season with salt and pepper.","Add bite-sized chicken pieces to broth.","Bring to boil; drop in dumplings.","Cover, reduce heat to medium-low, simmer 20 minutes."],"by":"Family Cookbook","attr":"Mary Horn","desc":"This is a classic feel good recipe","prep":"20 minutes","cook":"20 minutes","total":"20 minutes","serves":"4","diff":2,"tools":"3 qt dutch oven; Rolling pin; Wax paper","notes":"Yummy, yummy!!","cat":"soup"},{"slug":"Italian-Wedding","title":"Italian Wedding Soup","ing":["1 14-ounce bag small frozen meatballs, halved","2 tablespoons olive oil","1 medium diced yellow onion","2 large diced carrots","2 diced celery stalks","6 cups chicken broth","2 cups beef broth","2 cups water","½ cup dry white wine","1 bay leaf","½ teaspoon salt","¼ teaspoon pepper","1 cup ditalini pasta","4 ounces fresh spinach, chopped","Parmesan cheese for serving","Crusty bread"],"dir":["Prep meatballs, vegetables, and spinach.","Sauté onions, carrots, and celery in olive oil until tender (8 minutes).","Add broths, water, wine, bay leaf, salt, and pepper; bring to boil.","Add pasta and simmer until al dente (8–10 minutes).","Adjust seasoning as needed.","Reduce heat and add spinach and meatballs; simmer until heated through.","Serve in bowls with cheese and bread."],"by":"Leon and Mary Brock","desc":"A classic soup featuring meatballs, vegetables, pasta, and spinach in a savory broth","prep":"10 minutes","cook":"30 minutes","total":"40 minutes","serves":"8","diff":2,"tools":"Knife; Cutting board; Dutch oven; Ladle","cat":"soup"},{"slug":"LCaOS","title":"Lemon Chicken and Orzo Soup","ing":["2 tablespoons unsalted butter","1 small onion, chopped fine","8 cups chicken broth","2 sprigs fresh thyme","Salt and pepper","1 cup orzo","6 large egg yolks","6 tablespoons lemon juice (2 lemons)","2 cups shredded chicken","2 tablespoons chopped fresh chives"],"dir":["Melt butter; sauté onion until tender (4 minutes).","Add broth, thyme, salt, pepper; bring to boil.","Add orzo; simmer 12-14 minutes until cooked.","Whisk egg yolks with lemon juice; temper into hot soup while stirring.","Fold in chicken, cover, rest 10 minutes; garnish with chives and serve."],"by":"Susan Hodge","attr":"Marcia Wall","desc":"A simplified rendition of Ladles Soups' signature dish from Mt. Pleasant that captures the original's essential character with minimal fuss.","prep":"10 minutes","cook":"30 minutes","total":"40 minutes","serves":"4-6","diff":2,"tools":"Stock pot","cat":"soup"},{"slug":"LaCWC","title":"Lewis and Clark's White Chili","ing":["2 pounds boneless chicken breast (skin removed)","3 pounds canned Great Northern beans (with liquid)","1 tablespoon olive oil","4 cloves garlic, minced","2 medium onions, chopped","2 teaspoons ground cumin","1/4 teaspoon ground cloves","1/4 teaspoon cayenne pepper","1 teaspoon ground oregano","2 cans (4 ounces each) chopped mild green chilies","4 cups chicken broth","20 ounces Monterey Jack cheese, grated","Sour cream (optional)","Cilantro, chopped (optional)","Chopped jalapeño peppers (optional)"],"dir":["Simmer chicken in water until tender (15-20 minutes). Remove and dice into 1/2-inch cubes or shred.","Discard cooking water. Heat oil in the same pot over medium heat.","Cook onions until translucent. Add garlic, chilies, and spices; sauté 2-3 minutes.","Add chicken, beans, broth, and 12 ounces cheese. Simmer 15 minutes. Serve topped with remaining cheese."],"by":"Susan Hodge","attr":"Phyllis Hodge","desc":"This was a recipe served at Lewis and Clark restaurant in St. Charles, MO.","prep":"20 minutes","cook":"40 minutes","total":"60 minutes","serves":"6-8","diff":1,"tools":"5-quart Dutch oven","notes":"Garnish with sour cream, cilantro, and/or jalapeños as desired.","cat":"soup"},{"slug":"MomVeg","title":"Mom's Vegetable Soup","ing":["1 lb hamburger","1 medium onion, chopped","2-3 potatoes, cubed","2 carrots","2-3 celery leaves","4-6 cups tomato juice","1 can (15 oz) lima beans","1 can (15 oz) corn","1 can (15 oz) green beans","1 can (15 oz) peas","1 teaspoon Mexene chili powder (adjust to taste)","¼–½ cup rice"],"dir":["Brown hamburger with onion.","Add potatoes, carrots, and celery leaves.","Add water until ingredients are nearly covered.","Season with chili powder.","Mix in canned vegetables and rice.","Pour tomato juice to cover contents.","Bring to boil, then simmer on medium-low heat.","Cook 20–30 minutes until potatoes, carrots, and rice reach tenderness."],"by":"Family Cookbook","attr":"Mary Horn","desc":"A flexible vegetable soup that accommodates ingredient swaps and freezes well for storage.","prep":"10 minutes","cook":"20-30 minutes","total":"45 minutes","serves":"4","diff":1,"tools":"Dutch oven; Colander","notes":"Recipe allows substitutions (frozen for canned vegetables) and omissions (such as rice).","cat":"soup"},{"slug":"MultiBean","title":"Multi Bean Soup","ing":["2 cups multi bean soup mix","8 cups water","1 pound diced ham","1 large chopped onion","1 minced garlic clove","½–¾ teaspoon salt (to taste)","1 (16 oz) can tomatoes and green chilies, undrained"],"dir":["Rinse bean mix in colander.","Place beans in Dutch oven; add water covering beans by 2 inches.","Soak overnight.","Drain soaking water.","Add 8 cups fresh water, ham, onion, garlic, and salt.","Cover and bring to boil on high heat.","Reduce to medium-low; simmer 1½ hours until beans are tender.","Add tomatoes; simmer 30 minutes more, stirring occasionally."],"by":"Family Cookbook","attr":"Gram (Horn) & Marilyn","desc":"This was initially titled nine bean soup. There are multiple brands of multi bean soup mix available.","prep":"5 minutes plus overnight soak","cook":"2 hours 15 minutes","total":"2 hours 15 minutes","serves":"8","diff":2,"tools":"Dutch oven; Colander","notes":"If using Hurst's brand beans discard the flavor packet that comes with it.","cat":"soup"},{"slug":"NBTRCBt","title":"Not Better Than Rick's Chili (But tasty)","ing":["1 lb ground veal or hamburger","2 onions, chopped","1 (28 oz) can San Marzano whole tomatoes","2 tbsp ground cumin","1 tbsp chili powder","1 tbsp chipotle chili powder","1 tsp salt","½ tsp cayenne pepper","½ tsp smoked paprika","1 (14 oz) can chili beans","1 (14 oz) can black beans, drained and rinsed","1 cup water","Toppings: Cheddar cheese","Toppings: Sour cream"],"dir":["Brown meat and onions in Dutch oven; drain excess fat.","Add tomatoes, spices, beans, and water; bring to boil.","Simmer covered 1-2 hours."],"by":"Marcia","attr":"Marcia","desc":"A chili improvised from pantry staples on a cold, rainy evening when planned ingredients weren't available. The recipe carries considerable heat.","prep":"15 minutes","cook":"1 hour to 2 hours","total":"1 hour 15 minutes to 2 hours 15 minutes","diff":1,"tools":"Dutch oven","cat":"soup"},{"slug":"PotatSop","title":"Potato Soup","ing":["4 medium potatoes, cubed","1/4 cup medium onion, diced","4 celery leaves, torn","1 cup milk","1 tablespoon butter","1/2 cup grated cheese","Salt and pepper"],"dir":["Boil potatoes, onions, and celery leaves in a large saucepan using minimal salted water—just enough to cover the potatoes. Cook approximately 10 minutes depending on cube size; avoid overcooking.","Add milk, butter, and cheese.","Season to taste with salt and pepper."],"by":"Marcia","attr":"Gram via Marilyn, Marlene and Marcia","desc":"A cherished family recipe passed down through three sisters who recreated it from memory by observing their grandmother's preparation methods.","prep":"10 minutes","cook":"20-25 minutes","total":"20-25 minutes","serves":"4","diff":1,"tools":"Large saucepan","notes":"Adjust the ratio of water to milk based on preference. Reserve drained potato water for additional liquid if needed, as it adds flavor.","cat":"soup"},{"slug":"Lentil","title":"Red Lentil Soup","ing":["3 tablespoons olive oil","1 onion, chopped","1-3 garlic cloves, diced","½ bunch kale, stems removed and chopped","2 carrots, diced","1 teaspoon ground coriander","1 teaspoon ground cumin","1 hot chili or cayenne pepper","4 cups chicken or vegetable stock","1 cup red lentils, washed","Fresh lemon slices","Cilantro","Salt and pepper to taste"],"dir":["Sauté onion in oil for 10 minutes.","Add spices, garlic, and carrots; sauté 3-5 minutes.","Add chili, stock, and lentils; bring to boil, then simmer 45-60 minutes.","Stir in kale with seasonings; serve with lemon juice and cilantro garnish."],"by":"Rick","attr":"Marcia","desc":"A nutritious, plant-based dish that works as vegetarian or vegan fare. The recipe typically calls for red lentils, though alternative varieties work with adjusted cooking times.","prep":"15 minutes","cook":"45-60 minutes","total":"1 hour 30 minutes","serves":"8","diff":3,"tools":"Stock pot","cat":"soup"},{"slug":"TacoSoup","title":"Taco Soup","ing":["1 pound hamburger","2 cans (7 ounce each) shoepeg corn","1 small onion (optional)","1 can (15.5 ounce) kidney or pinto beans","1 can (15 ounce) black beans","1 quart diced tomatoes (large can)","1 can (10 ounce) Rotel tomatoes","1 package (1 ounce) taco seasoning","1 package (1 ounce) dry ranch mix"],"dir":["Brown hamburger and onion, then drain.","Combine remaining ingredients in pot with meat and all can liquids.","Simmer approximately 30 minutes; add water if a thinner consistency is preferred; substitute bean varieties as desired."],"by":"Susan Hodge","attr":"Susan Hodge","desc":"A customizable soup that pairs well with nacho chips, shredded cheese, and sour cream for toppings.","prep":"10 minutes","cook":"30 minutes","total":"40 minutes","serves":"6","diff":1,"tools":"Large pot","cat":"soup"},{"slug":"Bisque","title":"Tomato Bisque","ing":["2 (28 oz) cans whole tomatoes, drained (San Marzano preferred)","1 Tbsp olive oil","1 Tbsp light brown sugar","4 carrots, peeled and chopped","2 shallots, quartered","Salt and freshly ground black pepper","3 Tbsp unsalted butter","½ tsp crushed red pepper","2 cloves garlic, minced","1 Tbsp tomato paste","2 Tbsp dry sherry","1 (28 oz) can crushed tomatoes (San Marzano preferred)","1–2 cups chicken stock","¼ cup heavy cream"],"dir":["Preheat oven to 400°F. Combine drained tomatoes, oil, sugar, carrots, and shallots; season and roast on lined sheet until caramelized (30 minutes).","Heat butter in Dutch oven over medium heat until foaming. Add red pepper and garlic; sauté 1 minute.","Stir in tomato paste (1–2 minutes), then sherry until alcohol cooks off.","Add roasted vegetables, crushed tomatoes, and 1 cup stock; season and simmer 15 minutes.","Blend in cream using immersion blender until smooth.","Adjust consistency with additional stock as desired."],"by":"Marcia","attr":"Hannah and Richard","desc":"A really fantastic tomato soup! Forget Campbell's! You can omit the cream for a soup versus bisque. Don't forget the cheeser.","prep":"20 minutes","cook":"45 minutes","total":"1 hour 15 minutes","serves":"4","diff":2,"tools":"Immersion blender; Lined baking sheet (silicone or parchment); Dutch oven","cat":"soup"},{"slug":"Brodo","title":"Tortellini in brodo","ing":["2 tablespoons olive oil","1 1/2 cups chopped onion","3/4 cup chopped celery","3/4 cup chopped carrots","2 tsp minced garlic","1 tsp Italian seasoning","1/8 tsp crushed red pepper flakes","8 cups chicken or vegetable stock","1 pack tortellini (frozen or dried)","2 tbsp parsley","1/2 cup grated Parmesan cheese","Salt & pepper"],"dir":["Heat olive oil in large stock pot over medium-high heat.","Add onion, celery, carrots, salt and pepper; sauté 5 minutes until tender.","Stir in garlic, red pepper flakes, and Italian seasoning.","Cook 2-3 minutes until fragrant, then add stock.","Bring to boil; reduce heat and simmer 20+ minutes.","Add tortellini; cook 5 minutes (fresh) or 15 minutes (frozen).","Serve garnished with Parmesan cheese and parsley."],"by":"Rich","attr":"Emeril","desc":"A warm, hearty soup that hits the spot when its cold outside.","prep":"15 minutes","cook":"30-45 minutes","total":"45-60 minutes","serves":"6","diff":1,"cat":"soup"},{"slug":"VegCash","title":"Vegetarian Chili with Cashews","ing":["1 tablespoon olive oil","1 large garlic clove, chopped","1 small onion, diced","1 medium zucchini, diced","1 stalk celery, diced","1 carrot, diced","1/2 red pepper, diced","1 tablespoon chili powder","1/4 teaspoon cayenne pepper","1 bay leaf","1/2 teaspoon ground cumin","1 tablespoon brown sugar","1/2 teaspoon basil","1 15oz can kidney beans","1 15oz can tomato puree","1/2 teaspoon salt","1/2 teaspoon black pepper","1/2 cup cashews"],"dir":["Sauté garlic, onions, zucchini, celery, carrot, and red pepper in heated olive oil for 5 minutes.","Add spices and seasonings; cook on low heat for 2 minutes.","Stir in kidney beans and tomato puree; simmer 20 minutes on medium-low.","Season with salt and pepper; cook 10 minutes. Remove bay leaf and add cashews."],"by":"Marilyn","attr":"Marilyn","desc":"Good to cook ahead - tastes even better when warmed up. I always cook a day before planning to use.","prep":"20 minutes","cook":"40 minutes","total":"1 hour","diff":2,"tools":"Dutch oven","cat":"soup"}]},{"slug":"spice-mixes-sauces","name":"Spice Mixes & Sauces","recipes":[{"slug":"BBQSuace","title":"Bar-B-Que Sauce","ing":["1 cup catsup","1 cup brown sugar","1/4 cup BBQ sauce (Open Pit)","3 teaspoons Worcestershire sauce","2 teaspoons liquid smoke","2 teaspoons lemon juice","2 tablespoons mustard","2 teaspoons white vinegar","1/2 teaspoon onion salt","1/2 teaspoon garlic salt","1/2 teaspoon lemon pepper"],"dir":["Combine all ingredients and mix well, until all the sugar is dissolved. Refrigerate."],"by":"Max","attr":"Max","desc":"Great general purpose BBQ sauce. Works well for basting too.","prep":"5 minutes","cook":"5 minutes","serves":"About 2 1/2 cups","diff":1,"cat":"spice-mixes-sauces"},{"slug":"Berbere","title":"Berbere Spice Mix","ing":["6 cardamom pods","3 tablespoons paprika","1 tablespoon coarse sea salt","1 teaspoon cumin seeds, toasted","1 teaspoon fenugreek seeds, toasted","1 teaspoon allspice berries, toasted","1 teaspoon red pepper flakes","1 teaspoon dried thyme","2 whole cloves","1 dried chipotle chile, stemmed and broken","1 teaspoon black peppercorns","1/2 teaspoon coriander seeds, toasted","1/2 teaspoon ground ginger","1/4 teaspoon ground nutmeg","1/4 teaspoon cayenne pepper"],"dir":["Toast cardamom pods over medium-low heat for 2-3 minutes until fragrant. Cool and extract seeds; discard pods.","Combine seeds with remaining ingredients and grind to fine powder.","Store in airtight container at room temperature for up to 6 months."],"by":"Rick","attr":"Marcia","desc":"Berbere is an Ethiopian spice blend that has many applications. It's like garam masala to Indian Cuisine. This mixture works particularly well in the Ghanian Peanut Chicken Soup.","prep":"5 minutes","cook":"20 minutes","total":"25 minutes","serves":"1/3 cup","diff":1,"tools":"Skillet; Mortar/pestle or spice blender","cat":"spice-mixes-sauces"},{"slug":"BlueDress","title":"Blue Cheese Dressing","ing":["2 1/2 ounces blue cheese","3 tablespoons buttermilk (or regular milk for milder flavor)","3 tablespoons sour cream","2 tablespoons mayonnaise","2 teaspoons white wine vinegar","1/4 teaspoon sugar","1/8 teaspoon garlic powder","Freshly ground salt and pepper to taste"],"dir":["In a small bowl, combine the blue cheese and buttermilk together until it resembles large-curd cottage cheese.","Stir in the remaining ingredients until the mixture is well blended.","Season to taste with salt and pepper."],"by":"Cathy","attr":"Cathy","desc":"Great blue cheese dressing.","prep":"20 minutes","cook":"20 minutes","serves":"2 (scale up to make more)","diff":1,"cat":"spice-mixes-sauces"},{"slug":"TailSauce","title":"Cocktail Sauce","ing":["Ketchup (1 bottle)","Prepared horseradish (1 bottle)","Lemon","Light brown sugar (1 box)"],"dir":["Transfer one cup of ketchup into a bowl or storage container.","Incorporate horseradish beginning with 2 tablespoons.","Squeeze in lemon juice, commencing with half a lemon.","Add brown sugar starting at 1 tablespoon.","Combine thoroughly and evaluate flavor, adjusting components to preference."],"by":"Rich","attr":"Pap","desc":"A framework for a spicy sauce that goes great with shrimp that allows customization through additional horseradish, lemon juice, and sugar.","prep":"5 minutes","cook":"5 minutes","serves":"4-6","diff":1,"cat":"spice-mixes-sauces"},{"slug":"FiveSpice","title":"Five Spice","ing":["4 parts Szechuan pepper","4 parts star anise","5 parts fennel seeds","2 parts cloves","2 parts cinnamon","2 parts salt","1 part white pepper"],"dir":["Combine all ingredients and grind or blend until finely ground."],"by":"Rick","attr":"Richard","desc":"An Eastern spice blend used in numerous recipes, notably Crispy Duck. Making your own version elevates your culinary reputation.","prep":"5 minutes with a spice blender; considerably longer without one","cook":"5 minutes","total":"10-15 minutes (plus grinding time if needed)","serves":"Formula-based; adjust quantities as desired","diff":1,"tools":"Mortar or spice blender","notes":"This recipe uses proportional ratios rather than fixed measurements, allowing flexibility in batch size.","cat":"spice-mixes-sauces"},{"slug":"Giblet","title":"Giblet Gravy","ing":["Chicken gizzard (muscle found in the digestive tract of chickens), neck, liver and other bony pieces as desired","Salt, pinch","2 boiled eggs, chopped","2 tablespoons flour, heaping","1/2 cup milk"],"dir":["Bring 4 cups water to a boil in a large saucepan with a pinch of salt. Add gizzard, neck, liver, and bony pieces. Reduce heat and simmer until tender, approximately 1-2 hours.","Remove meat from bones and discard bones and gristle. Add chopped eggs to the broth.","Combine flour and milk in a shakable container. Mix thoroughly to eliminate lumps.","Bring broth to a boil. Gradually add flour-milk mixture until reaching desired thickness."],"by":"Mary/Gram/Mom","attr":"Mary/Gram/Mom","desc":"Old time gravy straight from the farm","prep":"10 minutes","cook":"2 hours 45 minutes","total":"2 hours 55 minutes","serves":"16 (4 tablespoon servings)","diff":2,"cat":"spice-mixes-sauces"},{"slug":"greek-salad-dressing","title":"Greek Salad Dressing","ing":["1 cup olive oil","1 tablespoon garlic powder","1 tablespoon dried oregano","1 tablespoon dried basil","2 teaspoons dried basil","2 teaspoons pepper","2 teaspoons salt","2 teaspoons onion powder","2 teaspoons Dijon-style mustard","1 cup red wine vinegar"],"dir":["Combine all the ingredients in a bowl and mix well."],"by":"Susan Hodge","attr":"Leon & Mary Brock","desc":"This is a flavorful dressing that can be be used with your favorite salad or as a marinade","prep":"5 minutes","cook":"5 minutes","serves":"48 2 teaspoon servings","diff":1,"cat":"spice-mixes-sauces"},{"slug":"Holland","title":"Hollandaise Sauce","ing":["2 tablespoons lemon juice","2 egg yolks","1/2 cup butter, cut into 3 parts","1/4 teaspoon salt","Hot sauce, splash"],"dir":["Combine lemon juice, egg yolks, and first butter portion in a double boiler. Heat over hot water with constant stirring until butter dissolves and mixture thickens.","Incorporate the second butter piece, continuing to stir until melted and sauce reaches greater thickness.","Add final butter portion and stir until consistency resembles mayonnaise. Remove from heat.","Season with salt and hot sauce, then beat until achieving a glossy finish."],"by":"Marilyn and Marlene","attr":"Marilyn and Marlene","desc":"A classic, often used on eggs (Benedict), asparagus and salmon.","prep":"5 minutes","cook":"15 minutes","total":"20 minutes","serves":"1","diff":2,"tools":"Double boiler","cat":"spice-mixes-sauces"},{"slug":"Kaplan","title":"Kaplan Marinara Sauce","ing":["2 large onions, chopped","3 cloves garlic, chopped","1 green pepper, chopped","Olive oil","5 pounds tomatoes","8 ounces tomato paste","2 tablespoons oregano","2 tablespoons basil","1 tablespoon sugar","½ cup parmesan cheese","Additional vegetables (mushrooms suggested)"],"dir":["Sauté onions, garlic, and green pepper in olive oil.","Add remaining ingredients except parmesan; simmer uncovered 2-3 hours.","Stir in parmesan before serving."],"by":"Marcia","attr":"Roy Kaplan, Tammy's father-in-law","desc":"This is best made with homegrown tomatoes. It freezes very well...we often make a batch and bottle in Mason jars and freeze until we need it.","prep":"20 minutes","cook":"2-3 hours","total":"3½ hours","diff":2,"tools":"Large pot; Mason jars for freezing","cat":"spice-mixes-sauces"},{"slug":"mardi-gras-rub","title":"Mardi Gras Rub","ing":["2 tablespoons dried rosemary","2 tablespoons chili powder","1 tablespoon kosher salt","1 tablespoon garlic powder","1 tablespoon dried ground oregano","1 tablespoon Tony's Creole seasoning","1½ teaspoons cumin","1 teaspoon dry yellow mustard","1 teaspoon black pepper"],"dir":["Combine all ingredients."],"by":"Leon and Mary","attr":"Mary","desc":"Great on chicken wings and chicken strips","prep":"10 minutes","total":"10 minutes","serves":"Coats approximately 5 lbs of chicken wings","diff":1,"cat":"spice-mixes-sauces"},{"slug":"Marin","title":"Marinara Sauce","ing":["2 (28 oz) cans whole tomatoes, packed in juice","2 tablespoons olive oil","1 medium onion, chopped fine (about 1 cup)","2 medium garlic cloves, minced (about 2 teaspoons)","1/2 teaspoon dried oregano","1/3 cup dry red wine (Chianti or Merlot)","3 tablespoons chopped fresh basil","1 tablespoon extra virgin olive oil","Salt and pepper to taste","1-2 teaspoons sugar (optional, to reduce acidity)"],"dir":["Drain tomatoes; retain 2½ cups juice and set aside ¾ cup tomatoes.","Sauté onion in olive oil until golden; add garlic and oregano.","Cook drained tomatoes over medium-high heat until liquid evaporates and browning occurs.","Add wine, then reserved juice; simmer until thickened.","Blend sauce with reserved tomatoes until slightly chunky; finish with basil, extra virgin olive oil, and seasonings."],"by":"Marcia","attr":"America's Test Kitchen","desc":"Classic Marinara can be used as a dipping sauce or over any pasta, with or without meat.","prep":"15 minutes","cook":"55 minutes","total":"70 minutes","serves":"Sufficient for at least 1 pound of pasta","diff":3,"tools":"Food processor or immersion blender","cat":"spice-mixes-sauces"},{"slug":"Micro","title":"Microwave Jam","ing":["3 cups berries","1/4 cup lemon juice","1/2 teaspoon grated lemon peel","1/4 teaspoon ground cinnamon","1 1/2 cups sugar","1/2 teaspoon butter"],"dir":["Lightly crush berries to yield 2 cups.","Combine crushed berries with remaining ingredients in a 2 1/2 to 3-quart casserole dish. Let stand approximately 30 minutes until juices release.","Microwave uncovered on high power.","Beginning at 6-8 minutes when boiling starts, stir every 2-3 minutes. Continue cooking for 13 minutes total.","Test consistency by cooling a teaspoon sample in freezer (5-7 minutes) or refrigerator (15 minutes). Heat an additional 2 minutes if thicker texture is desired."],"by":"Marcia","attr":"Marcia","desc":"This berry preserve works with any single type or mixed berries. It serves as an excellent ice cream topping and maintains quality in the refrigerator for several months.","prep":"5 minutes","cook":"50 minutes","total":"55 minutes","serves":"84 (2 teaspoon servings)","diff":2,"cat":"spice-mixes-sauces"},{"slug":"PasSalDress","title":"Pasta Salad Dressing","ing":["1 packet Good Seasons Italian dressing mix","2 ounces balsamic vinegar","2 ounces Paul Newman's Own Italian dressing","3-4 splashes red wine vinegar","Salt and pepper, to taste"],"dir":["Mix the Good Seasons dressing per package instructions.","Combine 4 oz of prepared dressing with balsamic vinegar and Paul Newman's Own Italian dressing.","Add red wine vinegar splashes and season with salt and pepper."],"by":"Susan Hodge","attr":"Susan Hodge","desc":"A nice light dressing good on your favorite salad. It is especially good on pasta salads and can be used as a good marinade as well","prep":"5 minutes","cook":"5 minutes","serves":"8","diff":1,"cat":"spice-mixes-sauces"},{"slug":"PeanutRub","title":"Peanut Rub","ing":["10 parts toasted ground peanuts","1 part ginger","1 part paprika","1 part onion","1 part garlic","½ part black peppercorns","½ part red chilies","½ part cayenne pepper","½ part white peppercorns"],"dir":["Process all ingredients using a mortar, pestle, or blender until reaching fine powder consistency.","Adjust ingredient ratios according to personal taste preferences."],"by":"Rick","attr":"Marcia","desc":"A Caribbean-style spice blend suitable for pork or chicken, often used in place of Jamaican Jerk seasoning. Works well with Ghanian Peanut Chicken Soup.","prep":"5 minutes","cook":"5 minutes","serves":"Proportional formula—adjust quantities as needed","diff":1,"tools":"Mortar and pestle or spice blender","cat":"spice-mixes-sauces"},{"slug":"Pizza","title":"Pizza Sauce","ing":["2 tablespoons olive oil","1 teaspoon minced garlic","8 ounce can of tomato sauce","1 teaspoon sugar","1 teaspoon salt"],"dir":["Sauté the olive oil and garlic in a saucepan over medium heat for 10 minutes.","Add the tomato sauce, sugar, and salt and cook for an additional 10-20 minutes or until reduced to the desired consistency."],"by":"Leon and Mary Brock","attr":"Lydia Barineau","desc":"Homemade pizza is always a winner!","prep":"5 minutes","cook":"30 minutes","total":"35 minutes","serves":"Enough for one pizza","diff":1,"cat":"spice-mixes-sauces"},{"slug":"Sticky","title":"Sticky Fingers Rub","ing":["1 part paprika","1/2 part salt","1/4 part pepper","1/4 part cayenne pepper","1/4 part garlic powder"],"dir":["Combine all components and apply as a rub. Store any extra in an airtight container."],"by":"Leon & Mary","attr":"Sticky Fingers","desc":"Dry rub inspired by Memphis Dry ribs at Sticky Fingers","prep":"5 minutes","cook":"5 minutes","serves":"The recipe is more of a formula that shows the ratio of all the ingredients. Make as much as you need.","diff":1,"cat":"spice-mixes-sauces"},{"slug":"SweMus","title":"Sweet Potato Mustard","ing":["1/2 cup apple cider vinegar","1/3 cup yellow mustard seeds","1 bay leaf","1 cinnamon stick","1 cup water","1 tablespoon sorghum syrup or light molasses","1 tablespoon bourbon","2/3 cup sweet potato puree","1/4 cup packed brown sugar","2 tablespoons ground mustard","1/2 teaspoon sweet paprika","1/2 teaspoon kosher salt","Pinch allspice","Pinch cayenne pepper"],"dir":["Boil vinegar; add mustard seeds, bay leaf, and cinnamon stick. Cover and steep 1 hour.","Discard bay leaf and cinnamon stick. Blend seeds with vinegar, water, sorghum, and bourbon until smooth.","Add sweet potato puree; blend until smooth.","Return to saucepan and boil gently for 5 minutes, stirring frequently.","Whisk in brown sugar, ground mustard, paprika, salt, allspice, and cayenne.","Simmer 10 minutes until thickened.","Refrigerate."],"by":"Susan Hodge","attr":"Jack's Cosmic Dogs","desc":"A distinctive condiment combining sweet potato with mustard, famous at Jack's Cosmic Dogs in Mount Pleasant, SC. The recipe suggests versatile applications beyond hot dogs, including turkey and ham sandwiches.","prep":"15 minutes","cook":"1 hour 30 minutes","serves":"66 (2-teaspoon servings)","diff":2,"tools":"Blender","cat":"spice-mixes-sauces"},{"slug":"Tzatziki","title":"Tzatziki Mix","ing":["1/2 teaspoon white pepper","1 teaspoon granulated garlic","1 1/2 teaspoons salt","1 pint sour cream"],"dir":["Combine the first three dry ingredients, then blend with sour cream. Refrigerate until ready to serve."],"by":"Marcia","attr":"International Foods","desc":"Very good with grape leaves, baked potato, etc.","prep":"5 minutes","cook":"5 minutes","serves":"1 pint","diff":1,"cat":"spice-mixes-sauces"}]},{"slug":"vegetables","name":"Vegetables & Sides","recipes":[{"slug":"AnnChina","title":"Ann's Chinese Rice Salad","ing":["Rice: 1 cup long grain rice, cooked per package directions","Rice: 6 spring onions, chopped","Rice: ½ cup red bell pepper, finely chopped","Rice: ½ cup currants or raisins","Rice: ½ cup roasted cashew nuts","Rice: 2 tablespoons fresh parsley, chopped","Rice: 1 small can (8.75 oz) sweet corn, drained","Soy Sauce Dressing: 3 ounces sunflower oil","Soy Sauce Dressing: 2 tablespoons soy sauce","Soy Sauce Dressing: 1 tablespoon lemon juice","Soy Sauce Dressing: ½ clove garlic, crushed","Soy Sauce Dressing: Salt and pepper to taste"],"dir":["Combine warm cooked rice with spring onions, red pepper, currants, cashews, parsley, and corn.","Whisk together sunflower oil, soy sauce, lemon juice, garlic, salt, and pepper.","Pour dressing over rice mixture and toss well.","Cool completely, then refrigerate overnight before serving."],"by":"Marcia","attr":"Ann, an expat friend","desc":"A make-ahead side dish ideal for warm weather gatherings, designed to complement grilled proteins.","prep":"20 minutes","cook":"20 minutes","total":"40 minutes","serves":"8-10","diff":1,"cat":"vegetables"},{"slug":"BEANS","title":"BBQ Beans","ing":["1 sausage patty","1 hamburger patty","2 (15 oz) cans beans","About 1/2 the volume of the beans in brown sugar","Worcestershire sauce (to coat pan)","4 tsp vinegar","2 tsp liquid smoke","3 tsp mustard","8 dashes tabasco","3-4 second squirt ketchup","1 tsp BBQ sauce","Garlic powder (to cover top)","1/4 medium onion, diced"],"dir":["Brown sausage and hamburger in Dutch oven; retain or drain grease as desired.","Add remaining ingredients and heat until bubbling begins. Reduce heat and simmer 5 minutes."],"by":"Rick","attr":"Max/Dad/Pap","desc":"A recreation inspired by a beloved restaurant chain's beans recipe. This versatile dish allows for omitting the meat components if preferred. The original preparation method involved grilling, though stovetop cooking produces equally satisfying results.","prep":"15 minutes","cook":"15 minutes","total":"30 minutes","serves":"6-8","diff":2,"tools":"Dutch oven","cat":"vegetables"},{"slug":"bleunotblue","title":"Bleu Cheese Coleslaw","ing":["Slaw: 1/2 small head green cabbage, shredded (~1 pound)","Slaw: 4 ounces crumbled bleu cheese, or to taste","Slaw: 1/3 cup red onion, chopped","Slaw: 1/3 cup carrot, shredded","Dressing: 1 cup mayonnaise","Dressing: 1/4 cup half & half","Dressing: 1 tablespoon olive oil","Dressing: 1/2 cup sour cream","Dressing: 1/8 cup balsamic vinegar","Dressing: Salt, to taste","Dressing: Cayenne pepper, to taste"],"dir":["Combine cabbage, bleu cheese, onion, and carrot in a large bowl.","Whisk together mayonnaise, half & half, olive oil, sour cream, balsamic vinegar, salt, and cayenne pepper in another bowl until thoroughly blended.","Pour dressing over slaw ingredients and mix until evenly distributed."],"by":"Rick","attr":"The Boathouse in The Holy City","desc":"A great side for a BBQ. Be sure to save some to make a Jack's Cosmic Dog, bleu cheese coleslaw and sweet potato mustard on a hotdog!","prep":"30 minutes","cook":"No cooking, just chopping & stirring","total":"30 minutes","serves":"16 (1/2 cup serving); makes 2 quarts","diff":1,"tools":"2 large bowls","cat":"vegetables"},{"slug":"BroRice","title":"Brown Rice","ing":["1 stick butter","1 cup white rice","1 can french onion soup","1 (10½ ounce) can beef broth"],"dir":["Heat oven to 325°F. Melt butter in sauté pan over medium heat.","Add rice and stir frequently for 15–20 minutes until browned. Transfer to casserole dish.","Mix in french onion soup and beef broth.","Cover and bake for one hour at 325°F."],"by":"Leon and Mary Brock","attr":"Lydia Barineau","desc":"NOT HEALTHY BROWN RICE","prep":"10 minutes","cook":"80 minutes","total":"90 minutes","serves":"4","diff":1,"tools":"Sauté pan; 2-quart covered casserole dish; Wooden spoon","cat":"vegetables"},{"slug":"Cajun","title":"Cajun Red Beans and Rice","ing":["1 package (22 ounces) dried small red kidney beans","6 cups water","2 ham hocks (or 1 slice cooked ham)","1 pound smoked sausage, sliced (half hot, half regular)","3 cloves garlic, minced","1 cup onions, chopped","1 cup green peppers, chopped","2 cups celery, chopped","1 bay leaf","1 teaspoon Worcestershire sauce","1/4 teaspoon red pepper sauce","1 1/2 teaspoons salt","3 tablespoons chopped parsley","Pepper to taste","2 cups cooked rice"],"dir":["Rinse beans; place in pot with water and ham hocks. Boil, then simmer covered 1 hour.","Add sausage; cook covered 1 hour, stirring occasionally.","Add garlic, onions, peppers, celery, and bay leaf. Cook covered on low heat 1½ hours until beans soften.","Mash 1 cup beans; return to pot. Remove ham hocks, add meat back. Season with Worcestershire, pepper sauce, salt, parsley, and pepper. Simmer 5 minutes.","Serve over rice."],"by":"Marcia","attr":"Mary/Gram","desc":"Consider what type of rice you are using and plan accordingly for cooking time.","prep":"20 minutes","cook":"3 hours 40 minutes","total":"4 hours","serves":"4-6","diff":2,"cat":"vegetables"},{"slug":"CheesePotat","title":"Cheese Potatoes","ing":["4 medium potatoes, peeled and cubed (1\")","2-3 tablespoons flour","1 teaspoon sugar","Milk (amount to taste)","Grated extra sharp cheddar cheese","Butter","Fresh ground pepper","Salt"],"dir":["Boil salted potatoes until tender but not mushy (approximately 10 minutes); drain partially, reserving cooking water.","Reserve drained potato water for sauce adjustment.","Mix flour, sugar, and milk; pour over potatoes and stir.","Add cheese, butter, and pepper to finish."],"by":"Marcia","attr":"Gram","desc":"A family classic featuring boiled potato cubes in a cheese sauce. The recipe emphasizes proper cooking technique: do not overcook your potatoes and drain adequately. Cube size affects cooking time, and the creator notes you can never have too much cheese.","prep":"15 minutes","total":"30 minutes","serves":"4","diff":3,"notes":"Leftover potatoes thicken when refrigerated; reconstitute with reserved cooking water before reheating.","cat":"vegetables"},{"slug":"Collard","title":"Collard Greens","ing":["House Seasoning: 1 cup salt","House Seasoning: 1/4 cup black pepper","House Seasoning: 1/4 cup garlic powder","Collards: 1/2 pound smoked turkey wings","Collards: 1 tablespoon House Seasoning","Collards: 1 tablespoon seasoned salt","Collards: 1 tablespoon hot red pepper sauce","Collards: 1 large bunch collards","Collards: 1 tablespoon butter"],"dir":["Combine seasoning ingredients; store in airtight container up to 6 months.","Boil 3 quarts water with smoked meat, seasonings, and hot sauce for 1 hour at medium heat.","Wash collards thoroughly. Strip leaves from stems (tender young leaves may be left whole). Stack and slice into 1/2–1 inch pieces.","Add greens and butter to pot; simmer 45–60 minutes, stirring occasionally. Adjust seasoning to taste."],"by":"Marcia","attr":"Paula Deen","desc":"Great for your New Year's Day fare...or any time throughout the year!","prep":"20 minutes","cook":"2 hours","total":"2 hours 20 minutes","serves":"4–6","diff":3,"tools":"Large pot","cat":"vegetables"},{"slug":"Consomme","title":"Consomme Rice","ing":["1/2 stick butter","1/2 chopped onion","2 (10.5 ounce) cans beef consommé","1 cup uncooked rice","1 can mushrooms (optional)"],"dir":["Heat oven to 300°F.","Brown onions in butter.","Combine the onions and butter with the remaining ingredients. Cover with foil and bake for 45 minutes.","Remove the foil and bake for another 15 minutes."],"by":"Susan Hodge","attr":"Marilyn Brock","desc":"Rice baked with onion, beef consomme, and butter for a delicious and easy-to-make side dish","prep":"10 minutes","cook":"60 minutes","total":"1 hour 10 minutes","serves":"6","diff":1,"cat":"vegetables"},{"slug":"Creamspin","title":"Creamed Spinach","ing":["2 tablespoons butter","1/2 yellow onion, diced","1 tablespoon flour","1 (16 oz) bag frozen chopped spinach, cooked per directions","3 oz pepper jack cheese, cubed (or substitute)","1 1/2 cups 2% milk","1/4 cup reserved spinach liquid","1 teaspoon Worcestershire","1 teaspoon red pepper flakes","Salt and fresh ground pepper to taste"],"dir":["Melt butter in medium saucepan over medium-low heat; add diced onions and cook until translucent.","Sprinkle flour over mixture and blend well.","Cook spinach per directions; drain and reserve 1/4 cup liquid.","Add spinach to onion mixture and stir.","Add cheese and allow to melt.","Pour in milk and reserved spinach liquid; stir 30 seconds to prevent lumps.","Add Worcestershire, red pepper flakes, salt, and pepper.","Reduce heat to low and cook 15-20 minutes."],"by":"Susan Hodge","attr":"Marilyn Brock","desc":"A creamy side dish that pairs wonderfully with beef, pork and chicken.","prep":"5 minutes","cook":"15-20 minutes","total":"30 minutes","serves":"6-8","diff":1,"cat":"vegetables"},{"slug":"FriedPotat","title":"Fried Potatoes","ing":["4 medium potatoes, peeled and thinly sliced","1/4 teaspoon salt","1/4 teaspoon pepper","1/4 cup flour","4–5 tablespoons olive oil (bacon grease or vegetable oil acceptable)","Horseradish for serving"],"dir":["Peel and quarter potatoes lengthwise; slice to 1/4\" thickness. Place in a single layer on a dish towel or paper towels; press softly to remove as much moisture as feasible—this step ensures crispiness.","Combine potatoes with salt, pepper, and flour in a bowl; ensure even coating.","Heat oil over medium-high heat. Add potatoes, cover, and stir frequently until browning. Season further if desired. Lower heat to finish cooking approximately 20 minutes.","Test doneness with fork or knife; avoid overcooking.","Serve with horseradish."],"by":"Marcia","attr":"Mary/Mom/Gram Horn","desc":"A crispy potato side dish requiring careful moisture removal for optimal texture.","prep":"15 minutes","cook":"25 minutes","total":"40 minutes","serves":"4","diff":2,"tools":"Dish towel or paper towels","cat":"vegetables"},{"slug":"FriedRice","title":"Fried Rice","ing":["2 tablespoons oil","1/4 cup diced onion","2 cups cooked rice","2 beaten eggs","1 tablespoon soy sauce","1/2 teaspoon salt","Optional: 2 cups chopped cooked meat, green pepper, or peanuts"],"dir":["Heat oil in pan over medium heat; fry onions until brown (approximately 5 minutes).","Add rice and sauté 2-3 minutes.","Add eggs seasoned with soy sauce and salt.","Sauté until cooked through, 2-3 minutes."],"by":"Marcia","attr":"Mary/Mom/Gram Horn","desc":"A family recipe inspired by Lucy Ho's Chinese restaurant in Tallahassee, created by Gram and Pap. Served alongside their cashew chicken, egg rolls, and hot mustard. The preparation involves chopping, grating, sauteing and lots and lots of conversation. Chopsticks required for serving.","prep":"5 minutes","cook":"10 minutes (plus rice cooking time if needed)","total":"15 minutes plus rice preparation","serves":"2-4","diff":1,"tools":"Chopsticks","cat":"vegetables"},{"slug":"Hoppin","title":"Hoppin John","ing":["4 cups water","1 cup dried cowpeas (or black-eyed peas as substitute)","1 bay leaf","2-3 slices thick-cut bacon, diced","1/2 onion, peeled and diced","1 cup Carolina aromatic rice","2 cups pork or chicken stock","Hot sauce, salt, and pepper to taste"],"dir":["Simmer cowpeas with water and bay leaf until tender, approximately 30 minutes. Drain and reserve.","Cook bacon in sauté pan over medium heat until crispy; remove and set aside.","Sauté diced onion in bacon fat until translucent.","Stir in rice to coat with fat; pour in stock and bring to boil.","Reduce heat to low, cover, and simmer 10 minutes until liquid absorbs.","Remove from heat and steam 5 additional minutes.","Combine cooked cowpeas with rice mixture.","Season with hot sauce, salt, and pepper as desired."],"by":"Marcia","attr":"Charleston Cooks","desc":"Traditional Southern dish combining legumes and rice, considered essential for New Year's Day celebrations. The recipe comes from a cooking class experience.","prep":"15 minutes","cook":"45 minutes","total":"1 hour","serves":"6","diff":1,"tools":"Small saucepan; Sauté pan","notes":"Traditionally served alongside collard greens for New Year's Day for good fortune.","cat":"vegetables"},{"slug":"Cheesy","title":"Lou's Potatoes","ing":["4 potatoes, peeled and cubed","½–1 cup fresh parmesan cheese, grated","1½ cups extra sharp cheddar cheese, grated","½ stick butter","2 teaspoons garlic salt","¼ teaspoon cayenne pepper","8 ounces sour cream","Salt to taste","½ cup milk"],"dir":["Preheat oven to 350-375°F.","Boil potatoes until tender. Mash lightly, leaving some texture intact.","Mix in remaining ingredients to desired taste; transfer to baking dish.","Bake uncovered 25 minutes at 350-375°F."],"by":"Marcia","attr":"Louise","desc":"A cheesy potato side dish from a golf buddy that pairs well with steaks or beef tenderloin.","prep":"15-20 minutes","cook":"25 minutes","total":"45 minutes","serves":"4","diff":1,"tools":"8\" x 11\" baking dish","cat":"vegetables"},{"slug":"Bhaji","title":"Mushroom Bhaji","ing":["3-4 tablespoons oil","1 medium onion, finely chopped","3 cloves garlic, crushed","1/2 teaspoon ground turmeric","1/2 teaspoon chili powder","1 teaspoon ground cumin","1 teaspoon ground coriander","3/4 teaspoon salt (or to taste)","1 tablespoon tomato paste","8 ounces small mushrooms, sliced or chopped","Approximately 3-4 tablespoons water (added in stages)"],"dir":["Heat oil over medium heat; cook onions until lightly golden.","Reduce heat and incorporate garlic, turmeric, chili powder, cumin, and coriander with 1 tablespoon water; fry for approximately 5 minutes, adding water as needed to prevent sticking.","Stir in salt and tomato paste; add mushrooms and mix thoroughly.","Add 2 tablespoons water, cover, and simmer 10 minutes."],"by":"Marcia","desc":"A great side for a nice Indian meal.","prep":"10 minutes","cook":"20 minutes","total":"30 minutes","serves":"4","diff":2,"tools":"Skillet with lid","cat":"vegetables"},{"slug":"PaPiWCS","title":"Peas and Potatoes in White Cream Sauce","ing":["1 pound new potatoes, rinsed, scrubbed, and quartered","1 (10 ounce) bag frozen peas","2-3 tablespoons flour","6-7 tablespoons milk","1 teaspoon sugar","Butter (several dollops)","Fresh ground pepper"],"dir":["Boil salted potatoes in dutch oven; reduce heat and simmer 6 minutes.","Add peas, increase to high heat briefly, then reduce to low for 5 more minutes.","Mix flour, milk, and sugar; set aside.","Once potatoes are tender, drain until barely covered with water.","Whisk flour mixture and stir into potatoes, adding reserved water as needed for consistency.","Add butter and pepper; serve immediately or cover for later."],"by":"Marcia","attr":"Gram","desc":"A traditional farm dish featuring new potatoes and peas in a simple white cream sauce, beloved by family members during seasonal produce availability.","prep":"15 minutes","cook":"15 minutes","total":"30 minutes","serves":"4","diff":3,"tools":"Dutch oven","cat":"vegetables"},{"slug":"PotatCakes","title":"Potato Cakes","ing":["2 cups mashed potatoes","1/2 teaspoon garlic powder","1/2 cup grated cheese","2-3 tablespoons flour","Olive oil"],"dir":["Combine all ingredients, beginning with minimal flour and adding more as needed to form a firm patty.","Shape into 4 patties.","Heat olive oil in skillet over medium heat; sauté patties until golden, then flip and brown the opposite side."],"by":"Marcia","attr":"Mary/Mom/Gram Horn via Marilyn, Marlene and Marcia","desc":"A cherished family recipe prepared using leftover mashed potatoes, traditionally served at breakfast or brunch. This could be a nice morning breakfast, brunch or an evening meal breakfast.","prep":"5 minutes","cook":"10-15 minutes","total":"10-15 minutes","serves":"4","diff":1,"tools":"Skillet","cat":"vegetables"},{"slug":"PotatSalad","title":"Potato Salad","ing":["4 medium potatoes (about 2 pounds), peeled and cut into 1-inch cubes","1 boiled egg, chopped","8 tablespoons mayonnaise","3 tablespoons mustard","1 small onion (1/2 cup), diced","4 teaspoons dill pickle relish (sweet pickle relish as alternative)"],"dir":["Boil potatoes and egg in salted water for approximately 10 minutes. Drain and cool potatoes. Ice-bath the egg for 5 minutes.","Separate and chop egg components, then combine with potatoes.","Mix in mayonnaise, mustard, onion, and relish until well combined.","Garnish with ground pepper and paprika."],"by":"Marcia","attr":"Marcia","desc":"A simple side dish featuring boiled potatoes combined with mayonnaise-based dressing and fresh ingredients.","prep":"15 minutes","cook":"10 minutes","total":"30 minutes","serves":"4","diff":1,"cat":"vegetables"},{"slug":"Scallop","title":"Scalloped Potatoes","ing":["4 cups potatoes, thinly sliced","2½ teaspoons salt","¼ teaspoon pepper","¼ cup flour","3 tablespoons butter, sliced thin","½ cup grated cheese","Milk to cover","1 small onion, thinly sliced (optional)"],"dir":["Preheat oven to 400°F.","Combine salt, pepper, and flour.","Layer potatoes, seasoned flour, cheese, and butter slices in baking dish. Repeat layering. Pour milk over potatoes to top layer.","Bake uncovered 45 minutes at 400°F."],"by":"Marcia","attr":"Mary/Mom/Gram","desc":"A homemade side dish predating commercial packaged versions, made with whole ingredients rather than mixes.","prep":"15 minutes","cook":"45 minutes","total":"1 hour","serves":"6","diff":1,"tools":"3½\" high x 7½\" round or square baking dish (2-quart capacity, larger acceptable)","notes":"Optional addition of sliced onion between layers enhances flavor.","cat":"vegetables"},{"slug":"Squash","title":"Squash Casserole","ing":["4 small/medium yellow squash (2-3 inch diameter)","1 small onion, cut into large chunks","2 tablespoons butter","1/2 cup fried onions (or more to taste)","1 can cream of celery soup","1/2 cup grated cheddar cheese (or more)"],"dir":["Preheat oven to 350°F. Cook squash with onion in water until tender. Drain, discard onion, season with butter, and mash.","Combine the mashed squash, fried onions, cream of celery soup, and cheddar cheese.","Bake uncovered at 350°F for 30 minutes."],"by":"Susan Hodge","attr":"Marilyn Brock","desc":"This creamy squash recipe is an often requested item at Thanksgiving. You may prepare the squash the night before, cover and refrigerate.","prep":"15 minutes","cook":"30 minutes","total":"45 minutes","serves":"6","diff":1,"tools":"Ungreased 8\" x 8\" or 9\" x 9\" baking dish (9\" x 13\" if doubled); Medium saucepan","cat":"vegetables"},{"slug":"Turmeric","title":"Turmeric Potato Salad","ing":["4 medium potatoes, cubed","3 tablespoons flour","3 tablespoons sugar","2 tablespoons vinegar","½–¾ cup milk","Butter (walnut-sized piece)","Turmeric (for yellow color)","Pickle relish (to taste)","2 tablespoons diced onion","Pimento (to taste)","1 hard-boiled egg, chopped"],"dir":["Boil potatoes until tender (10-15 minutes); drain.","In separate saucepan, combine flour, sugar, vinegar, milk, butter, and turmeric; cook until thickened.","Stir pickle relish, onion, pimento, and egg into sauce; salt to taste.","Pour sauce over potatoes; serve warm."],"by":"Susan Hodge","attr":"Grandma Long","desc":"Gram always made it right before dinner and Marilyn always looked forward to getting a warm sample before serving","prep":"15 minutes","cook":"10-15 minutes (potatoes)","total":"40-45 minutes","serves":"4-6","diff":2,"tools":"Standard saucepan","cat":"vegetables"}]},{"slug":"vegetarian-mains","name":"Vegetarian Mains","recipes":[{"slug":"Burrito","title":"Burrito Wraps","ing":["1 (4 ounce) can green chilies, chopped","1 small onion, chopped (~1/2 cup)","1 (2.25 ounce) can black olives, chopped","1 (8 ounce) package cream cheese (softened)","2 (10\") flour burrito wraps","Jar of salsa (preferred variety)"],"dir":["Combine chopped chilies, onions, and olives with softened cream cheese.","Spread mixture evenly on burrito wraps and roll tightly; wrap in plastic wrap and refrigerate for 2-3 hours.","Slice each wrap into thin pinwheel pieces, arrange on a serving platter, and serve alongside salsa."],"by":"Marcia","attr":"North American Expat Ladies","desc":"This is a real easy make ahead appetizer that's great to pull out of the refrigerator.","prep":"15 minutes","total":"2 - 3 hours","serves":"4 - 6","diff":1,"cat":"vegetarian-mains"},{"slug":"Eggplant","title":"Eggplant Parmesan","ing":["1 eggplant","3 eggs, beaten","1 cup cornmeal","3/4 cup salad oil","1/2 cup parmesan cheese","2 teaspoons dried oregano","1/2 pound sliced mozzarella cheese","3 (8 ounce) cans tomato sauce"],"dir":["Preheat oven to 350°F. Peel and slice eggplant into quarter-inch rounds.","Coat each slice by dipping in beaten eggs, then cornmeal. Brown slices in hot oil until golden on both sides.","Layer eggplant in casserole dish, alternating with parmesan, oregano, mozzarella, and tomato sauce, finishing with mozzarella on top.","Bake uncovered for 30 minutes until bubbly and cheese melts. Rest 10 minutes before serving."],"by":"Marilyn","attr":"Marilyn","desc":"This was a summertime favorite with seasonal eggplant. Add salad & bread & it's a meal!","prep":"20 minutes","cook":"30 minutes","total":"1 hour","serves":"8","diff":3,"tools":"8\" x 11\" lasagna pan (2-quart rectangular pan)","cat":"vegetarian-mains"},{"slug":"GBMGP","title":"Garlic Butter & Mushroom Gnocchi Packets","ing":["Butter sauce: 1/4 cup clarified butter, ghee, or duck fat","Butter sauce: 2-3 cloves garlic, minced","Butter sauce: 1/2 bouillon cube","Butter sauce: Thyme","Butter sauce: Crushed red chili pepper flakes","Butter sauce: Salt & pepper","1 pound mushrooms, cleaned & chopped","1 pound gnocchi","Fresh parsley for garnish"],"dir":["Preheat oven to 380°F.","Lay out foil packets (heavy-duty or double layer).","Combine butter, garlic, bouillon, thyme, chili pepper, salt, and pepper; melt together.","Place mushrooms and gnocchi on foil; drizzle with three-quarters of butter mixture.","Add water if not using mushrooms.","Seal packets and bake 15-20 minutes.","Open, add remaining butter, and stir.","Broil 3-5 minutes."],"by":"Rich","desc":"Aside from being pretty tasty and easy to assemble, these packets are great if you need to prepare meals ahead of time. The recipe can be frozen for later use.","prep":"5 minutes","cook":"18-25 minutes","total":"35 minutes","serves":"4","diff":1,"cat":"vegetarian-mains"},{"slug":"Mujadara","title":"Mujadara","ing":["Yogurt sauce: 1 cup plain whole milk yogurt","Yogurt sauce: 2 tablespoons lemon juice","Yogurt sauce: ½ teaspoon minced garlic","Yogurt sauce: ½ teaspoon salt","Fried onions: 2 pounds onions, halved and sliced crosswise into ¼\" pieces","Fried onions: 2 teaspoons salt","Fried onions: 1½ cups vegetable oil","Rice & lentils: 1¼ cups green or brown lentils (not French lentils)","Rice & lentils: 1¼ cups rice","Rice & lentils: 3 cloves garlic, minced","Rice & lentils: 1 teaspoon ground coriander","Rice & lentils: 1 teaspoon ground cumin","Rice & lentils: ½ teaspoon ground allspice","Rice & lentils: ½ teaspoon ground cinnamon","Rice & l function canonId(id) { let n = 0; while (!recBy[id] && ALIAS[id] && n++ < 8) id = ALIAS[id]; return id; }
function lookup(id) { return recBy[canonId(id)] || null; }
function applyOverrides(rows) {
  RROWS = rows || [];
  for (const k in ALIAS) delete ALIAS[k];
  RROWS.forEach(x => { if (x.deleted && x.r && typeof x.r.to === "string") ALIAS[x.cat + "~" + x.slug] = x.r.to; });
  D.cats.forEach((c, ci) => {
    const base = BASE_D.cats[ci].recipes, mine = RROWS.filter(x => x.cat === c.slug);
    const gone = new Set(mine.filter(x => x.deleted).map(x => x.slug)), edits = {};
    mine.filter(x => !x.deleted && x.r).forEach(x => edits[x.slug] = x.r);
    const list = [];
    base.forEach(b => { if (!gone.has(b.slug)) list.push(JSON.parse(JSON.stringify(edits[b.slug] || b))); });
    mine.filter(x => !x.deleted && x.r && !base.some(b => b.slug === x.slug)).forEach(x => list.push(JSON.parse(JSON.stringify(x.r))));
    list.forEach(r => { r.cat = c.slug; });
    const sk = r => String(r.title || "").toLowerCase().replace(/^[^a-z0-9]+/, "");   // A-Z by title, ignoring leading symbols like $ or quotes
    list.sort((a, b) => sk(a).localeCompare(sk(b), undefined, { numeric: true }));
    c.recipes = list;
  });
  buildIndex();
  try {   // saved favorites and grocery picks follow a recipe that was moved to another chapter

}

function shrinkPhoto(file, maxSide, quality) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      try {
        const k = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight)), w = Math.max(1, Math.round(img.naturalWidth * k)), h = Math.max(1, Math.round(img.naturalHeight * k));
        const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
        const cx = cv.getContext("2d"); cx.fillStyle = "#fff"; cx.fillRect(0, 0, w, h); cx.drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(url); resolve(cv.toDataURL("image/jpeg", quality));
      } catch (e) { URL.revokeObjectURL(url); reject(e); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("img")); };
    img.src = url;
  });
}
